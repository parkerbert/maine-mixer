<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allagash Ambience</title> 
    <link rel="icon" type="image/png" href="favicon.png"> 
    
    <style>
        /* (Styles omitted for brevity, assumed to be the same as before) */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            font-family: 'Arial', sans-serif;
            cursor: none;
            color: #C2E2CC; 
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2; 
            transition: opacity 3.0s ease-in-out !important; 
        }

        .bg-current { opacity: 1; }
        .bg-next { opacity: 0; }
        
        h1 { font-size: 3.5em; font-family: 'Garamond', 'Times New Roman', serif; color: #C2E2CC; text-shadow: 0 0 10px rgba(194, 232, 204, 0.5); margin-bottom: 5px; }
        h2 { font-size: 1.5em; font-family: 'Garamond', 'Times New Roman', serif; color: #AACCB8; text-shadow: 0 0 5px rgba(194, 232, 204, 0.3); margin-top: 0; margin-bottom: 50px; }
        
        .container {
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            background-color: rgba(30, 45, 60, 0.85); 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: -1; 
        }

        #audioPad {
            width: 700px; 
            height: 700px; 
            border: 2px solid #79C2A8;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3); 
            box-shadow: 0 0 15px #79C2A8;
            margin: 0;
            border-radius: 5px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .pad-label {
            position: absolute;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #79C2A8;
            font-size: 0.9em;
            border-radius: 3px;
            transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
            pointer-events: none;
        }

        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }

        .active-glow {
            box-shadow: 0 0 10px #C2E2CC;
            background-color: rgba(194, 232, 204, 0.2);
            color: white;
        }

        #mouseIndicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #C2E2CC;
            box-shadow: 0 0 10px #C2E2CC;
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 1000;
        }
        
        #explanationBox {
            position: fixed;
            top: 250px; 
            left: 250px; 

            padding: 15px;
            background-color: rgba(30, 45, 60, 0.85); 
            border: 2px solid #79C2A8; 
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
            color: #C2E2CC;
            text-align: left;
            line-height: 1.4;
            z-index: 5;
        }

        #explanationBox p {
            white-space: nowrap;
            margin: 0; 
        }

        .message-box {
            border: 1px solid #FF5555;
            background-color: rgba(255, 85, 85, 0.1);
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    
    <div id="bgLayer1" class="bg-layer bg-current"></div>
    <div id="bgLayer2" class="bg-layer bg-next"></div>

    <div id="mouseIndicator"></div>

    <div id="explanationBox">
        <p>
            SPACEBAR&nbsp;-&nbsp;Toggle between day&nbsp;and&nbsp;night<br>
            ENTER&nbsp;-&nbsp;Toggle character&nbsp;interaction
        </p>
    </div>

    <div class="container">
        <h1>Allagash Ambience</h1>
        <h2>An Audio Journey</h2> 
        
        <div id="messageBox" class="message-box"></div> 
        
        <div class="controls-and-pad">
            <div id="audioPad">
                <div id="labelTL" class="pad-label top-left">The Cabin</div> 
                <div id="labelTR" class="pad-label top-right">The Forest</div>
                <div id="labelBL" class="pad-label bottom-left">The Lake</div>
                <div id="labelBR" class="pad-label bottom-right">The Storm</div> 
            </div>
        </div>
            
    </div>
    
    <script>
        // Set up references to DOM elements
        let pad = null;
        let indicator = null; 
        let messageBox = null;
        
        let audioContext = null;
        let gainMap = {}; 
        let audioBuffers = {}; 
        let addOnPlayerMap = {}; // Key: AddOnKey, Value: <audio> element
        let isPlaying = false; 
        let audioReady = false; 
        let nightAudioLoaded = false; 
        let addOnAudioLoaded = false; 
        let audioInitiated = false; 
        let mouseInPad = false;
        let lastMouseX = 0; 
        let lastMouseY = 0;
        let crossfadePosition = 0.0;
        let isCrossfading = false;
        
        let activeAddOnKey = null; 
        let activeAddOnName = null;

        // Mapping of corner keys to human-readable names
        const cornerNames = {
            'TL': 'Cabin',
            'TR': 'Forest',
            'BL': 'Lake',
            'BR': 'Storm' 
        };

        // Mapped Add-On files (8 total, 4 Day + 4 Night) - PATHS MATCH YOUR FILE NAMES
        const addOnFilePaths = {
            TL_Day_AddOn: 'audio/Cabin_Day_AddOn.wav',    
            TL_Night_AddOn: 'audio/Cabin_Night_AddOn.wav',    
            TR_Day_AddOn: 'audio/Forest_Day_AddOn.wav',   
            TR_Night_AddOn: 'audio/Forest_Night_AddOn.wav',   
            BL_Day_AddOn: 'audio/Lake_Day_AddOn.wav',     
            BL_Night_AddOn: 'audio/Lake_Night_AddOn.wav',     
            BR_Day_AddOn: 'audio/RangerStation_Day_AddOn.wav', 
            BR_Night_AddOn: 'audio/RangerStation_Night_AddOn.wav' 
        };

        // FILE PATHS: Mapped to all 8 core ambience audio files - PATHS MATCH YOUR FILE NAMES
        const audioFilePaths = {
            TL_Day: 'audio/Cabin_Day.wav',
            TR_Day: 'audio/Forest_Day.wav',
            BL_Day: 'audio/Lake_Day.wav',
            BR_Day: 'audio/RangerStation_Day.wav', // CONFIRMED PATH
            TL_Night: 'audio/Cabin_Night.wav',
            TR_Night: 'audio/Forest_Night.wav',
            BL_Night: 'audio/Lake_Night.wav',
            BR_Night: 'audio/RangerStation_Night.wav' // CONFIRMED PATH
        };
        
        // Split keys for loading
        const initialAudioKeys = ['TL_Day', 'TR_Day', 'BL_Day', 'BR_Day'];
        const nightAudioKeys = ['TL_Night', 'TR_Night', 'BL_Night', 'BR_Night'];
        const addOnAudioKeys = Object.keys(addOnFilePaths); 

        // Core constants 
        const FADE_BUFFER_DISTANCE = 150; 
        const ISOLATION_BUFFER_SIZE = 0.333; 
        const MINIMUM_GAIN = 0.0001;
        const RAMP_TIME = 0.05; 
        const FADE_TIME_TOGGLE = 2.0; 
        const MAX_ADDON_VOLUME = 0.5;

        // --- Helper Functions ---
        
        function showMessage(text, isError = false) {
            if (!messageBox) return;
            messageBox.textContent = text;
            messageBox.style.display = 'block';
            messageBox.style.backgroundColor = isError ? 'rgba(255, 0, 0, 0.1)' : 'rgba(121, 194, 168, 0.1)';
            messageBox.style.borderColor = isError ? '#FF5555' : '#79C2A8';
            console.log(`[Status] ${text}`); 
        }

        async function loadAudioFile(url, key) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                audioBuffers[key] = audioBuffer;
            } catch (error) {
                console.error(`ERROR loading audio file ${url}:`, error);
                showMessage(`Failed to load audio file: ${url}. Check console for details.`, true); 
                return { key, success: false, error: error.message }; 
            }
            return { key, success: true };
        }
        
        function connectAndStartAmbienceSource(key, initialGain = 1.0) {
            const buffer = audioBuffers[key];
            const source = audioContext.createBufferSource();
            const gain = audioContext.createGain();

            source.buffer = buffer;
            source.loop = true;
            
            gain.gain.setValueAtTime(initialGain, audioContext.currentTime); 
            source.connect(gain);
            gain.connect(audioContext.destination);

            gainMap[key] = gain; 
            source.start(0); 
        }

        async function loadInitialAudio() {
            // (Initial Audio Loading and starting Ambience tracks - UNCHANGED)
            if (audioReady) return true;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Set initial background image
            currentBgLayer.style.backgroundImage = getRandomBackground('Day');

            showMessage("Loading Day ambiance audio files (4/16)..."); 
            
            const loadPromises = initialAudioKeys.map(key => 
                loadAudioFile(audioFilePaths[key], key)
            );

            const results = await Promise.all(loadPromises);
            
            const successfulLoads = results.filter(r => r && r.success).length;
            const totalFiles = initialAudioKeys.length;

            if (successfulLoads === totalFiles) {
                initialAudioKeys.forEach(key => connectAndStartAmbienceSource(key, 1.0)); 
                
                audioReady = true;
                isPlaying = true;
                showMessage(`Day ambiance audio ready! You can now mix.`);
                return true; 
            } else {
                showMessage(`CRITICAL ERROR: Failed to load Day ambiance audio files. Site non-functional.`, true);
                return false;
            }
        }
        
        async function loadNightAudio() {
            // (Night Audio Loading - UNCHANGED)
            if (nightAudioLoaded) return true;

            showMessage("Loading Night ambiance audio files (4/16)... Please wait.", false);

            const loadPromises = nightAudioKeys.map(key => 
                loadAudioFile(audioFilePaths[key], key)
            );

            const results = await Promise.all(loadPromises);
            const successfulLoads = results.filter(r => r && r.success).length;

            if (successfulLoads === nightAudioKeys.length) {
                nightAudioKeys.forEach(key => connectAndStartAmbienceSource(key, MINIMUM_GAIN)); 
                
                nightAudioLoaded = true;
                showMessage("Night ambiance loaded!", false);
                return true; 
            } else {
                showMessage(`ERROR: Failed to load Night ambiance files. Cannot switch mode.`, true);
                return false;
            }
        }
        
        async function loadAddOnAudio() {
            if (addOnAudioLoaded) return true;

            showMessage("Loading Add-On audio files (8/16)... Please wait.", false);
            
            // 1. Load Buffers (Still needed for the total file count and data integrity check)
            const bufferPromises = addOnAudioKeys.map(key => 
                loadAudioFile(addOnFilePaths[key], key)
            );
            const bufferResults = await Promise.all(bufferPromises);
            const successfulLoads = bufferResults.filter(r => r && r.success).length;

            if (successfulLoads === addOnAudioKeys.length) {
                // 2. Create HTML5 Audio Elements (Instead of Web Audio Source Nodes)
                addOnAudioKeys.forEach(key => {
                    const audio = new Audio(addOnFilePaths[key]);
                    audio.loop = true;
                    audio.volume = 0.0; // Start muted
                    addOnPlayerMap[key] = audio;
                });

                addOnAudioLoaded = true;
                showMessage("All 16 audio files loaded. System ready!", false);
                return true; 
            } else {
                showMessage(`ERROR: Failed to load Add-On audio files.`, true);
                return false;
            }
        }
        
        // (Image and Crossfade functions omitted for brevity - UNCHANGED)
        
        function applyIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 0; } 
            if (p >= 1 - buffer) { return 1; }
            return (p - buffer) / (1 - 2 * buffer);
        }
        function applyOppositeIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 1; }
            if (p >= 1 - buffer) { return 0; }
            return 1 - ((p - buffer) / (1 - 2 * buffer));
        }

        function equalPowerGain(p, isSignal1) {
            if (isSignal1) {
                return Math.cos(p * 0.5 * Math.PI);
            } else {
                return Math.sin(p * 0.5 * Math.PI);
            }
        }

        function getCurrentCorner(x, y) {
            const isTop = y < 0.5;
            const isLeft = x < 0.5;

            if (isTop && isLeft) return 'TL';
            if (isTop && !isLeft) return 'TR';
            if (!isTop && isLeft) return 'BL';
            if (!isTop && !isLeft) return 'BR';
            return null; 
        }

        function updateAudioGains(event) {
            if (!audioReady || !isPlaying || !pad) return; 

            const rect = pad.getBoundingClientRect();
            
            if (!event.forceFade) {
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
            }
            
            let x = (lastMouseX - rect.left) / rect.width;
            let y = (lastMouseY - rect.top) / rect.height;
            
            const rampDuration = event.forceFade ? FADE_TIME_TOGGLE : RAMP_TIME;

            // --- Master Volume Fade-out Logic (Mouse Proximity) ---
            let distanceToPad = 0;
            let clampedX = x;
            let clampedY = y;
            // (Clamping and distance calculation - UNCHANGED)
            
            let normalizedDistance = 0;
            if (distanceToPad > 0) {
                const pixelDistance = Math.sqrt(Math.pow(lastMouseX - (rect.left + clampedX * rect.width), 2) + Math.pow(lastMouseY - (rect.top + clampedY * rect.height), 2));
                normalizedDistance = Math.min(1, pixelDistance / FADE_BUFFER_DISTANCE);
            }
            const masterVolume = 1 - normalizedDistance; 
            
            x = Math.min(1, Math.max(0, x));
            y = Math.min(1, Math.max(0, y));
            
            const now = audioContext.currentTime;
            
            // --- 1. SPATIAL GAIN CALCULATION ---
            const xToRight = applyIsolation(x); 
            const xToLeft = applyOppositeIsolation(x);
            const yToBottom = applyIsolation(y); 
            const yToTop = applyOppositeIsolation(y);

            const baseGains = {
                TL: xToLeft * yToTop,     
                TR: xToRight * yToTop,   
                BL: xToLeft * yToBottom, 
                BR: xToRight * yToBottom 
            };
            
            const calculatedGains = [
                baseGains.TL, 
                baseGains.TR, 
                baseGains.BL, 
                baseGains.BR  
            ];

            // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION ---
            const dayMix = equalPowerGain(crossfadePosition, true);
            const nightMix = equalPowerGain(crossfadePosition, false);
            
            const ambienceMixes = { Day: dayMix, Night: nightMix };

            // Update Ambience Gains (Web Audio API - UNCHANGED)
            Object.keys(audioFilePaths).forEach(key => { 
                const corner = key.substring(0, 2); 
                const isNight = key.includes('_Night');
                const modeMix = isNight ? nightMix : dayMix;
                const modeBase = baseGains[corner];
                
                const target = Math.max(MINIMUM_GAIN, modeBase * masterVolume * modeMix);
                
                if (gainMap[key]) {
                    if (event.forceFade) {
                        gainMap[key].gain.exponentialRampToValueAtTime(target, now + rampDuration);
                    } else {
                        // Use linear for small, quick mouse movements
                        gainMap[key].gain.linearRampToValueAtTime(target, now + rampDuration); 
                    }
                }
            });
            
            // --- 3. ADD-ON VOLUME CALCULATION (HTML5 AUDIO - INSTANTANEOUS UPDATE) ---
            if (activeAddOnKey) {
                const corner = activeAddOnKey.substring(0, 2); 
                const mode = activeAddOnKey.includes('_Night') ? 'Night' : 'Day'; 
                
                const currentAddOn = addOnPlayerMap[activeAddOnKey];

                const modeMix = ambienceMixes[mode];
                const modeBase = baseGains[corner];
                
                // Calculate target volume (HTML5 volume is 0.0 to 1.0)
                const targetVolume = Math.max(
                    MINIMUM_GAIN, 
                    modeBase * masterVolume * modeMix * MAX_ADDON_VOLUME 
                );
                
                // Set volume immediately for responsiveness
                currentAddOn.volume = targetVolume;
            }

            updateVisualGlow(calculatedGains, masterVolume);
        }

        // --- Add-On Toggle Function (ENTER key - FINAL SIMPLIFIED VERSION) ---
        async function toggleAddOn() {
            initializeAudio(); 
            
            if (!audioReady || !mouseInPad || !addOnAudioLoaded) {
                if (!mouseInPad) showMessage("Please move your cursor over the audio pad to select a region.", false);
                return;
            }
            
            const rect = pad.getBoundingClientRect();
            let x = (lastMouseX - rect.left) / rect.width;
            let y = (lastMouseY - rect.top) / rect.height;
            const currentCornerKey = getCurrentCorner(x, y); 
            const currentAddOnName = cornerNames[currentCornerKey]; 
            
            const isCurrentlyDay = (crossfadePosition < 0.5);
            const currentMode = isCurrentlyDay ? 'Day' : 'Night';
            const newAddOnKey = `${currentCornerKey}_${currentMode}_AddOn`;
            
            const newAddOnElement = addOnPlayerMap[newAddOnKey];

            if (activeAddOnKey === newAddOnKey) {
                // CASE 1: Add-on is already active -> TURN OFF
                
                newAddOnElement.volume = 0.0;
                newAddOnElement.pause();
                
                activeAddOnName = null;
                activeAddOnKey = null;
                
                showMessage(`${currentAddOnName} add-on turned OFF.`, false);
                
            } else {
                // CASE 2: Add-on is not active or new add-on selected -> TURN ON (and stop old one)
                
                // 2a. Stop the previously active add-on (if any)
                if (activeAddOnKey && addOnPlayerMap[activeAddOnKey]) {
                    const oldAddOn = addOnPlayerMap[activeAddOnKey];
                    oldAddOn.volume = 0.0;
                    oldAddOn.pause();
                }
                
                activeAddOnName = currentAddOnName;
                activeAddOnKey = newAddOnKey;
                
                // 2b. Start the new HTML5 audio element
                newAddOnElement.volume = MINIMUM_GAIN; 
                newAddOnElement.play().catch(e => {
                    showMessage(`Error playing add-on: ${e.message}. The browser may require a direct click.`, true);
                    console.error("HTML5 Audio Play Error:", e);
                }); 
                
                // 2c. Force an immediate gain update (which sets volume based on mouse position)
                updateAudioGains({ forceFade: true, clientX: lastMouseX, clientY: lastMouseY }); 
                
                showMessage(`${currentAddOnName} add-on turned ON.`, false);
            }
        }

        // (Final initialization and event listeners - UNCHANGED)
        
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); 
                initializeAudio(); 
                toggleDayNight();
            } else if (event.code === 'Enter') {
                event.preventDefault(); 
                toggleAddOn(); 
            }
        });
        
        // --- Full Initialization Sequence (Requires Background Logic) ---
        function setRandomBackground(mode) { /* ... implementation needed ... */ }
        function crossfadeModes(targetMode) { /* ... implementation needed ... */ }
        function toggleDayNight() { /* ... implementation needed ... */ }
        function updateVisualGlow(gains, masterVolume) { /* ... implementation needed ... */ }
        // (For brevity, assumes image/crossfade/glow functions are defined elsewhere/correctly, as the focus is audio path/play)

        document.addEventListener('DOMContentLoaded', async () => {
            pad = document.getElementById('audioPad');
            indicator = document.getElementById('mouseIndicator');
            messageBox = document.getElementById('messageBox');

            // Find background elements (assuming they exist)
            let bgLayer1 = document.getElementById('bgLayer1');
            let bgLayer2 = document.getElementById('bgLayer2');
            let currentBgLayer = bgLayer1; 
            let nextBgLayer = bgLayer2;
            
            // Set up labels (assuming they exist)
            // ... label setup ...

            const daySuccess = await loadInitialAudio();
            if (!daySuccess) return; 

            const nightSuccess = await loadNightAudio();
            if (!nightSuccess) return; 
            
            const addOnSuccess = await loadAddOnAudio();
            if (!addOnSuccess) return;

            // Final message set in loadAddOnAudio()
            setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 2000); 
        });
        
        // (Event Handlers like handleMouseMove, handleMouseEnter, etc., should be here)
    </script>
    
</body>
</html>
