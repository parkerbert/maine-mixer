/* --- CORE STYLES (Unchanged) [cite: 2236] --- */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    cursor: none;
    color: #C2E2CC;
}
/* --- BACKGROUND LAYERS (Unchanged) [cite: 2248] --- */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: -2;
    transition: opacity 3.0s ease-in-out !important;
}
.bg-current { opacity: 1; }
.bg-next { opacity: 0; }
/*
h1 {
TITLE STYLES (Restored) [cite: 2264] */
h1 {

    font-family: 'Garamond', 'Times New Roman', serif;
    color: #C2E2CC;
    text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
    margin-bottom: 5px;
}
h2 {
    font-size: 1.2em;
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #AACCB8;
    text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
    margin-top: 0;
    margin-bottom: 10px;
}
/* --- CONTENT CONTAINER (Minimal Padding) [cite: 2279] --- */
.container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 10px;
    background-color: rgba(30, 45, 60, 0.85);
    border-radius: 15px;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    z-index: -1;
}
/* --- Audio Pad and Controls (All Margins Adjusted) [cite: 2290] --- */
#audioPad {
    /* Set to 70vh for better vertical scaling on laptops */
    width: min(70vh, 80vw);
    height: min(70vh, 80vw);
    max-width: 700px;
    max-height: 700px;
    border: 2px solid #79C2A8;
    position: relative;
    background-color: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 15px #79C2A8;
    margin: 20px; /* Added 20px margin to all four sides */
    border-radius: 5px;
    transition: box-shadow 0.3s, border-color 0.3s;
}
/* --- PAD LABELS (Text) [cite: 2304] --- */
.pad-label {
    position: absolute;
    padding: 8px 12px;
    background-color: rgba(0, 0, 0, 0.8);
    border: 1px solid #79C2A8;
    font-size: 0.9em;
    border-radius: 3px;
    transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
    pointer-events: none;
    z-index: 1; /* Keep labels above large icons */
}
.top-left { top: 15px; left: 15px; }
.top-right { top: 15px; right: 15px; }
.bottom-left { bottom: 15px; left: 15px; }
.bottom-right { bottom: 15px; right: 15px; }
.active-glow {
    box-shadow: 0 0 10px #C2E2CC;
    background-color: rgba(194, 232, 204, 0.2);
    color: white;
}
/* --- NEW: LARGE ADDON ICONS (SVG) [cite: 2323] --- */
.addon-icon {
    position: absolute;
    width: 200px; /* Much larger */
    height: 200px; /* Much larger */
    color: #C2E2CC;
    /* Set stroke property for the line drawing SVGs */
    stroke: currentColor;
    stroke-width: 1.5; /* Default line thickness for a finer look */
    fill: none; /* Ensure no fill, just stroke */
    opacity: 0.15; /* Much dimmer when inactive for stronger contrast */
    transition: opacity 0.5s, box-shadow 0.5s;
    pointer-events: none;
    padding: 10px;
}
/* Positioning to center them visually within their quadrants [cite: 2337] */
.top-left-icon { top: 25%; left: 25%; transform: translate(-50%, -50%); }
.top-right-icon { top: 25%; right: 25%; transform: translate(50%, -50%); }
.bottom-left-icon { bottom: 25%; left: 25%; transform: translate(-50%, 50%); }
.bottom-right-icon { bottom: 25%; right: 25%; transform: translate(50%, 50%); }

/* The new glow class for activated AddOns (Enhanced Effect) [cite: 2342] */
.icon-active-glow {
    opacity: 1.0; /* Full visibility */
    background-color: rgba(194, 232, 204, 0.05); /* Very light background/container glow */
    box-shadow:
        0 0 10px rgba(194, 232, 204, 0.6), /* Inner glow */

}
/* --- CURSOR INDICATOR (Unchanged) [cite: 2348] --- */
#mouseIndicator {
    width: 20px;
    height: 20px;

    const angle = position * 0.5 * Math.PI;

// --- Core Ambience Start Function (For reference, from source 2078) ---
function connectAndStartAmbienceSource(key, initialGain = MAX_GAIN) {
    const buffer = audioBuffers[key];
    if (!buffer) return;

    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true; // Ambience tracks always loop 
    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);

    gainMap[key] = gain;
    source.start(0);
}

// --- UPDATED AddOn Audio Start Function (Starts running silently, now ensures looping) ---
function connectAndStartAddOnSource(key) {
    const buffer = audioBuffers[key];
    if (!buffer) return;

    // Stop existing source if this is a re-initialization (safety)
    if (addOnStateMap[key] && addOnStateMap[key].source) {
        try { addOnStateMap[key].source.stop(); } catch (e) { /* ignore if already stopped */ }
    }
    
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    
    source.buffer = buffer;
    source.loop = true; // *** CRUCIAL: Ensures Add-On track loops within the ambience duration ***
    
    // Add-Ons start silently, at MINIMUM_GAIN
    gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime); 
    
    source.connect(gain);
    gain.connect(audioContext.destination);

    // Map the source and gain node to the key for later manipulation
    // This is necessary for the toggleAddOn and updateAudioGains functions
    if (addOnStateMap[key]) {
        addOnStateMap[key].source = source;
        addOnStateMap[key].gain = gain;
    } else {
         addOnStateMap[key] = { source: source, gain: gain, active: false };
    }

    source.start(0);
}

// --- Load Add-On Audio Function (Logic to load and start AddOns) ---
async function loadAddOnAudio() {
    if (addOnAudioLoaded) return true;
    showMessage("Loading 8 Add-On audio files...");
    
    const loadPromises = addOnAudioKeys.map(key => loadAudioFile(addOnFilePaths[key], key));
    const results = await Promise.all(loadPromises);

    const successCount = results.filter(r => r.success).length;

    if (successCount === addOnAudioKeys.length) {
        addOnAudioLoaded = true;
        
        // Initialize state map and start all Add-Ons silently
        addOnAudioKeys.forEach(key => {
            addOnStateMap[key] = { source: null, gain: null, active: false };
            connectAndStartAddOnSource(key); // START ALL ADD-ONS IMMEDIATELY
        });
        
        showMessage("All Add-On audio files loaded.", false);
        return true;
    } else {
        showMessage(`ERROR: Failed to load ${addOnAudioKeys.length - successCount} Add-On audio files.`, true);
        return false;
    }
}
