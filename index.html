<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allagash Ambience</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* --- CORE STYLES (Unchanged) --- */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    cursor: none;
    color: #C2E2CC;
}
/* --- BACKGROUND LAYERS (Unchanged) --- */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: -2;
    transition: opacity 3.0s ease-in-out !important;
}
.bg-current { opacity: 1; }
.bg-next { opacity: 0; }
/* --- TITLE STYLES (Restored) */
h1 {
    font-size: 3.0em;
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #C2E2CC;
    text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
    margin-bottom: 5px;
}
h2 {
    font-size: 1.2em;
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #AACCB8;
    text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
    margin-top: 0;
    margin-bottom: 10px;
}
/* --- CONTENT CONTAINER (MODIFIED FOR CENTERING) ---
The container is now explicitly set to a max-width and centered.
*/
.container {
    /* Existing resets */
    padding: 0;

    /* FIX: Set max width and center the container */
    width: 100%;
    max-width: 800px;
    margin: 0 auto;

    /* Layout properties for grid */
    display: grid;
    /* This creates a single column layout */
    grid-template-areas:
        "title"
        "mixpad";
    /* Place the title and mix pad in their respective areas */
}

.centered-title {
    /* 1. Center the text horizontally within its grid area */
    text-align: center;
    /* 2. Assign it to the 'title' area */
    grid-area: title;
    /* Ensure it fills the new container width */
    width: 100%;
    /* Optional: Give it some spacing above the mix pad */
    margin-bottom: 15px;
}

.mix-pad {
    /* Assign it to the 'mixpad' area */
    grid-area: mixpad;
    /* Ensure the mix pad takes up the full width of the container (max-width/margin handled by parent) */
    width: 100%;
}
/* --- Audio Pad and Controls (All Margins Adjusted) --- */
#audioPad {
    /* Set to 70vh for better vertical scaling on laptops */
    width: min(70vh, 80vw);
    height: min(70vh, 80vw);

    max-width: 700px;
    max-height: 700px;

    /* Base/Reduced Glow: Original Teal color */
    border: 2px solid #79C2A8;
    position: relative;
    background-color: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 15px #79C2A8;

    margin: 20px auto; /* Centered with a margin */
    border-radius: 5px;
    transition: box-shadow 0.3s, border-color 0.3s;
    /* Allow clicks inside the pad, but not on the pad itself to avoid interfering with mousemove */
    pointer-events: all;
}

/* --- NEW: Active Glow for Mix Pad (Increased/Active Glow) --- */
/* This class is added on mouseenter and removed on mouseleave. */
.pad-active-glow {
    /* Brighter, Mint-Green Color */
    border-color: #C2E2CC !important;
    /* Brighter, more pronounced glow */
    box-shadow: 0 0 20px #C2E2CC, 0 0 40px rgba(194, 232, 204, 0.5) !important;
}


/* --- PAD LABELS (Text) --- */
.pad-label {
    position: absolute;
    padding: 8px 12px;
    background-color: rgba(0, 0, 0, 0.8);
    border: 1px solid #79C2A8;
    font-size: 0.9em;
    border-radius: 3px;
    transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
    /* Added to allow the click to propagate up to the audioPad element */
    pointer-events: none;
    z-index: 1; /* Keep labels above large icons */
}
.top-left { top: 15px; left: 15px; }
.top-right { top: 15px; right: 15px; }
.bottom-left { bottom: 15px; left: 15px; }
.bottom-right { bottom: 15px; right: 15px; }
.active-glow {
    box-shadow: 0 0 10px #C2E2CC;
    background-color: rgba(194, 232, 204, 0.2);
    color: white;
}

/* --- NEW: LARGE ADDON ICONS (SVG) --- */
.addon-icon {
    position: absolute;
    width: 200px; /* Much larger */
    height: 200px; /* Much larger */
    color: #C2E2CC;
    /* Set stroke property for the line drawing SVGs */
    stroke: currentColor;
    stroke-width: 1.5; /* Default line thickness for a finer look */
    fill: none; /* Ensure no fill, just stroke */

    opacity: 0.15; /* Much dimmer when inactive for stronger contrast */
    transition: opacity 0.5s, box-shadow 0.5s;
    /* IMPORTANT: Allow the icon itself to be clicked */
    pointer-events: all;
    padding: 10px;
    cursor: pointer;
}
/* Positioning to center them visually within their quadrants */
.top-left-icon { top: 25%; left: 25%; transform: translate(-50%, -50%); }
.top-right-icon { top: 25%; right: 25%; transform: translate(50%, -50%); }
.bottom-left-icon { bottom: 25%; left: 25%; transform: translate(-50%, 50%); }
.bottom-right-icon { bottom: 25%; right: 25%; transform: translate(50%, 50%); }

/* The new glow class for activated AddOns (Enhanced Effect) */
.icon-active-glow {
    opacity: 1.0; /* Full visibility */
    background-color: rgba(194, 232, 204, 0.05); /* Very light background/container glow */
    box-shadow:
        0 0 10px rgba(194, 232, 204, 0.6), /* Inner glow */
        0 0 30px rgba(194, 232, 204, 0.4); /* Outer halo */
    border-radius: 10px;
}

/* --- CURSOR INDICATOR (Unchanged) --- */
#mouseIndicator {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #C2E2CC;
    box-shadow: 0 0 10px #C2E2CC;
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 1000;
}
/* Explanation Box - RESPONSIVE POSITIONING (Unchanged) */
#explanationBox {
    position: fixed;
    top: 5vh;
    left: 5vw;
    padding: 15px;
    background-color: rgba(30, 45, 60, 0.85);
    border: 2px solid #79C2A8;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    font-family: 'Arial', sans-serif;
    font-size: 0.9em;
    color: #C2E2CC;
    text-align: left;
    line-height: 1.4;
    z-index: 5;
    pointer-events: none;
}
#explanationBox p {
    white-space: nowrap;
    margin: 0;
}
.message-box {
    /* Kept for element definition, but will remain hidden */
    border: 1px solid #FF5555;
    background-color: rgba(255, 85, 85, 0.1);
    color: white;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 5px;
    display: none;
}
</style>
</head>

// --- Helper Functions (Console logging only) ---
function showMessage(text, isError = false) {
    const prefix = isError ? '[ERROR]' : '[Status]';
    // Only log to console, do not modify the DOM messageBox
    console.log(`${prefix} ${text}`);
}

function playSfx(key) {
    if (!audioContext || !sfxLoaded) return;
    const buffer = audioBuffers[key];
    if (!buffer) {
        console.warn(`SFX buffer not found for key: ${key}`);
        return;
    }

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start(0);
}

async function loadAudioFile(url, key) {
    try {
        const response = await fetch(url);
        if (!response.ok) { throw new Error(`HTTP error ${response.status}`); }
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[key] = audioBuffer;
    } catch (error) {
        console.error(`ERROR loading audio file ${url}: `, error);
        showMessage(`Failed to load audio file: ${url}. Check console for details.`, true);
        return { key, success: false, error: error.message };
    }
    return { key, success: true };
}

// --- Core Ambience Start Function (Unchanged) --
function connectAndStartAmbienceSource(key, initialGain = 1.0) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    gainMap[key] = gain;
    source.start(0);
}

// --- AddOn Audio Start Function (Starts running silently - Unchanged) ---
function connectAndStartAddOnSource(key) {
    const buffer = audioBuffers[key];
    if (!buffer) return;
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    // Start at MINIMUM_GAIN (effectively silent)
    gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    // Initialize the state map for this AddOn
    addOnStateMap[key] = {
        source: source,
        gain: gain,
        active: false // Starts inactive
    };
    source.start(0);
}

// --- Audio Loading Functions (Unchanged) ---
async function loadInitialAudio() {
    showMessage("Loading Day ambiance audio files (4/8 Ambience)... Please wait.", false);
    // Start with all 4 day tracks
    const loadPromises = dayAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key) );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === dayAudioKeys.length) {
        dayAudioKeys.forEach(key => connectAndStartAmbienceSource(key, MINIMUM_GAIN)); // Start muted
        audioReady = true;
        isPlaying = true;
        showMessage('Day ambiance audio ready! You can now mix. ');
        return true;
    } else {
        showMessage('CRITICAL ERROR: Failed to load Day ambiance audio files. Site non-functional. ', true);
        return false;
    }
}

async function loadNightAudio() {
    if (nightAudioLoaded) return true;
    showMessage("Loading Night ambiance audio files (4/8 Ambience)... Please wait.", false);
    const loadPromises = nightAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key) );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === nightAudioKeys.length) {
        nightAudioKeys.forEach(key => connectAndStartAmbienceSource(key, MINIMUM_GAIN));
        nightAudioLoaded = true;
        showMessage("Night ambiance loaded!", false);
        return true;
    } else {
        showMessage('ERROR: Failed to load Night ambiance files. Cannot switch mode.', true);
        return false;
    }
}

async function loadSfxAudio() {
    if (sfxLoaded) return true;
    // allSfxKeys now contains the 40 mode-specific SFX keys
    showMessage(`Loading SFX audio files (${allSfxKeys.length} total)...`, false);
    const loadPromises = allSfxKeys.map(key => {
        const url = sfxFilePaths[key];
        return loadAudioFile(url, key);
    });
    const results = await Promise.all(loadPromises);

    const successfulLoads = results.filter(r => r && r.success).length;
    if (successfulLoads === allSfxKeys.length) {
        sfxLoaded = true;
        showMessage("SFX loaded.", false);
        return true;
    } else {
        showMessage(`ERROR: Failed to load SFX audio files.`, true);
        return false;
    }
}

async function loadAddOnAudio() {
    if (addOnAudioLoaded) return true;
    // Updated count in message: 8 Add-Ons
    showMessage("Loading Add-On audio files (8 Add-Ons)... Please wait.", false);
    // Only map the addOnAudioKeys
    const loadPromises = addOnAudioKeys.map(key => {
        const url = audioFilePaths[key];
        return loadAudioFile(url, key);
    });
    const results = await Promise.all(loadPromises);

    const successfulLoads = results.filter(r => r && r.success).length;
    if (successfulLoads === addOnAudioKeys.length) {
        // Only start the audio sources if the loading was successful
        addOnAudioKeys.forEach(key => connectAndStartAddOnSource(key));
        addOnAudioLoaded = true;
        showMessage("All Add-on audio loaded and initialized.", false);
        return true;
    } else {
        showMessage(`ERROR: Failed to load Add-On audio files.`, true);
        return false;
    }
}

// --- Background Image Management (Unchanged) ---
function getRandomBackground(mode) {
    const allModeImages = allImages.filter(img => img.includes(mode.toLowerCase()));
    let lastImages = mode === 'Day' ? lastDayImages : lastNightImages;

    // Logic for selecting a new random image...
    const newImage = allModeImages.filter(img => !lastImages.includes(img))[0] || allModeImages[0];

    if (mode === 'Day') {
        lastDayImages.push(newImage);
        if (lastDayImages.length > 3) lastDayImages.shift();
    } else {
        lastNightImages.push(newImage);
        if (lastNightImages.length > 3) lastNightImages.shift();
    }

    return `url('${newImage}')`;
}

function updateBackground(mode) {
    const newBackgroundURL = getRandomBackground(mode);
    nextBgLayer.style.backgroundImage = newBackgroundURL;

    currentBgLayer.classList.remove('bg-current');
    currentBgLayer.classList.add('bg-next');

    nextBgLayer.classList.remove('bg-next');
    nextBgLayer.classList.add('bg-current');

    setTimeout(() => {
        const temp = currentBgLayer;
        currentBgLayer = nextBgLayer;
        nextBgLayer = temp;
        nextBgLayer.style.backgroundImage = 'none';
    }, BACKGROUND_FADE_DELAY);
}

// --- Audio Gain Logic (Unchanged) ---
function equalPowerGain(position, isDay) {
    const angle = position * 0.5 * Math.PI;
    return isDay ? Math.cos(angle) : Math.sin(angle);
}

function applyIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 0; }
    if (p >= 1 - buffer) { return 1; }
    return (p - buffer) / (1 - 2 * buffer);
}

function applyOppositeIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 1; }
    if (p >= 1 - buffer) { return 0; }
    return (1 - p - buffer) / (1 - 2 * buffer);
}

function getCurrentCorner(x, y) {
    const isTop = y < 0.5;
    const isLeft = x < 0.5;
    if (isTop && isLeft) return 'TL';
    if (isTop && !isLeft) return 'TR';
    if (!isTop && isLeft) return 'BL';
    if (!isTop && !isLeft) return 'BR';
    return null;
}

function updateAudioGains(event) {
    if (!audioReady || !isPlaying || !pad) return;

    // Default ramp duration for smooth transitions
    let rampDuration = RAMP_TIME;
    // Allow for forced instantaneous update if requested (e.g., when turning an AddOn ON instantly)
    if (event && event.forceFade) {
        rampDuration = 0;
    }

    const now = audioContext.currentTime;
    let x = 0.5;
    let y = 0.5;
    let rect = null;

    if (event && event.clientX !== undefined) {
        rect = pad.getBoundingClientRect();
        x = (event.clientX - rect.left) / rect.width;
        y = (event.clientY - rect.top) / rect.height;
    } else if (mouseInPad) {
        // If no event, but mouse is marked as inside, use last known position
        rect = pad.getBoundingClientRect();
        x = (lastMouseX - rect.left) / rect.width;
        y = (lastMouseY - rect.top) / rect.height;
    }

    // --- 1. AMBIENCE BASE GAIN CALCULATION (ISOLATION) ---
    // Calculate 0-1 range for each direction, isolated from the center buffer
    const xToLeft = applyIsolation(1 - x); // BL, TL
    const xToRight = applyIsolation(x);    // BR, TR
    const yToTop = applyIsolation(1 - y);  // TL, TR
    const yToBottom = applyIsolation(y);   // BL, BR

    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };

    // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION ---
    const dayMix = equalPowerGain(crossfadePosition, true);
    const nightMix = equalPowerGain(crossfadePosition, false);
    const ambienceMixes = { Day: dayMix, Night: nightMix };

    ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
        const dayKey = `${cornerKey}_Day`;
        const nightKey = `${cornerKey}_Night`;
        // Final target gain for each Day and Night track
        const dayTargetGain = baseGains[cornerKey] * dayMix;
        const nightTargetGain = baseGains[cornerKey] * nightMix;

        if (gainMap[dayKey]) {
            gainMap[dayKey].gain.linearRampToValueAtTime(dayTargetGain, now + rampDuration);
        }
        if (gainMap[nightKey]) {
            gainMap[nightKey].gain.linearRampToValueAtTime(nightTargetGain, now + rampDuration);
        }
    });

    // --- 3. ADD-ON GAIN CALCULATION ---
    addOnAudioKeys.forEach(addOnKey => {
        const state = addOnStateMap[addOnKey];

        if (state && state.gain) {
            const corner = addOnKey.substring(0, 2); // e.g., 'TL'
            const mode = addOnKey.includes('_Night') ? 'Night' : 'Day';
            const modeMix = ambienceMixes[mode];
            const modeBase = baseGains[corner];
            let target = MINIMUM_GAIN;

            // Only calculate a non-zero target if the user has explicitly turned the add-on ON
            if (state.active) {
                // Modulated by mouse position (modeBase) and Day/Night mix (modeMix)
                if (modeMix > MINIMUM_GAIN) {
                    target = modeBase * modeMix * MAX_ADDON_VOLUME;
                }
            }
            // The gain is updated spatially on every updateAudioGains call.
            state.gain.gain.linearRampToValueAtTime(target, now + rampDuration);
        }
    });

    // --- 4. VISUALS (Labels - Unchanged) ---
    const calculatedGains = [
        baseGains.TL * dayMix + baseGains.TL * nightMix,
        baseGains.TR * dayMix + baseGains.TR * nightMix,
        baseGains.BL * dayMix + baseGains.BL * nightMix,
        baseGains.BR * dayMix + baseGains.BR * nightMix
    ];
    const maxGain = Math.max(...calculatedGains);
    labels.forEach(label => label.classList.remove('active-glow'));

    if (maxGain > 0.6) {
        let maxIndex = calculatedGains.indexOf(maxGain);
        labels[maxIndex].classList.add('active-glow');
    }
}

// --- Crossfade Logic (Unchanged) ---
function startCrossfade(targetIsNight) {
    isCrossfading = true;
    const start = audioContext.currentTime;
    const duration = FADE_TIME_TOGGLE;
    const startPosition = crossfadePosition;
    const endPosition = targetIsNight ? 1.0 : 0.0;
    const diff = endPosition - startPosition;

    const crossfadeInterval = setInterval(() => {
        const elapsed = audioContext.currentTime - start;
        let progress = elapsed / duration;

        if (progress >= 1.0) {
            progress = 1.0;
            clearInterval(crossfadeInterval);
            isCrossfading = false;
        }

        // Linear interpolation for crossfade position
        crossfadePosition = startPosition + (diff * progress);
        updateAudioGains({ forceFade: true });

    }, RAMP_TIME * 1000); // Update roughly at the ramp time interval
}

async function toggleDayNight() {
    if (!audioReady || isCrossfading) return;
    initializeAudio();

    const isCurrentlyDay = (crossfadePosition < 0.5);
    const targetIsNight = isCurrentlyDay;

    if (targetIsNight && !nightAudioLoaded) {
        showMessage("Night audio is still loading. Please wait a moment.", false);
        return;
    }

    // Force a visual update *before* the fade starts
    updateBackground(targetIsNight ? 'Night' : 'Day');
    startCrossfade(targetIsNight);
}

// --- UPDATED Add-On Toggle Function ---
// Accepts an optional cornerKey, which is passed when an icon is clicked.
// If not passed, it defaults to using the current mouse position (for 'Enter' keypress).
async function toggleAddOn(eventOrCornerKey) {
    initializeAudio();
    if (!audioReady || !addOnAudioLoaded) {
        if (!addOnAudioLoaded) showMessage("Add-on audio files are still loading or failed to load.", true);
        return;
    }

    let currentCornerKey;
    // --- 1. DETERMINE CORNER KEY ---
    if (typeof eventOrCornerKey === 'string') {
        // If a string (the corner key) was passed, use it directly (e.g., from a click listener)
        currentCornerKey = eventOrCornerKey;
    } else {
        // If an event object (or nothing) was passed (e.g., from 'Enter' keypress),
        // calculate based on the last known mouse position.
        const rect = pad.getBoundingClientRect();
        let x = (lastMouseX - rect.left) / rect.width;
        let y = (lastMouseY - rect.top) / rect.height;

        currentCornerKey = getCurrentCorner(x, y);

        // Also check if the click/tap event originated from a specific icon
        if (eventOrCornerKey && eventOrCornerKey.target) {
            const target = eventOrCornerKey.target.closest('[data-corner]');
            if (target) {
                currentCornerKey = target.getAttribute('data-corner');
            }
        }
    }
    if (!currentCornerKey) return;

    const isCurrentlyDay = (crossfadePosition < 0.5);
    const currentMode = isCurrentlyDay ? 'Day' : 'Night';
    const currentAddOnName = cornerNames[currentCornerKey];
    const addOnKey = `${currentCornerKey}_${currentMode}_AddOn`;
    const state = addOnStateMap[addOnKey];
    const iconElement = addOnIcons[currentCornerKey]; // Get the HTML element for the icon

    if (!state || !iconElement) {
        showMessage(`Add-on state or icon not found for ${currentCornerKey}_${currentMode}.`, true);
        return;
    }

    // Determine if it's one of the corners that uses SFX
    const isSFXAddOn = (currentCornerKey === 'TL' || currentCornerKey === 'BR');
    const isCabinAddOn = currentCornerKey === 'TL';
    const isRangerAddOn = currentCornerKey === 'BR';
    const now = audioContext.currentTime;

    // The current base gain is only used for immediate visual calculation on a click,
    // otherwise the gain logic in updateAudioGains handles the ramping.
    const rect = pad.getBoundingClientRect();
    const x = (lastMouseX - rect.left) / rect.width;
    const y = (lastMouseY - rect.top) / rect.height;
    const xToLeft = applyIsolation(1 - x);
    const xToRight = applyIsolation(x);
    const yToTop = applyIsolation(1 - y);
    const yToBottom = applyIsolation(y);
    const baseGains = { TL: xToLeft * yToTop, TR: xToRight * yToTop, BL: xToLeft * yToBottom, BR: xToRight * yToBottom };
    const currentBaseGain = baseGains[currentCornerKey];

    // --- TOGGLE LOGIC ---

    // Scenario 1: Add-on is ALREADY active. TURN OFF.
    if (state.active) {
        state.active = false; // Mark state as OFF
        // 1. Play OFF SFX if Cabin or Ranger Station Add-On
        if (isSFXAddOn && sfxLoaded) {
            let offKeys;
            if (isCabinAddOn) {
                offKeys = currentMode === 'Day' ? buttonCabinDayOffKeys : buttonCabinNightOffKeys;
            } else if (isRangerAddOn) {
                offKeys = currentMode === 'Day' ? buttonRangerDayOffKeys : buttonRangerNightOffKeys;
            }
            if (offKeys) {
                const randomKey = offKeys[Math.floor(Math.random() * offKeys.length)];
                playSfx(randomKey);
            }
        }

        // 2. Explicitly ramp the gain down (no delay)
        if (state.gain) {
            if (isRangerAddOn) {
                // *** Instant cut for Ranger Station (BR) ***
                state.gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
            } else {
                // Standard 1.0s fade for Cabin (TL) and others
                state.gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
            }
        }
        // NEW: Remove the glowing class
        iconElement.classList.remove('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned OFF.`, false);
    }
    // Scenario 2: Add-on is currently inactive. TURN ON.
    else {
        state.active = true; // Mark state as ON
        let rampStart = audioContext.currentTime;
        let onKeys = null;
        let applyManualRamp = false;

        // 1. Determine delay, set manual ramp flag, and select SFX keys
        if (isCabinAddOn) {
            onKeys = currentMode === 'Day' ?
                buttonCabinDayOnKeys : buttonCabinNightOnKeys;
            rampStart += CABINET_ADDON_DELAY; // Apply 0.5s delay
            applyManualRamp = true;
        } else if (isRangerAddOn) {
            onKeys = currentMode === 'Day' ?
                buttonRangerDayOnKeys : buttonRangerNightOnKeys;
            rampStart += RAMP_TIME; // Small ramp delay
            applyManualRamp = true;
        }

        // 2. Play ON SFX if applicable
        if (isSFXAddOn && sfxLoaded && onKeys) {
            const randomKey = onKeys[Math.floor(Math.random() * onKeys.length)];
            playSfx(randomKey);
        }

        // 3. Apply manual ramp for SFX Add-Ons (Others rely on updateAudioGains)
        if (applyManualRamp) {
            // Calculate target gain based on current mouse position and day/night mix
            const dayMix = equalPowerGain(crossfadePosition, true);
            const nightMix = equalPowerGain(crossfadePosition, false);
            const modeMix = currentMode === 'Day' ? dayMix : nightMix;
            const targetGain = currentBaseGain * modeMix * MAX_ADDON_VOLUME;

            state.gain.gain.linearRampToValueAtTime(targetGain, rampStart);
        }

        // This ensures non-SFX Add-Ons (TR, BL) ramp up instantly via the regular updateAudioGains logic.
        updateAudioGains({ forceFade: true });

        // NEW: Add the glowing class
        iconElement.classList.add('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned ON.`, false);
    }
}

// --- MOUSE ENTER/LEAVE HANDLERS (New functions for pad glow) ---
function handleMouseEnter() {
    mouseInPad = true;
    // FIX: Add the new active glow class when entering the mix pad.
    pad.classList.add('pad-active-glow');
}

function handleMouseLeave() {
    mouseInPad = false;
    // FIX: Remove the new active glow class when leaving the mix pad.
    pad.classList.remove('pad-active-glow');
    // Also force a final update to fade ambiance out
    updateAudioGains();
}


function handleMouseMove(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();
    const cursorX = event.clientX;
    const cursorY = event.clientY;
    // NOTE: lastMouseX and lastMouseY are set here, even if outside the pad,
    // which is necessary for the instant toggle logic in toggleAddOn.
    lastMouseX = event.clientX;
    lastMouseY = event.clientY;

    const isOutsideX = cursorX < rect.left || cursorX > rect.right;
    const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

    if (isOutsideX || isOutsideY) {
        // Mouse is outside the pad, handle visual fade
        const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
        const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

        const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));
        let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
        opacity = Math.min(1, Math.max(0, opacity));

        if (opacity > 0) {
            indicator.style.left = `${cursorX}px`;
            indicator.style.top = `${cursorY}px`;
            indicator.style.opacity = opacity.toFixed(2);
        } else {
            indicator.style.opacity = '0';
        }

        // When mouse is outside, call updateAudioGains to fade ambiance out
        updateAudioGains();
    } else {
        // Mouse is inside the pad
        indicator.style.left = `${cursorX}px`;
        indicator.style.top = `${cursorY}px`;
        indicator.style.opacity = '1';

        updateAudioGains(event);
    }
}

function handleTouchMove(event) {
    event.preventDefault(); // Prevent scrolling
    const touch = event.touches[0];
    if (touch) {
        // Synthesize a mousemove event from the touch data
        const syntheticEvent = {
            clientX: touch.clientX,
            clientY: touch.clientY
        };
        handleMouseMove(syntheticEvent);
        // Ensure the pad is registered as entered on touch move
        if (!mouseInPad) {
            handleMouseEnter();
        }
    }
}

function handleTouchEnd() {
    // When the last touch ends, treat it like a mouse leave
    handleMouseLeave();
}

function initializeAudio() {
    if (!audioInitiated) {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            showMessage("Audio Context initialized.", false);
            // This is critical for mobile browsers to allow audio playback
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        } else if (audioContext && audioContext.state === 'running') {
            audioInitiated = true;
        }
    }
}

// --- Keyboard Event Listener (Unchanged) ---
document.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
        event.preventDefault();
        initializeAudio();
        toggleDayNight();
    } else if (event.code === 'Enter' || event.code === 'NumpadEnter') {
        event.preventDefault();
        // Call toggleAddOn without arguments. It will use the last mouse position.
        toggleAddOn();
    }
});

// --- INITIALIZATION SEQUENCE ---
document.addEventListener('DOMContentLoaded', async () => {
    // 1. Element lookups
    pad = document.getElementById('audioPad');
    indicator = document.getElementById('mouseIndicator');
    messageBox = document.getElementById('messageBox'); // Kept for reference, but won't display.
    bgLayer1 = document.getElementById('bgLayer1');
    bgLayer2 = document.getElementById('bgLayer2');
    currentBgLayer = bgLayer1;
    nextBgLayer = bgLayer2;
    labelTL = document.getElementById('labelTL');
    labelTR = document.getElementById('labelTR');
    labelBL = document.getElementById('labelBL');
    labelBR = document.getElementById('labelBR');
    labels = [labelTL, labelTR, labelBL, labelBR];
    iconTL = document.getElementById('iconTL');
    iconTR = document.getElementById('iconTR');
    iconBL = document.getElementById('iconBL');
    iconBR = document.getElementById('iconBR');

    // NEW: Populate the icon map (all elements are referenced correctly now)
    addOnIcons = {
        'TL': iconTL,
        'TR': iconTR,
        'BL': iconBL,
        'BR': iconBR
    };

    if (pad) {
        // ADDED: New mouse enter/leave handlers for the dynamic glow
        pad.addEventListener('mouseenter', handleMouseEnter);
        pad.addEventListener('mouseleave', handleMouseLeave);
        // NEW: Add click listener to the audioPad element (from previous response).
        pad.addEventListener('click', toggleAddOn);
    }

    // 2. Load all audio files asynchronously
    const daySuccess = await loadInitialAudio();
    if (!daySuccess) return;

    const nightSuccess = await loadNightAudio();
    if (!nightSuccess) return;

    const addOnSuccess = await loadAddOnAudio();
    if (!addOnSuccess) return;

    // Load the specific SFX files (now 40 total)
    const sfxSuccess = await loadSfxAudio();
    if (!sfxSuccess) showMessage("SFX failed to load, button features for Cabin and Ranger Station will be disabled.", true);
});

// Global listener for movement (mouse and touch)
document.addEventListener('mousemove', handleMouseMove);

// Initial click/tap listener to unlock AudioContext
document.addEventListener('mousedown', initializeAudio);
document.addEventListener('touchstart', initializeAudio);

// Touch-specific listeners
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);
</script>
