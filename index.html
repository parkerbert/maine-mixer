// --- Helper Functions (Console logging only - Unchanged) ---
function showMessage(text, isError = false) {

    console.log(`${prefix} ${text}`); 
}

function playSfx(key) {
    if (!audioContext || !sfxLoaded) return;
    
    const buffer = audioBuffers[key];
    if (!buffer) {
        console.warn(`SFX buffer not found for key: ${key}`);
        return;
    }

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start(0);
}


async function loadAudioFile(url, key) {
    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`HTTP error ${response.status}`);
        }
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[key] = audioBuffer;
    } catch (error) {
        console.error(`ERROR loading audio file ${url}: `, error);
        showMessage(`Failed to load audio file: ${url}. Check console for details.`, true);
        return { key, success: false, error: error.message };
    }
    return { key, success: true };
}

// --- Core Ambience Start Function (Unchanged) --
function connectAndStartAmbienceSource(key, initialGain = 1.0) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    gainMap[key] = gain;
    
    // START AT A SPECIFIC TIME
    const startTime = audioContext.currentTime;
    source.start(0); 
    
    // Track source node and its start time for BL_Day synchronization
    if (key === 'BL_Day') {
        ambienceSourceMap[key] = {
            source: source,
            startTime: startTime,
            duration: BL_AMB_DURATION 
        };
    }
}

// --- **FIXED/RESTORED** AddOn Audio Start Function ---
// This function must now handle all 7 looping AddOns (TL, TR, BL_Night, BR - Day & Night)
function connectAndStartAddOnSource(fileKey, logicalKey) {
    // Lake Day AddOns are handled by the custom logic and should not be started here.
    if (logicalKey === BL_DAY_ADDON_KEY) {
        return; 
    }
    
    const buffer = audioBuffers[fileKey]; // Use fileKey to get buffer
    if (!buffer) return; 
    
    // Create new source
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.loop = true; // All non-Lake Day AddOns are looping
    
    // Connect to the persistent gain node created in loadAddOnAudio
    const state = addOnStateMap[logicalKey];
    source.connect(state.gain);
    
    // Store the source node in the state map
    state.source = source;
    
    // Start the source immediately
    source.start(0);
}

async function loadInitialAudio() {

    showMessage("Loading Day ambiance audio files (4/8 Ambience)...");
    const loadPromises = initialAudioKeys.map(key =>

    );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    const totalFiles = initialAudioKeys.length;
    if (successfulLoads === totalFiles) {
        initialAudioKeys.forEach(key => connectAndStartAmbienceSource(key, 1.0));
        audioReady = true;

// --- **FIXED/RESTORED** AddOn Audio Loading and Initial Start ---
async function loadAddOnAudio() {
    if (addOnAudioLoaded) return true;
    showMessage("Loading Add-On audio files (9 physical Add-Ons)... Please wait.", false);
    
    // 1. Load all 9 physical files
    const loadPromises = allPhysicalAddOnKeys.map(key => { 
        const url = addOnFilePaths[key];
        return loadAudioFile(url, key);
    });
    
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    
    if (successfulLoads === allPhysicalAddOnKeys.length) {
        addOnAudioLoaded = true;
        
        // 2. Initialize the persistent state map for all 8 LOGICAL AddOns
        ADDON_LOGICAL_KEYS.forEach(key => {
            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
            gain.connect(audioContext.destination);

            addOnStateMap[key] = {
                source: null,
                gain: gain, // Dedicated Gain Node for spatial control
                active: false 
            };
            
            // 3. Start all non-Lake-Day AddOns immediately and looping
            if (key !== BL_DAY_ADDON_KEY) {
                // BUG FIX: Use the logical key here, which is also the file key 
                // for the looping AddOns (e.g., 'TL_Day_AddOn').
                connectAndStartAddOnSource(key, key); 
            }
        });
        
        showMessage("All 17 (8 Ambience + 9 physical AddOn) audio files loaded. System ready!", false); 
        return true;
    } else {
        showMessage(`ERROR: Failed to load Add-On audio files.`, true);
        return false;
    }
}
// --- Image Background Functions (Unchanged) ---
function getRandomBackground(mode) {
    const allImages = mode === 'Day' ? dayBackgrounds : nightBackgrounds;
    const lastImages = mode === 'Day' ? lastDayImages : lastNightImages;
    
    const newImage = allImages.filter(img => !lastImages.includes(img))[0] || allImages[0];
    
    if (mode === 'Day') {
        lastDayImages.push(newImage);
        if (lastDayImages.length > 3) lastDayImages.shift();
    } else {
        lastNightImages.push(newImage);
        if (lastNightImages.length > 3) lastNightImages.shift();
    }
    
    return `url('${newImage}')`;
}

function updateBackground(mode) {
    const newBackgroundURL = getRandomBackground(mode);
    nextBgLayer.style.backgroundImage = newBackgroundURL;

    currentBgLayer.classList.remove('bg-current');
    currentBgLayer.classList.add('bg-next');

    nextBgLayer.classList.remove('bg-next');
    nextBgLayer.classList.add('bg-current');

    setTimeout(() => {
        const temp = currentBgLayer;
        currentBgLayer = nextBgLayer;
        nextBgLayer = temp;
        nextBgLayer.style.backgroundImage = 'none';
    }, BACKGROUND_FADE_DELAY);
}

// --- Audio Gain Logic (Unchanged) ---
function equalPowerGain(position, isDay) {
    const angle = position * 0.5 * Math.PI;
    return isDay ? Math.cos(angle) : Math.sin(angle);
}
function applyIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 0; }
    if (p >= 1 - buffer) { return 1; }
    return (p - buffer) / (1 - 2 * buffer);
}
function applyOppositeIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 1; }
    if (p >= 1 - buffer) { return 0; }
    return (1 - p - buffer) / (1 - 2 * buffer);
}
function getCurrentCorner(x, y) {
    const isTop = y < 0.5;
    const isLeft = x < 0.5;

    if (isTop && isLeft) return 'TL';
    if (isTop && !isLeft) return 'TR';
    if (!isTop && isLeft) return 'BL';
    if (!isTop && !isLeft) return 'BR';
    return null;
}
function updateAudioGains(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();

    if (event && event.clientX && !event.forceFade) { 
        lastMouseX = event.clientX;
        lastMouseY = event.clientY;
    }

    let x = (lastMouseX - rect.left) / rect.width;
    let y = (lastMouseY - rect.top) / rect.height;

    const rampDuration = (event && event.forceFade) ? FADE_TIME_TOGGLE : RAMP_TIME;
    const now = audioContext.currentTime;
    
    // --- 1. SPATIAL GAIN CALCULATION ---
    const xToRight = applyIsolation(x);
    const xToLeft = applyOppositeIsolation(x);
    const yToBottom = applyIsolation(y);
    const yToTop = applyOppositeIsolation(y);

    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };

    // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION ---
    const dayMix = equalPowerGain(crossfadePosition, true);
    const nightMix = equalPowerGain(crossfadePosition, false);
    
    const ambienceMixes = { Day: dayMix, Night: nightMix };

    ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
        const dayKey = `${cornerKey}_Day`;
        const nightKey = `${cornerKey}_Night`;
        
        const dayTargetGain = baseGains[cornerKey] * dayMix;
        const nightTargetGain = baseGains[cornerKey] * nightMix;
        
        if (gainMap[dayKey]) {
            gainMap[dayKey].gain.linearRampToValueAtTime(dayTargetGain, now + rampDuration);
        }
        if (gainMap[nightKey]) {
            gainMap[nightKey].gain.linearRampToValueAtTime(nightTargetGain, now + rampDuration);
        }
    });

    // --- 3. ADD-ON GAIN CALCULATION (Using Logical Keys) ---
    ADDON_LOGICAL_KEYS.forEach(logicalKey => {
        const state = addOnStateMap[logicalKey];

        if (state && state.gain) { 
            
            const corner = logicalKey.substring(0, 2); 
            const mode = logicalKey.includes('_Night') ? 'Night' : 'Day';
            
            const modeMix = ambienceMixes[mode];
            const modeBase = baseGains[corner];
            
            let target = MINIMUM_GAIN;

            if (state.active) {
                if (modeMix > MINIMUM_GAIN) {
                    // Check if we are currently crossfading a segment out
                    if (logicalKey === BL_DAY_ADDON_KEY && previousLakeAddOnSource) {
                        // During a crossfade, the current segment ramps up to MAX_ADDON_VOLUME 
                        // modulated by the spatial mix, but the previous source is handled in scheduleNextLakeAddOnSegment.
                        // We still use the base gain calculation here:
                        target = modeBase * modeMix * MAX_ADDON_VOLUME;
                    } else {
                        // For all other AddOns, this is the standard target.
                        target = modeBase * modeMix * MAX_ADDON_VOLUME; 
                    }
                }
            }
            
            // This is the spatial/mode ramp applied to all AddOns.
            // Note: The BL_Day_AddOn gain node is special and is also ramped down in scheduleNextLakeAddOnSegment.
            state.gain.gain.linearRampToValueAtTime(target, now + rampDuration);
        }
    });

    // --- 4. VISUALS (Labels - Unchanged) ---
    const calculatedGains = [
        baseGains.TL * dayMix + baseGains.TL * nightMix, 
        baseGains.TR * dayMix + baseGains.TR * nightMix, 
        baseGains.BL * dayMix + baseGains.BL * nightMix, 
        baseGains.BR * dayMix + baseGains.BR * nightMix
    ];

    const maxGain = Math.max(...calculatedGains);
    labels.forEach(label => label.classList.remove('active-glow'));

    if (maxGain > 0.60) {
        const maxIndex = calculatedGains.indexOf(maxGain);
        if (labels[maxIndex]) {
            labels[maxIndex].classList.add('active-glow');
        }
    }
}

function startCrossfade(targetIsNight) {
    if (isCrossfading) return;
    isCrossfading = true;

    const duration = FADE_TIME_TOGGLE;
    const startTime = audioContext.currentTime;
    const startPosition = crossfadePosition;
    const endPosition = targetIsNight ? 1.0 : 0.0;
    const distance = endPosition - startPosition;

    const animate = () => {
        const now = audioContext.currentTime;
        const elapsed = now - startTime;

        if (elapsed >= duration) {
            crossfadePosition = endPosition;
            isCrossfading = false;
            updateAudioGains({ forceFade: true });
            return;
        }

        let t = elapsed / duration;
        crossfadePosition = startPosition + distance * t;
        updateAudioGains({ forceFade: true });

        requestAnimationFrame(animate);
    };

    requestAnimationFrame(animate);
}

function toggleDayNight() {
    if (!audioReady || isCrossfading) return;
    initializeAudio();

    const isCurrentlyDay = (crossfadePosition < 0.5);
    const targetIsNight = isCurrentlyDay;

    if (targetIsNight && !nightAudioLoaded) {
        showMessage("Night audio is still loading. Please wait a moment.", false);
        return;
    }

    updateBackground(targetIsNight ? 'Night' : 'Day');
    startCrossfade(targetIsNight);
}

// --- Lake Day Sequence Logic (UPDATED for Crossfade and Bug Fix) ---

function stopLakeAddOnSequence() {
    if (nextSegmentScheduler) {
        clearTimeout(nextSegmentScheduler);
        nextSegmentScheduler = null;
    }
    
    // Stop the currently playing source
    if (lakeAddOnSource) {
        const now = audioContext.currentTime;
        const gainNode = addOnStateMap[BL_DAY_ADDON_KEY].gain.gain;

        // Apply a fade-out to the main gain node
        if (gainNode.value > MINIMUM_GAIN) {
             gainNode.cancelAndHoldAtTime(now);
             gainNode.linearRampToValueAtTime(MINIMUM_GAIN, now + RAMP_TIME); // Quick ramp down
        }
        
        // Stop the source after the fade-out time
        lakeAddOnSource.stop(now + RAMP_TIME); 
        lakeAddOnSource = null;
    }
    
    // Also stop the previous source if it was still crossfading
    if (previousLakeAddOnSource) {
        previousLakeAddOnSource.stop(0); // Instant stop, as its gain should already be at MINIMUM_GAIN
        previousLakeAddOnSource = null;
    }
}

// **CRITICAL FIXES HERE:** Implemented 1.5s crossfade between segments.
function scheduleNextLakeAddOnSegment(previousIndex) {
    const ambienceData = ambienceSourceMap['BL_Day'];
    const now = audioContext.currentTime;

    const nextIndex = (previousIndex + 1) % BL_DAY_SEGMENTS.length;
    const previousSegment = BL_DAY_SEGMENTS[previousIndex]; // Get outgoing segment data
    const nextSegment = BL_DAY_SEGMENTS[nextIndex]; // Get incoming segment data
    
    const audioKey = nextSegment.key;
    const buffer = audioBuffers[audioKey];
    if (!buffer) return;
    
    // --- 1. Calculate the precise Web Audio time when this next segment must logically START ---
    let scheduleLogicalStart = 0; // The time on the context clock when the main ambience switches
    
    if (nextIndex === 0) {
        const currentLoopCount = Math.floor((now - ambienceData.startTime) / BL_AMB_DURATION);
        scheduleLogicalStart = ambienceData.startTime + (currentLoopCount + 1) * BL_AMB_DURATION;
    } else {
        const currentLoopCount = Math.floor((now - ambienceData.startTime) / BL_AMB_DURATION);
        scheduleLogicalStart = ambienceData.startTime + currentLoopCount * BL_AMB_DURATION + nextSegment.start;
        
        if (scheduleLogicalStart < now) {
             scheduleLogicalStart += BL_AMB_DURATION;
        }
    }
    
    // --- 2. Determine randomization and segment duration to play ---
    const segmentDuration = nextSegment.end - nextSegment.start;
    const randomOffset = Math.random() * segmentDuration;
    
    // The duration we need to play the new source for: 
    // This source will play from (randomOffset) for (segmentDuration - randomOffset) time 
    // plus the FADE_TIME, because we need it to continue playing as the next segment starts its fade-in.
    const durationToPlay = (segmentDuration - randomOffset) + LAKE_ADDON_FADE_TIME; 

    // --- 3. Create and start the NEW source node (Fade-In) ---
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(addOnStateMap[BL_DAY_ADDON_KEY].gain); // Connect to the shared gain node
    source.onended = () => {
         // CRITICAL FIX: Ensure the system restarts the sequence if the track ends prematurely
         // This should only happen if the AddOn is still active and the source finished unexpectedly.
         // However, with the large durationToPlay, this should ideally never fire.
         if (addOnStateMap[BL_DAY_ADDON_KEY].active && lakeAddOnSource === source) {
             showMessage("Lake Add-on source ended unexpectedly! Restarting segment sequence.", true);
             scheduleNextLakeAddOnSegment(previousIndex);
         }
    };

    // Calculate the actual start time: we need to start the new track early to allow for the fade-in
    const scheduleActualStart = scheduleLogicalStart - LAKE_ADDON_FADE_TIME;
    
    // Start playback: (start_time, offset, duration)
    source.start(scheduleActualStart, randomOffset, durationToPlay); 
    
    previousLakeAddOnSource = lakeAddOnSource; // Store the outgoing source
    lakeAddOnSource = source; // Set the new source as the current one

    // --- 4. Implement Crossfade Logic ---
    const gainNode = addOnStateMap[BL_DAY_ADDON_KEY].gain.gain;
    
    // A. FADE OUT the Previous Source's gain (if it exists)
    if (previousLakeAddOnSource) {
        // We do this by scheduling the gain to reach MINIMUM_GAIN at the logical start time
        gainNode.linearRampToValueAtTime(MINIMUM_GAIN, scheduleLogicalStart);
        
        // B. Stop the previous source slightly after the fade is complete
        // Since the previous source is also connected to this gain node, it will fade out with the main gain.
        // We stop it after the fade, at the logical start time + a small buffer.
        previousLakeAddOnSource.stop(scheduleLogicalStart + RAMP_TIME); 
    }
    
    // C. FADE IN the New Source's gain
    // The new source starts at scheduleActualStart when the gain is at MINIMUM_GAIN (from the previous ramp end/hold).
    // The gain node will already be set by the previous ramp, so we ramp it back up.
    // NOTE: This assumes updateAudioGains() is NOT actively overriding the gain value during this transition window.
    // The gain node needs to ramp back up to 1.0 (before spatial/mode modulation) over 1.5 seconds.
    gainNode.setValueAtTime(MINIMUM_GAIN, scheduleActualStart); // Ensure it starts silent
    gainNode.linearRampToValueAtTime(MAX_ADDON_VOLUME, scheduleLogicalStart); // Ramp up to full by logical start time.
    
    // The updateAudioGains function handles the continuous spatial and mode modulation.
    
    showMessage(`Lake Add-on switched to ${nextSegment.name}. New segment FADES IN at ${scheduleActualStart.toFixed(2)}s and is full volume at ${scheduleLogicalStart.toFixed(2)}s.`, false);
    
    // --- 5. Schedule the next transition ---
    const timeUntilNext = scheduleLogicalStart - now + segmentDuration;
    
    // The next scheduling needs to happen just before the next crossfade starts (1.5s before the logical switch)
    const schedulingTime = (timeUntilNext * 1000) - (LAKE_ADDON_FADE_TIME * 1000) - 10; 
    
    if (schedulingTime > 0) {
        nextSegmentScheduler = setTimeout(() => {
            scheduleNextLakeAddOnSegment(nextIndex);
        }, schedulingTime);
    } else {
        // Immediately try to schedule the next segment if we've missed the window (should not happen)
        showMessage("Scheduling window missed! Immediately scheduling next segment.", true);
        scheduleNextLakeAddOnSegment(nextIndex);
    }
}


function startLakeAddOnSequence() {
    stopLakeAddOnSequence(); 
    
    const ambienceData = ambienceSourceMap['BL_Day'];
    if (!ambienceData) {
        showMessage("BL_Day ambience track time data not found.", true);
        return;
    }
    
    const now = audioContext.currentTime;
    const loopPosition = (now - ambienceData.startTime) % BL_AMB_DURATION;
    
    // 1. Find the current segment
    let currentSegmentIndex = 0;
    for (let i = 0; i < BL_DAY_SEGMENTS.length; i++) {
        if (loopPosition >= BL_DAY_SEGMENTS[i].start && loopPosition < BL_DAY_SEGMENTS[i].end) {
            currentSegmentIndex = i;
            break;
        }
    }
    
    const currentSegment = BL_DAY_SEGMENTS[currentSegmentIndex];
    const segmentDuration = currentSegment.end - currentSegment.start;
    const audioKey = currentSegment.key;
    const buffer = audioBuffers[audioKey];
    if (!buffer) return;
    
    // 2. Calculate initial playback details (includes randomization for initial offset)
    const segmentTimeElapsed = loopPosition - currentSegment.start; 
    const randomInitialOffset = Math.random() * segmentDuration;
    const offsetIntoFile = (segmentTimeElapsed + randomInitialOffset) % segmentDuration;
    const durationToPlay = segmentDuration - segmentTimeElapsed + LAKE_ADDON_FADE_TIME; 

    // 3. Create and start the source node
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(addOnStateMap[BL_DAY_ADDON_KEY].gain);
    
    // Start playback: (start_time, offset, duration)
    source.start(now, offsetIntoFile, durationToPlay); 
    
    lakeAddOnSource = source;

    // 4. Ramp the gain up immediately over the standard ramp time (0.05s), 
    // then updateAudioGains will take over.
    const gainNode = addOnStateMap[BL_DAY_ADDON_KEY].gain.gain;
    gainNode.linearRampToValueAtTime(MAX_ADDON_VOLUME, now + RAMP_TIME);

    showMessage(`Lake Day Add-on started at ${loopPosition.toFixed(2)}s, currently ${currentSegment.name}. Starting file offset: ${offsetIntoFile.toFixed(2)}s.`, false);

    // 5. Schedule the next transition
    const timeUntilNext = segmentDuration - segmentTimeElapsed;
    // Schedule the next transition to run 1.5s before the logical switch point
    const schedulingTime = (timeUntilNext * 1000) - (LAKE_ADDON_FADE_TIME * 1000) - 10; 
    
    if (schedulingTime > 0) {
        nextSegmentScheduler = setTimeout(() => {
            scheduleNextLakeAddOnSegment(currentSegmentIndex);
        }, schedulingTime);
    } else {
        showMessage("Initial segment is too short to schedule gracefully. Scheduling next one immediately.", true);
        scheduleNextLakeAddOnSegment(currentSegmentIndex);
    }
}

// --- END Lake Day Sequence Logic ---

// --- UPDATED Add-On Toggle Function (Unchanged except for the fixes in loadAddOnAudio) ---
async function toggleAddOn() {
    initializeAudio(); 
    
    if (!audioReady || !addOnAudioLoaded) {
        if (!addOnAudioLoaded) showMessage("Add-on audio files are still loading or failed to load.", true);
        return;
    }
    
    const isCurrentlyDay = (crossfadePosition < 0.5);
    const currentMode = isCurrentlyDay ? 'Day' : 'Night';
    
    const rect = pad.getBoundingClientRect();
    let x = (lastMouseX - rect.left) / rect.width;
    let y = (lastMouseY - rect.top) / rect.height;

    const currentCornerKey = getCurrentCorner(x, y); 
    const currentAddOnName = cornerNames[currentCornerKey]; 
    const logicalKey = `${currentCornerKey}_${currentMode}_AddOn`;
    
    const state = addOnStateMap[logicalKey];

    if (!state) return; 
    
    const iconElement = addOnIcons[currentCornerKey];
    if (!iconElement) return;

    const isCabinAddOn = (currentCornerKey === 'TL'); 
    const isRangerAddOn = (currentCornerKey === 'BR');
    const isSFXAddOn = isCabinAddOn || isRangerAddOn;
    const isLakeDayAddOn = (logicalKey === BL_DAY_ADDON_KEY);

    // Calculate spatial gains and mode mix for manual ramp-up later
    const xToRight = applyIsolation(x);
    const xToLeft = applyOppositeIsolation(x);
    const yToBottom = applyIsolation(y);
    const yToTop = applyOppositeIsolation(y);
    const modeMix = equalPowerGain(crossfadePosition, isCurrentlyDay); 

    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };
    const currentBaseGain = baseGains[currentCornerKey];

    // --- TOGGLE LOGIC ---

    // Scenario 1: Add-on is ALREADY active. TURN OFF.
    if (state.active) {
        state.active = false; 
        
        if (isSFXAddOn && sfxLoaded) {
            let offKeys;
            if (isCabinAddOn) {
                offKeys = currentMode === 'Day' ? buttonCabinDayOffKeys : buttonCabinNightOffKeys;
            } else if (isRangerAddOn) {
                offKeys = currentMode === 'Day' ? buttonRangerDayOffKeys : buttonRangerNightOffKeys;
            }
            if (offKeys) {
                const randomKey = offKeys[Math.floor(Math.random() * offKeys.length)];
                playSfx(randomKey);
            }
        }

        if (isLakeDayAddOn) {
            stopLakeAddOnSequence();
        } 
        else if (state.gain) {
            if (isRangerAddOn) {
                state.gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
            } else {
                state.gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
            }
        }
        
        iconElement.classList.remove('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned OFF.`, false);
    } 
    // Scenario 2: Add-on is currently inactive. TURN ON.
    else {
        state.active = true; 
        
        let rampStart = audioContext.currentTime;
        let onKeys = null;
        let applyManualRamp = false;

        if (isCabinAddOn) {
            onKeys = currentMode === 'Day' ? buttonCabinDayOnKeys : buttonCabinNightOnKeys;
            rampStart += CABINET_ADDON_DELAY; 
            applyManualRamp = true;
        } else if (isRangerAddOn) {
            onKeys = currentMode === 'Day' ? buttonRangerDayOnKeys : buttonRangerNightOnKeys;
            rampStart += CABINET_ADDON_DELAY; 
            applyManualRamp = true;
        }
        
        if (isSFXAddOn && sfxLoaded && onKeys) {
            const randomKey = onKeys[Math.floor(Math.random() * onKeys.length)];
            playSfx(randomKey);
        }

        if (isLakeDayAddOn) {
            startLakeAddOnSequence(); 
        } else if (applyManualRamp && state.gain) {
            const targetGain = currentBaseGain * modeMix * MAX_ADDON_VOLUME;
            const gain = state.gain.gain;
            
            gain.setValueAtTime(MINIMUM_GAIN, rampStart); 
            gain.linearRampToValueAtTime(targetGain, rampStart + RAMP_TIME);
        }

        // Force audio update for all Add-Ons (ramps non-SFX AddOns (TR, BL Night) up instantly/spatially)
        updateAudioGains({ forceFade: true }); 
        
        iconElement.classList.add('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned ON.`, false);
    }
}

function handleMouseMove(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();
    const cursorX = event.clientX;
    const cursorY = event.clientY;
    
    lastMouseX = event.clientX;
    lastMouseY = event.clientY;

    const isOutsideX = cursorX < rect.left || cursorX > rect.right;
    const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

    if (isOutsideX || isOutsideY) {
        const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
        const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

        const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));
        let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
        opacity = Math.min(1, Math.max(0, opacity));

        if (opacity > 0) {
            indicator.style.left = `${cursorX}px`;
            indicator.style.top = `${cursorY}px`;
            indicator.style.opacity = opacity.toFixed(2);
        } else {
            indicator.style.opacity = '0';
        }
        updateAudioGains(); 
    } else {
        indicator.style.left = `${cursorX}px`;
        indicator.style.top = `${cursorY}px`;
        indicator.style.opacity = '1';

        updateAudioGains(event);
    }
}

function handleTouchMove(event) {
    event.preventDefault(); 
    const touch = event.touches[0];
    const syntheticEvent = {
        clientX: touch.clientX,
        clientY: touch.clientY,
        forceFade: false
    };
    handleMouseMove(syntheticEvent);
}

function handleTouchEnd() {
    const syntheticEvent = {
        clientX: lastMouseX,
        clientY: lastMouseY,
        forceFade: false
    };
}

function handleMouseEnter() { 
    mouseInPad = true;
}

function handleMouseLeave() { 
    showMessage("MOUSE LEAVE TRIGGERED: Fading Ambience Out."); 
    mouseInPad = false; 
    
    const now = audioContext.currentTime;
    const rampDuration = 0.5;
    
    Object.keys(gainMap).forEach(key => {
        gainMap[key].gain.linearRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);
    });
    
    labels.forEach(label => label.classList.remove('active-glow')); 
    pad.style.boxShadow = '0 0 15px #79C2A8'; 
    pad.style.borderColor = '#79C2A8';
}

function initializeAudio() {
    if (!audioInitiated && audioReady) {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume().then(() => {
                audioInitiated = true;
                showMessage("Audio engaged! Start mixing by moving your cursor.", false);
            });
        } else if (audioContext && audioContext.state === 'running') {
            audioInitiated = true;
        }
    }
}

document.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
        event.preventDefault(); 
        initializeAudio(); 
        toggleDayNight();
    } 
    else if (event.code === 'Enter' || event.code === 'NumpadEnter') { 
        event.preventDefault(); 
        toggleAddOn();
    }
});

document.addEventListener('DOMContentLoaded', async () => {
    // 1. Element lookups
    pad = document.getElementById('audioPad');
    indicator = document.getElementById('mouseIndicator');
    messageBox = document.getElementById('messageBox'); 
    
    bgLayer1 = document.getElementById('bgLayer1');
    bgLayer2 = document.getElementById('bgLayer2');
    currentBgLayer = bgLayer1;
    nextBgLayer = bgLayer2;
    
    labelTL = document.getElementById('labelTL');
    labelTR = document.getElementById('labelTR');
    labelBL = document.getElementById('labelBL');
    labelBR = document.getElementById('labelBR');
    labels = [labelTL, labelTR, labelBL, labelBR]; 
    
    // Icon Element Lookups
    iconTL = document.getElementById('iconTL');
    iconTR = document.getElementById('iconTR');
    iconBL = document.getElementById('iconBL');
    iconBR = document.getElementById('iconBR');
    
    // Populate the icon map
    addOnIcons = {
        'TL': iconTL,
        'TR': iconTR,
        'BL': iconBL,
        'BR': iconBR
    };

    if (pad) {
        pad.addEventListener('mouseenter', handleMouseEnter);
        pad.addEventListener('mouseleave', handleMouseLeave);
    }

    // 2. Load all audio files asynchronously
    const daySuccess = await loadInitialAudio();
    if (!daySuccess) return; 

    const nightSuccess = await loadNightAudio();
    if (!nightSuccess) return; 
    
    // CRITICAL: The order of loading and starting matters
    const sfxSuccess = await loadSfxAudio();
    if (!sfxSuccess) showMessage("SFX failed to load, button features for Cabin and Ranger Station will be disabled.", true);

    const addOnSuccess = await loadAddOnAudio(); 
    if (!addOnSuccess) return;
    
});

document.addEventListener('mousemove', handleMouseMove);
document.addEventListener('mousedown', initializeAudio);
document.addEventListener('touchstart', initializeAudio);
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);
</script>
