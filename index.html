<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maine Mixer: Isolated Crossfade Pad</title>
    
    <!-- Load custom fonts for theme -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS for Dark Wilderness Theme --- */
        body {
            font-family: 'Montserrat', sans-serif; 
            background-color: #1a1a1a;
            cursor: none; 
            
            /* --- BACKGROUND IMAGE FIX --- */
            /* Using the confirmed filename provided by the user */
            background-image: url('Woods.jpg'); 
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #d4d4d4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column; 
        }

        .container {
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            /* Using a slightly darker background to enhance contrast over the image */
            background: rgba(30, 40, 40, 0.8); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            max-width: 90%;
            backdrop-filter: blur(5px);
            max-width: 700px; /* Limit container width for desktop readability */
        }

        h1 {
            /* Maine Mixer Title Styling */
            font-family: 'Cinzel', serif; 
            font-size: clamp(2em, 5vw, 4em); /* Responsive font size */
            color: #C2E8CC; 
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 
                0 0 5px rgba(194, 232, 204, 0.7),
                0 0 10px rgba(121, 194, 168, 0.5),
                0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* --- X-Y Pad Styling --- */
        #audioPad {
            width: clamp(280px, 80vw, 600px); /* Responsive size for mobile/desktop */
            height: clamp(280px, 80vw, 600px);
            border: 3px solid #79C2A8;
            position: relative;
            margin: 20px auto;
            background: rgba(48, 62, 77, 0.4); 
            border-radius: 8px;
            transition: box-shadow 0.3s ease;
            touch-action: none; /* Prevent scroll on touch devices */
        }

        #audioPad:hover {
            box-shadow: 0 0 20px rgba(121, 194, 168, 0.8);
        }

        /* --- Elegant Corner Labels --- */
        .corner-label {
            position: absolute;
            padding: 8px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(0.7em, 2vw, 0.9em);
            font-weight: 400;
            color: #e0e0e0;
            
            /* Glass/Frosted Effect */
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(4px); 
            
            border-radius: 6px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        #labelTL { top: 10px; left: 10px; }
        #labelTR { top: 10px; right: 10px; }
        #labelBL { bottom: 10px; left: 10px; }
        #labelBR { bottom: 10px; right: 10px; }

        /* The custom cursor/indicator */
        #mouseIndicator {
            width: 20px;
            height: 20px;
            background-color: #79C2A8;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 15px 8px rgba(121, 194, 168, 0.7);
            opacity: 0; 
            transition: transform 0.05s ease-out, opacity 0.3s linear;
            z-index: 1000;
        }

        /* Message Box for errors/status */
        #messageBox {
            margin-top: 20px;
            padding: 15px;
            background: rgba(194, 232, 204, 0.1);
            border: 1px solid #79C2A8;
            border-radius: 8px;
            color: #C2E8CC;
            font-size: 0.9em;
            display: none; /* Hidden by default */
            max-width: 600px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Maine Mixer</h1>
    <div id="audioPad">
        <div class="corner-label" id="labelTL">The Cabin</div>
        <div class="corner-label" id="labelTR">The Forest</div>
        <div class="corner-label" id="labelBL">The Lake</div>
        <div class="corner-label" id="labelBR">The Storm</div>
    </div>
    <div id="messageBox">Loading audio files... Please click anywhere to enable audio playback after loading.</div>
</div>
<div id="mouseIndicator"></div>

<script>
    // Set up references to DOM elements
    const pad = document.getElementById('audioPad');
    const indicator = document.getElementById('mouseIndicator');
    const messageBox = document.getElementById('messageBox');

    // Web Audio API variables
    let audioContext = null;
    let gainMap = {}; // REPLACED gainNodes array with gainMap object for explicit mapping
    let sourceNodes = [];
    let audioBuffers = {};
    let isPlaying = false; 
    let audioReady = false;
    let audioInitiated = false; // Tracks if AudioContext has been unlocked

    // FILE PATHS: Mapped to your audio files and the visual quadrants:
    // IMPORTANT: Ensure your files are in an 'audio/' directory relative to index.html
    const audioFilePaths = {
        TL: 'audio/Cabin.wav',   // Top Left: The Cabin
        TR: 'audio/Forest.wav',  // Top Right: The Forest
        BL: 'audio/Lake.wav',    // Bottom Left: The Lake
        BR: 'audio/Storm.wav'    // Bottom Right: The Storm
    };
    
    // Define the size of the fade-out buffer zone in pixels outside the pad
    const FADE_BUFFER_DISTANCE = 100; 
    
    // Define the isolation zone size (0 to 0.5).
    // 0.333 = 1/3 of the pad width/height for the isolation zone before crossfading starts
    const ISOLATION_BUFFER_SIZE = 0.333; 
    const MINIMUM_GAIN = 0.0001;
    const RAMP_TIME = 0.05;

    // --- Helper Functions (Audio Loading) ---
    function showMessage(text, isError = false) {
        messageBox.textContent = text;
        messageBox.style.display = 'block';
        messageBox.style.backgroundColor = isError ? 'rgba(255, 0, 0, 0.1)' : 'rgba(194, 232, 204, 0.1)';
        messageBox.style.borderColor = isError ? '#FF5555' : '#79C2A8';
        console.log(`[Status] ${text}`); // Log status for better debugging
    }

    async function loadAudioFile(url, key) {
        showMessage(`Loading: ${url}...`);
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error ${response.status}: Could not fetch file. Check the path and file existence.`);
            }
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            audioBuffers[key] = audioBuffer;
            console.log(`Successfully loaded: ${url}`);
        } catch (error) {
            console.error(`ERROR loading audio file ${url}:`, error);
            showMessage(`Failed to load audio file: ${url}. Error: ${error.message}. Check the console!`, true);
            return { key, success: false, error: error.message }; 
        }
        return { key, success: true };
    }

    async function loadAllAudioFiles() {
        if (audioReady) return;
        
        // Initialize AudioContext lazily
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const loadPromises = Object.keys(audioFilePaths).map(key => 
            loadAudioFile(audioFilePaths[key], key)
        );

        const results = await Promise.all(loadPromises);
        
        const successfulLoads = results.filter(r => r && r.success).length;

        if (successfulLoads === Object.keys(audioFilePaths).length) {
            audioReady = true;
            showMessage("All audio loaded! Click the pad or move your cursor to start the mix.");

            // Initialize all source nodes and connect them, saving the gain node to the map using the key (TL, TR, BL, BR)
            Object.keys(audioBuffers).forEach(key => {
                const buffer = audioBuffers[key];
                const source = audioContext.createBufferSource();
                const gain = audioContext.createGain();

                source.buffer = buffer;
                source.loop = true;
                gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime); // Start silent
                source.connect(gain);
                gain.connect(audioContext.destination);

                sourceNodes.push(source);
                gainMap[key] = gain; // Store gain node explicitly by quadrant key
                
                // Start the playback. It will remain silent until gains are updated.
                source.start(0); 
            });
            isPlaying = true;
        } else {
            showMessage(`Only ${successfulLoads} of ${Object.keys(audioFilePaths).length} audio files loaded successfully. Cannot start playback. See console for missing files.`, true);
        }
    }

    // --- Core Audio Gain Logic with Isolation Buffer ---

    // Helper function to calculate gain ramp for the opposite side (0 at p=0, 1 at p=1)
    function applyIsolation(p) {
        const buffer = ISOLATION_BUFFER_SIZE;
        // The ramp is 0 up to buffer, 1 at 1-buffer, and 0 beyond
        if (p <= buffer) {
            return 0; 
        } else if (p >= 1 - buffer) {
            return 1;
        } else {
            // Linear ramp from 0 to 1 over the center section (1 - 2 * buffer wide)
            return (p - buffer) / (1 - 2 * buffer);
        }
    }

    // Helper function to calculate gain ramp for the near side (1 at p=0, 0 at p=1)
    function applyOppositeIsolation(p) {
        const buffer = ISOLATION_BUFFER_SIZE;
        // The ramp is 1 up to buffer, 0 at 1-buffer, and 1 beyond
        if (p <= buffer) {
            return 1;
        } else if (p >= 1 - buffer) {
            return 0;
        } else {
            // Linear ramp from 1 to 0 over the center section
            return 1 - ((p - buffer) / (1 - 2 * buffer));
        }
    }


    function updateAudioGains(event) {
        if (!audioReady || !isPlaying) return;

        const rect = pad.getBoundingClientRect();
        
        // Calculate normalized X (0=Left, 1=Right) and Y (0=Top, 1=Bottom) coordinates
        let x = (event.clientX - rect.left) / rect.width;
        let y = (event.clientY - rect.top) / rect.height;

        // --- Overall Volume Fade-out Logic (if mouse leaves the pad) ---
        let distanceToPad = 0;
        let clampedX = x;
        let clampedY = y;

        // Determine how far the cursor is from the pad's edges (normalized distance)
        if (x < 0) { clampedX = 0; distanceToPad = Math.max(distanceToPad, -x); }
        if (x > 1) { clampedX = 1; distanceToPad = Math.max(distanceToPad, x - 1); }
        if (y < 0) { clampedY = 0; distanceToPad = Math.max(distanceToPad, -y); }
        if (y > 1) { clampedY = 1; distanceToPad = Math.max(distanceToPad, y - 1); }

        let normalizedDistance = 0;
        if (distanceToPad > 0) {
            // Calculate pixel distance from the closest point on the pad
            const pixelDistanceX = (event.clientX - (rect.left + clampedX * rect.width));
            const pixelDistanceY = (event.clientY - (rect.top + clampedY * rect.height));
            const pixelDistance = Math.sqrt(pixelDistanceX * pixelDistanceX + pixelDistanceY * pixelDistanceY);
            
            // Normalize distance relative to the FADE_BUFFER_DISTANCE
            normalizedDistance = Math.min(1, pixelDistance / FADE_BUFFER_DISTANCE);
        }

        // Master volume factor (1 when inside/close, 0 when far outside)
        const masterVolume = 1 - normalizedDistance; 
        
        // Clamp x and y to 0-1 for quadrant calculation (important for isolation logic)
        x = Math.min(1, Math.max(0, x));
        y = Math.min(1, Math.max(0, y));

        // --- Quadrant Gain Calculation with Isolation ---
        
        // Horizontal ramps (L/R)
        const xToRight = applyIsolation(x); 
        const xToLeft = applyOppositeIsolation(x);

        // Vertical ramps (T/B)
        const yToBottom = applyIsolation(y); 
        const yToTop = applyOppositeIsolation(y);

        // Calculate normalized gains for the physical quadrants
        const gainTL_norm = xToLeft * yToTop;       // Top Left (near Left/Top edges)
        const gainTR_norm = xToRight * yToTop;      // Top Right (near Right/Top edges)
        const gainBL_norm = xToLeft * yToBottom;    // Bottom Left (near Left/Bottom edges)
        const gainBR_norm = xToRight * yToBottom;   // Bottom Right (near Right/Bottom edges)

        // Apply master volume to the normalized gains
        const gainTL = gainTL_norm * masterVolume; 
        const gainTR = gainTR_norm * masterVolume; 
        const gainBL = gainBL_norm * masterVolume; 
        const gainBR = gainBR_norm * masterVolume; 
        
        const now = audioContext.currentTime;

        // --- EXPLICIT AUDIO MAPPING USING gainMap (Fixes load order issues) ---
        // TL (Cabin) audio source MUST receive TL calculated gain
        if (gainMap.TL) gainMap.TL.gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainTL), now + RAMP_TIME); 
        // TR (Forest) audio source MUST receive TR calculated gain
        if (gainMap.TR) gainMap.TR.gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainTR), now + RAMP_TIME); 
        // BL (Lake) audio source MUST receive BL calculated gain
        if (gainMap.BL) gainMap.BL.gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainBL), now + RAMP_TIME); 
        // BR (Storm) audio source MUST receive BR calculated gain
        if (gainMap.BR) gainMap.BR.gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainBR), now + RAMP_TIME); 
    }

    // --- Interaction Handlers ---

    // Function to resume AudioContext (necessary for Chrome/Safari auto-play policies)
    function initializeAudio() {
        if (!audioInitiated && audioReady && audioContext.state === 'suspended') {
            audioContext.resume().then(() => {
                audioInitiated = true;
                showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                setTimeout(() => messageBox.style.display = 'none', 3000); // Hide message after 3 seconds
            }).catch(e => console.error("Could not resume audio context:", e));
        } else if (audioReady && audioInitiated && messageBox.style.display === 'block') {
             // Hide message if context is already running and user clicks/touches
             messageBox.style.display = 'none';
        }
    }

    // Global Mouse Tracker (handles indicator position and fade-out)
    function handleMouseMove(event) {
        // 1. Position the Indicator
        indicator.style.left = `${event.clientX}px`;
        indicator.style.top = `${event.clientY}px`;
        
        const rect = pad.getBoundingClientRect();
        const cursorX = event.clientX;
        const cursorY = event.clientY;

        // 2. Determine visibility based on proximity to the pad
        const isOutsideX = cursorX < rect.left || cursorX > rect.right;
        const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

        if (isOutsideX || isOutsideY) {
            // Find the closest point on the rectangle (clamped coordinates)
            const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
            const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

            // Calculate distance from the closest point
            const distance = Math.sqrt(
                Math.pow(cursorX - closestX, 2) + 
                Math.pow(cursorY - closestY, 2)
            );

            // Calculate opacity: 1 when distance=0, 0 when distance=FADE_BUFFER_DISTANCE
            let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
            opacity = Math.min(1, Math.max(0, opacity)); 

            if (opacity > 0) {
                indicator.style.opacity = opacity.toFixed(2);
            } else {
                indicator.style.opacity = '0'; 
            }
        } else {
            // Inside the pad: fully visible
            indicator.style.opacity = '0.8';
        }

        // 3. Update audio gains if ready
        if (audioReady && isPlaying) {
             updateAudioGains(event);
        }
    }

    // --- Touch Handlers (for mobile support) ---
    function handleTouchMove(event) {
        event.preventDefault(); // Prevent scrolling
        const touch = event.touches[0];
        // Create a synthetic event object that matches mousemove structure
        const syntheticEvent = {
            clientX: touch.clientX,
            clientY: touch.clientY
        };
        handleMouseMove(syntheticEvent); // Use the same logic
        initializeAudio(); // Attempt to resume audio context
    }

    function handleTouchEnd(event) {
        // When touch ends, simulate a 'mouse leave' to fade out the sound
        const rect = pad.getBoundingClientRect();
        const syntheticEvent = {
            // Place the cursor far outside the fade zone
            clientX: rect.left - FADE_BUFFER_DISTANCE * 2,
            clientY: rect.top - FADE_BUFFER_DISTANCE * 2
        };
        handleMouseMove(syntheticEvent); 
    }

    // --- Event Listeners ---
    document.addEventListener('DOMContentLoaded', () => {
        messageBox.style.display = 'block';
        loadAllAudioFiles();
    });
    
    // Global listener for movement (mouse and touch)
    document.addEventListener('mousemove', handleMouseMove);

    // Initial click/tap listener to unlock AudioContext
    document.addEventListener('mousedown', initializeAudio, { once: true });
    document.addEventListener('touchstart', initializeAudio, { once: true });

    // Touch-specific listeners
    pad.addEventListener('touchmove', handleTouchMove, { passive: false });
    pad.addEventListener('touchend', handleTouchEnd);

</script>

</body>
</html>
