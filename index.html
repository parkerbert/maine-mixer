<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allagash Ambience - Enter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Macondo+Swash+Caps&family=Roboto:wght@300&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. GLOBAL RESET & CURSOR LOCK --- */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            cursor: none !important; 
        }

        body {
            background-color: #050a05;
            color: #C2E2CC;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Handles the final fade-out */
            transition: opacity 1.5s ease; 
        }

        .fade-out {
            opacity: 0 !important;
        }

        /* --- 2. BACKGROUND IMAGE --- */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(213, 213, 213, 0.5), rgba(0, 0, 0, 0.7)), 
                              url('images/Title_Background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            /* Your modified 18s zoom */
            animation: subtleZoom 18s infinite alternate ease-in-out;
        }

        @keyframes subtleZoom {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* --- 3. THE MINT DOT --- */
        #mouseIndicator {
            position: fixed;
            width: 15px;
            height: 15px;
            background-color: #C2E2CC;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(194, 226, 204, 0.6);
            transition: transform 0.3s ease, background-color 0.3s ease, border 0.3s ease;
            /* Ensure it's visible immediately */
            left: -50px; 
            top: -50px;
        }

        /* --- 4. SCALABLE CONTENT --- */
        #title-content {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 1200px;
        }

        .intro-title {
            font-family: 'Macondo Swash Caps', cursive;
            font-size: clamp(2.5rem, 8vw, 6rem); 
            margin-bottom: 1.5vh;
            line-height: 1.1;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .intro-subtitle {
            font-weight: 300;
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            letter-spacing: clamp(2px, 0.5vw, 6px);
            margin-bottom: 6vh;
            opacity: 1;
        }

        #start-button {
            display: inline-block;
            text-decoration: none;
            color: #C2E2CC;
            border: 1px solid #C2E2CC;
            background: transparent;
            padding: 1em 2.5em;
            font-size: clamp(0.8rem, 1.2vw, 1.1rem);
            letter-spacing: 3px;
            transition: all 0.4s ease;
        }

        #start-button:hover {
            background-color: rgba(194, 226, 204, 0.15);
            box-shadow: 0 0 15px rgba(194, 226, 204, 0.2);
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="mouseIndicator"></div>

    <div id="title-content">
        <h1 class="intro-title">Allagash Ambience</h1>
        <h2 class="intro-subtitle">An Audio Journey</h2>
        <a href="main.html" id="start-button">CLICK TO BEGIN</a>
    </div>

    <script>
        const dot = document.getElementById('mouseIndicator');
        const btn = document.getElementById('start-button');
        const body = document.body;

        // --- NEW: Audio setup for the button click ---
        const clickSFX = new Audio('audio/Title_Button.ogg');
        clickSFX.preload = 'auto'; // Load in background

        // 1. INSTANT CURSOR TRACKING
        window.addEventListener('mousemove', (e) => {
            if (dot) {
                dot.style.left = e.clientX + 'px';
                dot.style.top = e.clientY + 'px';
            }
        });

        // 2. BUTTON INTERACTION & BULLETPROOF TRANSITION
        if (btn) {
            btn.addEventListener('mouseenter', () => {
                if (dot) {
                    dot.style.transform = 'translate(-50%, -50%) scale(1)';
                    dot.style.backgroundColor = '#C2E2CC';
                    dot.style.border = 'none';
                }
            });

            btn.addEventListener('mouseleave', () => {
                if (dot) {
                    dot.style.transform = 'translate(-50%, -50%) scale(1)';
                    dot.style.backgroundColor = '#C2E2CC';
                    dot.style.border = 'none';
                }
            });

            btn.addEventListener('click', function(e) {
                e.preventDefault(); // Stop the link from acting naturally
                
                // Play the sound effect
                clickSFX.play().catch(error => {
                    console.log("Audio playback failed:", error);
                });

                // Visual feedback: Start the fade-out
                body.classList.add('fade-out');

                // Force the browser to wait for the fade, then navigate
                setTimeout(() => {
                    window.location.href = 'main.html'; 
                }, 1500);
            });
        }
    </script>
</body>
</html>
