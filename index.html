<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maine Mixer</title>
    
    <style>
        /* --- General Layout and Background --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Ensure the body takes up the full viewport height */
            min-height: 100vh; 
            font-family: 'Arial', sans-serif;
            cursor: none;
            
            /* Background image assumes Woods.jpg is in the root directory */
            background: url('Woods.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: #C2E2CC; /* Light text color */
        }

        h1 {
            font-size: 3.5em;
            font-family: 'Georgia', serif; 
            color: #C2E2CC;
            text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
            margin-bottom: 20px;
        }

        /* --- Main Container (The dark background box) --- */
        .container {
            /* Anchor for the absolutely positioned button */
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            /* Lighter, more transparent background color */
            background-color: rgba(30, 45, 60, 0.8); 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* --- Audio Pad --- */
        #audioPad {
            /* CRITICAL FIX: Increased size to ensure it dominates the screen */
            width: 700px; 
            height: 700px; 
            
            border: 2px solid #79C2A8;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3); 
            box-shadow: 0 0 15px #79C2A8;
            margin: 0;
            border-radius: 5px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        /* --- Pad Labels and Indicator (No changes) --- */
        .pad-label {
            position: absolute;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #79C2A8;
            font-size: 0.9em;
            border-radius: 3px;
            transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
            pointer-events: none;
        }

        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }

        .active-glow {
            box-shadow: 0 0 10px #C2E2CC;
            background-color: rgba(194, 232, 204, 0.2);
            color: white;
        }

        #mouseIndicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #C2E2CC;
            box-shadow: 0 0 10px #C2E2CC;
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 1000;
        }

        /* --- Day/Night Toggle Button --- */
        #dayNightToggle {
            position: absolute;
            /* CRITICAL FIX: Center button vertically next to the pad */
            /* Pad height (700px) / 2 + container top padding (40px) */
            top: 390px; 
            /* CRITICAL FIX: Increased offset to move button far outside the box */
            right: -250px; 

            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            
            /* DAY MODE (Default, button shows 'Night') -> Greenish */
            background-color: #79C2A8; 
            color: #111;
            
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            z-index: 10; 
        }

        #dayNightToggle:disabled {
            cursor: wait;
            background-color: #555;
            color: #aaa;
        }

        /* NIGHT MODE ACTIVE (Button shows 'Day') -> Blueish */
        .night-mode-active {
            background-color: #4A567D !important;
            color: #C2E2CC !important;
        }

        .message-box {
            border: 1px solid #FF5555;
            background-color: rgba(255, 85, 85, 0.1);
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    
    <div id="mouseIndicator"></div>

    <div class="container">
        <h1>MAINE MIXER</h1>
        <div id="messageBox" class="message-box"></div> 
        
        <div class="controls-and-pad">
            <div id="audioPad">
                <div id="labelTL" class="pad-label top-left">The Cabin</div>
                <div id="labelTR" class="pad-label top-right">The Forest</div>
                <div id="labelBL" class="pad-label bottom-left">The Lake</div>
                <div id="labelBR" class="pad-label bottom-right">The Storm</div>
            </div>
        </div>
        
        <button id="dayNightToggle" disabled>
            Loading...
        </button>
            
    </div>
    
    <script>
        // Set up references to DOM elements
        let pad = null;
        let indicator = null; 
        let messageBox = null;
        let toggleButton = null;
        
        let labelTL = null;
        let labelTR = null;
        let labelBL = null;
        let labelBR = null;
        let labels = []; 

        // Web Audio API and State variables
        let audioContext = null;
        let gainMap = {};
        let audioBuffers = {};
        let isPlaying = false; 
        let audioReady = false; 
        let audioInitiated = false; 
        let mouseInPad = false;
        let isDayMode = true; 
        let lastMouseX = 0; 
        let lastMouseY = 0;

        // FILE PATHS: Mapped to all 8 audio files (Assumes audio/ directory is correct)
        const audioFilePaths = {
            TL_Day: 'audio/Cabin_Day.wav',
            TR_Day: 'audio/Forest_Day.wav',
            BL_Day: 'audio/Lake_Day.wav',
            BR_Day: 'audio/Storm_Day.wav',
            TL_Night: 'audio/Cabin_Night.wav',
            TR_Night: 'audio/Forest_Night.wav',
            BL_Night: 'audio/Lake_Night.wav',
            BR_Night: 'audio/Storm_Night.wav'
        };
        
        // Core constants
        const FADE_BUFFER_DISTANCE = 150; 
        const ISOLATION_BUFFER_SIZE = 0.333; 
        const MINIMUM_GAIN = 0.0001;
        const RAMP_TIME = 0.05;
        const FADE_TIME_TOGGLE = 0.5;

        // --- Helper Functions (Loading Audio and UI) ---
        function showMessage(text, isError = false) {
            if (!messageBox) return;
            messageBox.textContent = text;
            messageBox.style.display = 'block';
            messageBox.style.backgroundColor = isError ? 'rgba(255, 0, 0, 0.1)' : 'rgba(121, 194, 168, 0.1)';
            messageBox.style.borderColor = isError ? '#FF5555' : '#79C2A8';
            console.log(`[Status] ${text}`); 
        }

        async function loadAudioFile(url, key) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                audioBuffers[key] = audioBuffer;
            } catch (error) {
                console.error(`ERROR loading audio file ${url}:`, error);
                showMessage(`Failed to load audio file: ${url}. Check console for details.`, true); 
                return { key, success: false, error: error.message }; 
            }
            return { key, success: true };
        }

        async function loadAllAudioFiles() {
            if (audioReady) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            const loadPromises = Object.keys(audioFilePaths).map(key => 
                loadAudioFile(audioFilePaths[key], key)
            );

            const results = await Promise.all(loadPromises);
            
            const successfulLoads = results.filter(r => r && r.success).length;
            const totalFiles = Object.keys(audioFilePaths).length;

            if (successfulLoads === totalFiles) {
                console.log("Audio Load SUCCESS! Setting audioReady to true.");
                audioReady = true;
                
                // 1. Enable Button and Update Message
                if (toggleButton) {
                    toggleButton.disabled = false;
                    // Initial state is Day Mode, button text says 'Night' (meaning, click to go to Night)
                    toggleButton.textContent = 'Night'; 
                }
                showMessage(`All ${totalFiles} audio files loaded! Click 'Night' to switch to night mode.`);


                // 2. Initialize all 8 source nodes and connect them
                Object.keys(audioBuffers).forEach(key => {
                    const buffer = audioBuffers[key];
                    const source = audioContext.createBufferSource();
                    const gain = audioContext.createGain();

                    source.buffer = buffer;
                    source.loop = true;
                    gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime); 
                    source.connect(gain);
                    gain.connect(audioContext.destination);

                    gainMap[key] = gain; 
                    source.start(0); 
                });
                isPlaying = true;
            } else {
                showMessage(`CRITICAL ERROR: Only ${successfulLoads} of ${totalFiles} audio files loaded successfully. Check file names/format!`, true);
            }
        }
        
        // --- Day/Night Toggle Function ---
        function toggleDayNight() {
            if (!audioReady) return;
            
            initializeAudio();

            isDayMode = !isDayMode;
            
            // Update UI
            if (isDayMode) {
                // Now in Day Mode: button text says 'Night'
                toggleButton.textContent = 'Night'; 
                toggleButton.classList.remove('night-mode-active');
            } else {
                // Now in Night Mode: button text says 'Day'
                toggleButton.textContent = 'Day'; 
                toggleButton.classList.add('night-mode-active');
            }
            
            updateAudioGains({ clientX: lastMouseX, clientY: lastMouseY, forceFade: true });
        }

        // --- Audio Gain Logic ---
        
        function applyIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 0; } 
            if (p >= 1 - buffer) { return 1; }
            return (p - buffer) / (1 - 2 * buffer);
        }
        function applyOppositeIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 1; }
            if (p >= 1 - buffer) { return 0; }
            return 1 - ((p - buffer) / (1 - 2 * buffer));
        }

        function updateAudioGains(event) {
            if (!audioReady || !isPlaying || !pad) return; 

            const rect = pad.getBoundingClientRect();
            
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;
            
            let x = (event.clientX - rect.left) / rect.width;
            let y = (event.clientY - rect.top) / rect.height;
            
            const rampDuration = event.forceFade ? FADE_TIME_TOGGLE : RAMP_TIME;

            // --- Master Volume Fade-out Logic ---
            let distanceToPad = 0;
            let clampedX = x;
            let clampedY = y;
            
            if (x < 0) { clampedX = 0; distanceToPad = Math.max(distanceToPad, -x); }
            if (x > 1) { clampedX = 1; distanceToPad = Math.max(distanceToPad, x - 1); }
            if (y < 0) { clampedY = 0; distanceToPad = Math.max(distanceToPad, -y); }
            if (y > 1) { clampedY = 1; distanceToPad = Math.max(distanceToPad, y - 1); }
            
            let normalizedDistance = 0;
            if (distanceToPad > 0) {
                const pixelDistance = Math.sqrt(Math.pow(event.clientX - (rect.left + clampedX * rect.width), 2) + Math.pow(event.clientY - (rect.top + clampedY * rect.height), 2));
                normalizedDistance = Math.min(1, pixelDistance / FADE_BUFFER_DISTANCE);
            }
            const masterVolume = 1 - normalizedDistance; 
            
            x = Math.min(1, Math.max(0, x));
            y = Math.min(1, Math.max(0, y));

            // --- 1. GAIN CALCULATION ---
            const xToRight = applyIsolation(x); 
            const xToLeft = applyOppositeIsolation(x);
            const yToBottom = applyIsolation(y); 
            const yToTop = applyOppositeIsolation(y);

            const gainTL_calc = xToLeft * yToTop;       
            const gainTR_calc = xToRight * yToTop;      
            const gainBL_calc = xToLeft * yToBottom;    
            const gainBR_calc = xToRight * yToBottom;   
            
            const calculatedGains = [gainTL_calc, gainTR_calc, gainBL_calc, gainBR_calc];

            const now = audioContext.currentTime;
            
            // --- 2. DYNAMIC GAIN ASSIGNMENT (Day vs Night) ---
            const activeMode = isDayMode ? '_Day' : '_Night';
            const inactiveMode = isDayMode ? '_Night' : '_Day';

            // Gain Ramp for Active Mode (CCW Compensation)
            if (gainMap['TL' + activeMode]) gainMap['TL' + activeMode].gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainBL_calc * masterVolume), now + rampDuration); 
            if (gainMap['TR' + activeMode]) gainMap['TR' + activeMode].gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainTL_calc * masterVolume), now + rampDuration); 
            if (gainMap['BR' + activeMode]) gainMap['BR' + activeMode].gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainTR_calc * masterVolume), now + rampDuration); 
            if (gainMap['BL' + activeMode]) gainMap['BL' + activeMode].gain.exponentialRampToValueAtTime(Math.max(MINIMUM_GAIN, gainBR_calc * masterVolume), now + rampDuration); 
            
            // Gain Ramp for Inactive Mode (Silence)
            if (gainMap['TL' + inactiveMode]) gainMap['TL' + inactiveMode].gain.exponentialRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);
            if (gainMap['TR' + inactiveMode]) gainMap['TR' + inactiveMode].gain.exponentialRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);
            if (gainMap['BR' + inactiveMode]) gainMap['BR' + inactiveMode].gain.exponentialRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);
            if (gainMap['BL' + inactiveMode]) gainMap['BL' + inactiveMode].gain.exponentialRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);

            updateVisualGlow(calculatedGains, masterVolume);
        }

        // --- Visual and Init Logic ---

        function updateVisualGlow(gains, masterVolume) {
            
            // 1. Pad Border Glow (Full Pad Glow - only when near the pad)
            if (masterVolume > 0.1) {
                // Apply a glow effect to the entire pad when the mouse is near or inside.
                pad.style.boxShadow = '0 0 15px #79C2A8, 0 0 30px #79C2A8'; 
                pad.style.borderColor = '#C2E2CC';
            } else {
                // Revert to original styling when the mouse is far away.
                pad.style.boxShadow = '0 0 15px #79C2A8'; 
                pad.style.borderColor = '#79C2A8';
            }
            
            // 2. Corner Label Glow (Individual Corner Glow)
            if (!mouseInPad || !labels) { 
                labels.forEach(label => label.classList.remove('active-glow'));
                return;
            }
            const maxGain = Math.max(...gains);
            labels.forEach(label => label.classList.remove('active-glow'));
            
            if (maxGain > 0.60) { 
                const maxIndex = gains.indexOf(maxGain);
                if (labels[maxIndex]) {
                    labels[maxIndex].classList.add('active-glow');
                }
            }
        }
        
        function initializeAudio() {
            if (!audioInitiated && audioReady) {
                if (audioContext && audioContext.state === 'suspended') {
                     audioContext.resume().then(() => {
                        audioInitiated = true;
                        showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                        setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                    }).catch(e => console.error("Could not resume audio context:", e));
                } else if (audioContext && audioContext.state === 'running') {
                     audioInitiated = true;
                     showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                     setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                }
            }
        }
        
        function handleMouseEnter() { mouseInPad = true; }
        function handleMouseLeave() { 
            mouseInPad = false; 
            labels.forEach(label => label.classList.remove('active-glow')); 
            // Reset the pad glow when leaving the pad
            pad.style.boxShadow = '0 0 15px #79C2A8'; 
            pad.style.borderColor = '#79C2A8';
        }

        function handleMouseMove(event) {
            if (!indicator || !pad) return; 

            // 1. Position the Indicator
            indicator.style.left = `${event.clientX}px`;
            indicator.style.top = `${event.clientY}px`;
            
            const rect = pad.getBoundingClientRect();
            const cursorX = event.clientX;
            const cursorY = event.clientY;

            // 2. Determine visibility based on proximity to the pad
            const isOutsideX = cursorX < rect.left || cursorX > rect.right;
            const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

            if (isOutsideX || isOutsideY) {
                const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
                const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

                const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));

                let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
                opacity = Math.min(1, Math.max(0, opacity)); 

                if (opacity > 0) {
                    indicator.style.opacity = opacity.toFixed(2);
                } else {
                    indicator.style.opacity = '0'; 
                }
            } else {
                indicator.style.opacity = '0.8';
            }

            // 3. Update audio gains if ready
            if (audioReady && isPlaying) {
                 updateAudioGains(event);
            }
        }
        
        function handleTouchMove(event) {
            event.preventDefault(); 
            const touch = event.touches[0];
            const syntheticEvent = { clientX: touch.clientX, clientY: touch.clientY, forceFade: false };
            handleMouseMove(syntheticEvent); 
            initializeAudio(); 
            mouseInPad = true; 
        }

        function handleTouchEnd(event) {
            const rect = pad.getBoundingClientRect();
            // Simulate mouse far away to trigger audio fade out and glow reset
            const syntheticEvent = { clientX: rect.left - FADE_BUFFER_DISTANCE * 2, clientY: rect.top - FADE_BUFFER_DISTANCE * 2, forceFade: false };
            handleMouseMove(syntheticEvent); 
            mouseInPad = false;
            handleMouseLeave(); 
        }
        
        // --- Event Listeners and Initialization ---
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); 
                initializeAudio(); 
                toggleDayNight();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Assign DOM elements
            pad = document.getElementById('audioPad');
            indicator = document.getElementById('mouseIndicator');
            messageBox = document.getElementById('messageBox');
            toggleButton = document.getElementById('dayNightToggle');
            
            labelTL = document.getElementById('labelTL');
            labelTR = document.getElementById('labelTR');
            labelBL = document.getElementById('labelBL');
            labelBR = document.getElementById('labelBR');
            labels = [labelTL, labelTR, labelBL, labelBR]; 
            
            // Attach button click listener
            if (toggleButton) toggleButton.addEventListener('click', toggleDayNight);
            
            // Start loading
            showMessage("Loading audio files...");
            loadAllAudioFiles();
            
            // Pad-specific mouse listeners for the glow state
            if (pad) {
                pad.addEventListener('mouseenter', handleMouseEnter);
                pad.addEventListener('mouseleave', handleMouseLeave);
            }
        });
        
        // Global listener for movement (mouse and touch)
        document.addEventListener('mousemove', handleMouseMove);

        // Initial click/tap listener to unlock AudioContext
        document.addEventListener('mousedown', initializeAudio);
        document.addEventListener('touchstart', initializeAudio);
        
        // Touch-specific listeners
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd);
    </script>
    
</body>
</html>
