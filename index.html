<style>
/* --- CORE STYLES (Unchanged) --- */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    cursor: none;
    color: #C2E2CC;
}
/* --- BACKGROUND LAYERS (Unchanged) --- */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: -2;
    transition: opacity 3.0s ease-in-out !important;
}
.bg-current { opacity: 1; }
.bg-next { opacity: 0; }
/* --- TITLE STYLES (Restored) */
h1 {
    font-size: 3.0em; 
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #C2E2CC;
    text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
    margin-bottom: 5px;
}
h2 {
    font-size: 1.2em;
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #AACCB8;
    text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
    margin-top: 0;
    margin-bottom: 10px;
}
/* --- CONTENT CONTAINER (Minimal Padding) --- */
.container {
    /* ... other properties ... */
    padding: 0; /* REMOVED DARK BOX PADDING */
    background-color: transparent; /* REMOVED DARK BOX BACKGROUND */
    border-radius: 0; /* REMOVED DARK BOX BORDER-RADIUS */
    box-shadow: none; /* REMOVED DARK BOX SHADOW */
    /* ... other properties ... */
}
/* --- Audio Pad and Controls (All Margins Adjusted) --- */
#audioPad {
    /* Set to 70vh for better vertical scaling on laptops */
    width: min(70vh, 80vw);
    height: min(70vh, 80vw);

    max-width: 700px;
    max-height: 700px;

    border: 2px solid #79C2A8;
    position: relative;
    background-color: rgba(0, 0, 0, 0.3);
    /* EDIT 1: Reduced base glow for dynamic effect */
    box-shadow: 0 0 8px #79C2A8; 
    margin: 20px; /* Added 20px margin to all four sides */
    border-radius: 5px;
    transition: box-shadow 0.3s, border-color 0.3s;
}

/* --- PAD LABELS (Text) --- */
.pad-label {
    position: absolute;
    padding: 8px 12px;
    background-color: rgba(0, 0, 0, 0.8);
    border: 1px solid #79C2A8;
    font-size: 0.9em;
    border-radius: 3px;
    /* transition is kept for smooth glow update via JS style */
    transition: box-shadow 0.2s, background-color 0.2s, color 0.2s; 
    pointer-events: none;
    z-index: 1; /* Keep labels above large icons */
}
.top-left { top: 15px; left: 15px; }
.top-right { top: 15px; right: 15px; }
.bottom-left { bottom: 15px; left: 15px; }
.bottom-right { bottom: 15px; right: 15px; }
/* REMOVED: The static .active-glow class, now implemented dynamically in JS */

/* --- NEW: LARGE ADDON ICONS (SVG) --- */
.addon-icon {
    position: absolute;
    width: 200px; /* Much larger */
    height: 200px; /* Much larger */
    color: #C2E2CC;
    /* Set stroke property for the line drawing SVGs */
    stroke: currentColor;
    stroke-width: 1.5; /* Default line thickness for a finer look */
    fill: none; /* Ensure no fill, just stroke */

    opacity: 0.15; /* Much dimmer when inactive for stronger contrast */
    transition: opacity 0.5s, box-shadow 0.5s;
    pointer-events: none;
    padding: 10px;
}
/* Positioning to center them visually within their quadrants */
.top-left-icon { top: 25%; left: 25%; transform: translate(-50%, -50%); }
.top-right-icon { top: 25%; right: 25%; transform: translate(50%, -50%); }
.bottom-left-icon { bottom: 25%; left: 25%; transform: translate(-50%, 50%); }
.bottom-right-icon { bottom: 25%; right: 25%; transform: translate(50%, 50%); }

/* The new glow class for activated AddOns (Enhanced Effect) */
.icon-active-glow {
    opacity: 1.0; /* Full visibility */
    background-color: rgba(194, 232, 204, 0.05); /* Very light background/container glow */
    box-shadow: 
        0 0 10px rgba(194, 232, 204, 0.6), /* Inner glow */
        0 0 30px rgba(194, 232, 204, 0.4); /* Outer halo */
    border-radius: 10px;
}

/* --- CURSOR INDICATOR (Unchanged) --- */
#mouseIndicator {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #C2E2CC;
    box-shadow: 0 0 10px #C2E2CC;
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 1000;
}
/* Explanation Box - RESPONSIVE POSITIONING (Unchanged) */

    background-color: rgba(255, 85, 85, 0.1);
    color: white;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 5px;
    display: none;
}
</style>

// --- CORE AUDIO CONSTANTS (Unchanged) ---
const MINIMUM_GAIN = 0.0001; // Effectively silent
const MAX_ADDON_VOLUME = 0.4;
const RAMP_TIME = 0.05; // Quick ramp for continuous mixing
const FADE_TIME_TOGGLE = 2.0; // Long ramp for Day/Night toggle
const FADE_TIME_ADDON_STOP = 1.0; // Ramp down time for non-instant AddOns
const ISOLATION_BUFFER = 0.3;
const FADE_BUFFER_DISTANCE = 300; // Distance in pixels outside the pad to fade out the indicator
// NEW CONSTANT FOR GLOW
const RGB_GLOW_COLOR = '194, 232, 204'; // RGB for #C2E2CC

// NEW: Function to implement a steeper, later-starting glow fade for labels
const getLabelGlowIntensity = (gain) => {
    // Full glow only reached when very close (gain is 1.0).
    // Starts fading in at 0.7, maxes out at 1.0.
    const rampStart = 0.70;
    const rampDuration = 1.0 - rampStart; // 0.3
    
    // Clamps and normalizes the gain value
    const intensity = Math.min(1.0, Math.max(0.0, (gain - rampStart) / rampDuration));
    return intensity;
}

// --- CORE UTILITY FUNCTIONS (Unchanged) ---
function applyIsolation(p) {
    const buffer = ISOLATION_BUFFER;
    if (p < buffer) return 0.0;
    if (p > 1.0 - buffer) return 1.0;
    return (p - buffer) / (1 - 2 * buffer);
}
function applyOppositeIsolation(p) {
    const buffer = ISOLATION_BUFFER;
    if (p > 1.0 - buffer) return 0.0;
    if (p < buffer) return 1.0;
    return (1 - p - buffer) / (1 - 2 * buffer);
}

function equalPowerGain(p, inverse = false) {
    if (inverse) {
        // Night/Inverse track: 1.0 when crossfadePosition (p) is 1.0, 0.0 when p is 0.0
        p = 1.0 - p;
    }
    // Equal power law: gain = cos(p * 0.5 * PI)
    const angle = p * 0.5 * Math.PI;
    return Math.cos(angle);
}

function getCurrentCorner(x, y) {
    const isTop = y < 0.5;
    const isLeft = x < 0.5;
    if (isTop && isLeft) return 'TL';
    if (isTop && !isLeft) return 'TR';
    if (!isTop && isLeft) return 'BL';
    if (!isTop && !isLeft) return 'BR';
    return null;
}

function updateAudioGains(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect(); 

    // Only update lastMouseX/Y if a mousemove event is actually passed
    if (event && event.clientX && !event.forceFade) {
        lastMouseX = event.clientX;
        lastMouseY = event.clientY;
    }

    // These spatial coordinates are calculated based on the last known mouse position
    let x = (lastMouseX - rect.left) / rect.width;
    let y = (lastMouseY - rect.top) / rect.height;

    // Clamp x and y to the [0, 1] range in case the event is a forced update from outside
    x = Math.max(0, Math.min(1, x));
    y = Math.max(0, Math.min(1, y));


    // Use a long ramp (2.0s) if forceFade is true (used by toggleAddOn),
    // otherwise use the short ramp (0.05s) for continuous mouse mixing.
    const rampDuration = (event && event.forceFade) ? FADE_TIME_TOGGLE : RAMP_TIME;
    const now = audioContext.currentTime;

    // --- 1. SPATIAL GAIN CALCULATION ---
    const xToRight = applyIsolation(x);
    const xToLeft = applyOppositeIsolation(x);
    const yToBottom = applyIsolation(y);
    const yToTop = applyOppositeIsolation(y);

    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };

    // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION ---
    const dayMix = equalPowerGain(crossfadePosition, false);
    const nightMix = equalPowerGain(crossfadePosition, true);
    const ambienceMixes = { Day: dayMix, Night: nightMix };

    ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
        const dayKey = `${cornerKey}_Day`;
        const nightKey = `${cornerKey}_Night`;
        
        // Final target gain for each Day and Night track
        const dayTargetGain = baseGains[cornerKey] * ambienceMixes.Day;
        const nightTargetGain = baseGains[cornerKey] * ambienceMixes.Night;

        if (gainMap[dayKey]) {
            gainMap[dayKey].gain.linearRampToValueAtTime(dayTargetGain, now + rampDuration);
        }
        if (gainMap[nightKey]) {
            gainMap[nightKey].gain.linearRampToValueAtTime(nightTargetGain, now + rampDuration);
        }
    });

    // --- 3. ADD-ON AUDIO GAIN CALCULATION ---
    // Update gain for all 8 Add-Ons based on their active state and current mix
    allAddOnKeys.forEach(key => {
        const state = addOnStateMap[key];
        let target = MINIMUM_GAIN;

        if (state && state.active) {
            // e.g., key is 'TL_Day_AddOn' -> cornerKey='TL', mode='Day'
            const parts = key.split('_');
            const cornerKey = parts[0];
            const mode = parts[1]; // 'Day' or 'Night'

            const modeMix = ambienceMixes[mode];
            const modeBase = baseGains[cornerKey];

            // Modulated by mouse position (modeBase) and Day/Night mix (modeMix)
            if (modeMix > MINIMUM_GAIN) {
                target = modeBase * modeMix * MAX_ADDON_VOLUME;
            }
        }
        // The gain is updated spatially on every updateAudioGains call.
        if(state && state.gain) {
             state.gain.gain.linearRampToValueAtTime(target, now + rampDuration);
        }
    });

    // --- 4. VISUALS (Labels - Dynamic Glow) ---
    const calculatedGains = [
        baseGains.TL * dayMix + baseGains.TL * nightMix,
        baseGains.TR * dayMix + baseGains.TR * nightMix,
        baseGains.BL * dayMix + baseGains.BL * nightMix,
        baseGains.BR * dayMix + baseGains.BR * nightMix
    ];

    labels.forEach((label, index) => {
        const combinedGain = calculatedGains[index];
        const intensity = getLabelGlowIntensity(combinedGain);
        
        if (intensity > MINIMUM_GAIN) {
            // Max shadow opacity is ~0.6 from original .active-glow
            const shadowOpacity = 0.6 * intensity; 
            // Max background opacity is 0.2 from original .active-glow
            const bgOpacity = 0.2 * intensity; 

            // Dynamic glow: box-shadow, background-color, and color transition
            label.style.boxShadow = `0 0 ${8 * intensity}px rgba(${RGB_GLOW_COLOR}, ${shadowOpacity.toFixed(2)})`;
            label.style.backgroundColor = `rgba(${RGB_GLOW_COLOR}, ${bgOpacity.toFixed(2)})`;
            label.style.color = intensity > 0.7 ? 'white' : '#C2E2CC'; // Transition text color near full intensity
        } else {
            // Reset to base styles (defined in CSS for .pad-label)
            label.style.boxShadow = '';
            label.style.backgroundColor = '';
            label.style.color = '';
        }
    });
}

function startCrossfade(targetIsNight) {
    if (isCrossfading) return;
    isCrossfading = true;

    const duration = FADE_TIME_TOGGLE;
    const startTime = audioContext.currentTime;
    const startPosition = crossfadePosition;
    const endPosition = targetIsNight ? 1.0 : 0.0;
    const distance = endPosition - startPosition;

    const animate = () => {
        const now = audioContext.currentTime;
        const elapsed = now - startTime;

        if (elapsed >= duration) {
            crossfadePosition = endPosition;
            isCrossfading = false;
            updateAudioGains({ forceFade: true });
            return;
        }

        let t = elapsed / duration;
        crossfadePosition = startPosition + distance * t;
        updateAudioGains({ forceFade: true });

        requestAnimationFrame(animate);
    };

    requestAnimationFrame(animate);
}

// --- Day/Night Toggle Function (Spacebar - showMessage call updated) ---
async function toggleDayNight() {
    if (!audioReady || isCrossfading) return;
    initializeAudio();

    const isCurrentlyDay = (crossfadePosition < 0.5);
    const targetIsNight = isCurrentlyDay;

    if (targetIsNight && !nightAudioLoaded) {
        showMessage("Night audio is still loading. Please wait a moment.", false);
        return;
    }
    
    // Force a visual update *before* the fade...
    updateBackground(targetIsNight ? 'Night' : 'Day');
    
    // Announce the change
    showMessage(`Transitioning to ${targetIsNight ? 'Night' : 'Day'}...`, false);

    startCrossfade(targetIsNight);
}

// --- AddOn Toggle Function (Enter Key) ---
function toggleAddOn() {
    if (!audioReady || isCrossfading || !audioInitiated) return;
    if (!addOnAudioLoaded) {
        showMessage("Add-On audio is still loading. Please wait a moment.", false);
        return;
    }

    // Determine the current corner based on the last known mouse position
    const rect = pad.getBoundingClientRect(); 
    let x = (lastMouseX - rect.left) / rect.width;
    let y = (lastMouseY - rect.top) / rect.height;
    
    // If cursor is too far outside, ignore the key press
    if (x < 0 || x > 1 || y < 0 || y > 1) {
        showMessage("Please move the cursor inside the mix pad to activate an add-on.", false);
        return;
    }
    
    const currentCornerKey = getCurrentCorner(x, y);
    const isCurrentlyDay = (crossfadePosition < 0.5);
    const currentMode = isCurrentlyDay ? 'Day' : 'Night';
    const addOnKey = `${currentCornerKey}_${currentMode}_AddOn`;
    const state = addOnStateMap[addOnKey];
    const iconElement = addOnIcons[currentCornerKey];
    const currentAddOnName = cornerNames[currentCornerKey];

    if (!state || !iconElement) {
        // This should not happen if all AddOn files loaded correctly
        console.error("Add-On state or icon not found for key:", addOnKey);
        return;
    }

    // Check if it's one of the two SFX AddOns (Cabin/TL or Ranger Station/BR)
    const isCabinAddOn = (currentCornerKey === 'TL');
    const isRangerAddOn = (currentCornerKey === 'BR');
    const isSFXAddOn = isCabinAddOn || isRangerAddOn;

    // Calculate spatial gains and mode mix for manual ramp-up later
    const xToRight = applyIsolation(x);
    const xToLeft = applyOppositeIsolation(x);
    const yToBottom = applyIsolation(y);
    const yToTop = applyOppositeIsolation(y);
    const modeMix = equalPowerGain(crossfadePosition, isCurrentlyDay);
    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };
    const currentBaseGain = baseGains[currentCornerKey];

    // --- TOGGLE LOGIC ---

    // Scenario 1: Add-on is ALREADY active. TURN OFF.
    if (state.active) {
        state.active = false; // Mark state as OFF

        // 1. Play OFF SFX if Cabin or Ranger Station Add-On
        if (isSFXAddOn && sfxLoaded) {
            let offKeys;
            if (isCabinAddOn) {
                offKeys = currentMode === 'Day' ? buttonCabinDayOffKeys : buttonCabinNightOffKeys;
            } else if (isRangerAddOn) {
                offKeys = currentMode === 'Day' ? buttonRangerDayOffKeys : buttonRangerNightOffKeys;
            }
            if (offKeys) {
                const randomKey = offKeys[Math.floor(Math.random() * offKeys.length)];
                playSfx(randomKey);
            }
        }

        // 2. Explicitly ramp the gain down (no delay)
        if (state.gain) {
            if (isRangerAddOn) { 
                // *** Instant cut for Ranger Station (BR) ***
                state.gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
            } else {
                // Standard 1.0s fade for Cabin (TL) and others
                state.gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
            }
        }
        // NEW: Remove the glowing class
        iconElement.classList.remove('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned OFF.`, false);

    } 
    // Scenario 2: Add-on is currently inactive. TURN ON.
    else {
        state.active = true; // Mark state as ON

        // 1. Play ON SFX if Cabin or Ranger Station Add-On
        if (isSFXAddOn && sfxLoaded) {
            let onKeys;
            if (isCabinAddOn) {
                onKeys = currentMode === 'Day' ? buttonCabinDayOnKeys : buttonCabinNightOnKeys;
            } else if (isRangerAddOn) {
                onKeys = currentMode === 'Day' ? buttonRangerDayOnKeys : buttonRangerNightOnKeys;
            }
            if (onKeys) {
                const randomKey = onKeys[Math.floor(Math.random() * onKeys.length)];
                playSfx(randomKey);
            }
        }

        // 2. Explicitly ramp the gain up (with a delay for SFX tracks)
        const gain = state.gain.gain;
        const targetGain = currentBaseGain * modeMix * MAX_ADDON_VOLUME;

        if (!isSFXAddOn) {
            // Non-SFX AddOns (TR, BL) fade in immediately via updateAudioGains. No action needed here.
            // (updateAudioGains is called below)
        } else if (isRangerAddOn) {
            // Ranger Station (BR) has no SFX and is instant.
            gain.setValueAtTime(targetGain, audioContext.currentTime);

        } else if (isCabinAddOn) {
            // Cabin (TL) AddOn has an SFX that plays first. Delay the ramp up.
            const sfxDuration = 0.5; // Arbitrary short delay to let SFX play
            const rampStart = audioContext.currentTime + sfxDuration;

            // Step A: Hold the current silent level (MINIMUM_GAIN) until the end of the delay period (rampStart).
            gain.setValueAtTime(MINIMUM_GAIN, rampStart);
            // Step B: Start ramping from rampStart to targetGain, finishing RAMP_TIME later.
            gain.linearRampToValueAtTime(targetGain, rampStart + RAMP_TIME);
        }

        // Force audio update for all Add-Ons. 
        // This ensures non-SFX Add-Ons (TR, BL) ramp up instantly via the regular updateAudioGains logic.
        updateAudioGains({ forceFade: true }); 
        // NEW: Add the glowing class
        iconElement.classList.add('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned ON.`, false);
    }
}

function handleMouseMove(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();
    const cursorX = event.clientX;
    const cursorY = event.clientY;
    // NOTE: lastMouseX and lastMouseY are set here, even if outside the pad,
    // which is necessary for the instant toggle logic in toggleAddOn.
    lastMouseX = event.clientX;
    lastMouseY = event.clientY;

    const isOutsideX = cursorX < rect.left || cursorX > rect.right;
    const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

    if (isOutsideX || isOutsideY) {
        // Mouse is outside the pad, handle visual fade
        const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
        const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

        const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));
        let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
        opacity = Math.min(1, Math.max(0, opacity));

        if (opacity > 0) {
            indicator.style.left = `${cursorX}px`;
            indicator.style.top = `${cursorY}px`;
            indicator.style.opacity = opacity.toFixed(2);
        } else {
            indicator.style.opacity = '0';
        }
        // When mouse is outside, call updateAudioGains to fade ambiance out
        updateAudioGains();
    } else {
        // Mouse is inside the pad, update audio gains
        indicator.style.left = `${cursorX}px`;
        indicator.style.top = `${cursorY}px`;
        indicator.style.opacity = '1';
        updateAudioGains(event);
    }
}

// --- NEW/MODIFIED FUNCTIONS FOR DYNAMIC MIXPAD GLOW ---
function handleMouseEnter() {
    if (!pad) return;
    mouseInPad = true;
    
    // EDIT 2a: Dynamic Mixpad Glow - Increase glow and change color on enter
    pad.style.boxShadow = '0 0 25px #C2E2CC'; // Stronger, brighter glow
    pad.style.borderColor = '#C2E2CC';
    
    // Show cursor indicator
    indicator.style.opacity = '1';
}

function handleMouseLeave() {
    mouseInPad = false;
    // EDIT 2b: Dynamic Mixpad Glow - Reduce glow to the new base (8px teal)
    pad.style.boxShadow = '0 0 8px #79C2A8'; 
    pad.style.borderColor = '#79C2A8'; 
    indicator.style.opacity = '0'; // Hide cursor indicator immediately on leaving the pad area
}

function initializeAudio() {
    if (!audioInitiated && audioReady) {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume().then(() => {
                audioInitiated = true;
                showMessage("Audio engaged! Start mixing by moving your cursor.", false);
            });
        } else if (audioContext && audioContext.state === 'running') {
            audioInitiated = true;
        }
    }
}

// --- AUDIO LOADING FUNCTIONS (Unchanged) ---
async function loadAudioFile(url, key) {
    if (!audioContext) return null;
    try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[key] = audioBuffer;
        return { key, success: true };
    } catch (e) {
        console.error(`Error loading audio file ${url}:`, e);
        return null;
    }
}
function playSfx(key) {
    const buffer = audioBuffers[key];
    if (!buffer) return;

    const source = audioContext.createBufferSource();
    source.buffer = buffer;

    // Use a small fixed gain for SFX
    const gain = audioContext.createGain();
    gain.gain.setValueAtTime(0.5, audioContext.currentTime);
    
    source.connect(gain);
    gain.connect(audioContext.destination);
    source.start(0);
}
// --- Core Ambience Start Function (Unchanged) --
function connectAndStartAmbienceSource(key, initialGain = 1.0) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    gainMap[key] = gain;
    source.start(0);
}
// --- AddOn Audio Start Function (Starts running silently - Unchanged) ---
function connectAndStartAddOnSource(key) {
    const buffer = audioBuffers[key];
    if (!buffer) return;
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    // Start silent (volume controlled by the spatial mix)
    gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    // Update the state map for this specific AddOn
    addOnStateMap[key].source = source;
    addOnStateMap[key].gain = gain;
    // Start the source immediately and let it run forever
    source.start(0);
}
// --- On-Demand Loading Functions (showMessage calls updated) ---
async function loadInitialAudio() {
    if (audioReady) return;
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    currentBgLayer.style.backgroundImage = getRandomBackground('Day');
    showMessage("Loading Day ambiance audio files (4/8 Ambience)...");

    const loadPromises = initialAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key) );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    const totalFiles = initialAudioKeys.length;

    if (successfulLoads === totalFiles) {
        initialAudioKeys.forEach(key => connectAndStartAmbienceSource(key, 1.0));
        audioReady = true;
        isPlaying = true;
        showMessage('Day ambiance audio ready! You can now mix. ');
        return true;
    } else {
        showMessage('CRITICAL ERROR: Failed to load Day ambiance audio files. Site non-functional. ', true);
        return false;
    }
}
async function loadNightAudio() {
    if (nightAudioLoaded) return true;
    showMessage("Loading Night ambiance audio files (4/8 Ambience)... Please wait.", false);
    const loadPromises = nightAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key));
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    
    if (successfulLoads === nightAudioKeys.length) {
        nightAudioLoaded = true;
        nightAudioKeys.forEach(key => connectAndStartAmbienceSource(key, MINIMUM_GAIN)); // Start silent
        showMessage("Night ambiance audio loaded.", false);
        return true;
    } else {
        showMessage('ERROR: Failed to load Night ambiance audio files. Day/Night toggle will be disabled. ', true);
        return false;
    }
}
async function loadSfxAudio() {
    if (sfxLoaded) return true;
    // showMessage("Loading SFX audio files (40 files)... Please wait.", false);
    const loadPromises = allSfxKeys.map(key => loadAudioFile(sfxFilePaths[key], key));
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === allSfxKeys.length) {
        sfxLoaded = true;
        // showMessage("SFX loaded.", false);
        return true;
    } else {
        // showMessage(`ERROR: Failed to load SFX audio files.`, true);
        return false;
    }
}
async function loadAddOnAudio() {
    if (addOnAudioLoaded) return true;
    // Updated count in message: 8 Add-Ons
    showMessage("Loading Add-On audio files (8 Add-Ons)... Please wait.", false);
    // Only map the addOnAudioKeys
    const loadPromises = addOnAudioKeys.map(key => {
        const url = addOnFilePaths[key];
        return loadAudioFile(url, key);
    });
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === addOnAudioKeys.length) {
        addOnAudioLoaded = true;
        // Initialize the persistent state map for all 8 AddOns
        addOnAudioKeys.forEach(key => {
            addOnStateMap[key] = { source: null, gain: null, active: false };
            // START ALL ADD-ONS IMMEDIATELY
            connectAndStartAddOnSource(key);
        });
        // Updated count in message: 8 Ambience + 8 Add-Ons = 16
        showMessage("All 16 ambiance/addon audio files loaded. System ready!", false);
        return true;
    } else {
        showMessage(`ERROR: Failed to load Add-On audio files.`, true);
        return false;
    }
}
// --- Image Background Functions (Unchanged) ---
function getRandomBackground(mode) {
    const allImages = mode === 'Day' ? dayBackgrounds : nightBackgrounds;
    const lastImages = mode === 'Day' ? lastDayImages : lastNightImages;
    // Logic for selecting a new random image...
    const newImage = allImages.filter(img => !lastImages.includes(img))[0] || allImages[0];
    if (mode === 'Day') {
        lastDayImages.push(newImage);
        if (lastDayImages.length > 3) lastDayImages.shift();
    } else {
        lastNightImages.push(newImage);
        if (lastNightImages.length > 3) lastNightImages.shift();
    }
    return `url('${newImage}')`;
}
function updateBackground(mode) {
    const newBackgroundURL = getRandomBackground(mode);
    let targetLayer = mode === 'Day' ? bgLayer1 : bgLayer2;
    let otherLayer = mode === 'Day' ? bgLayer2 : bgLayer1;

    // Set the new background image on the 'next' layer
    targetLayer.style.backgroundImage = newBackgroundURL;

    // Crossfade the layers
    targetLayer.classList.remove('bg-next');
    targetLayer.classList.add('bg-current');
    otherLayer.classList.remove('bg-current');
    otherLayer.classList.add('bg-next');

    // Swap references
    currentBgLayer = targetLayer;
    nextBgLayer = otherLayer;
}
// --- Message Box Functions (Unchanged) ---
function showMessage(message, isError = false) {
    if (messageBox) {
        messageBox.innerText = message;
        if (isError) {
            messageBox.style.display = 'block';
            messageBox.style.borderColor = '#FF5555';
            messageBox.style.backgroundColor = 'rgba(255, 85, 85, 0.1)';
        } else {
            // Only show ambient messages briefly
            messageBox.style.display = 'block';
            messageBox.style.borderColor = '#79C2A8';
            messageBox.style.backgroundColor = 'rgba(121, 194, 168, 0.1)';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 3000);
        }
    }
}


// --- Keyboard Event Listener (Unchanged) ---
document.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
        event.preventDefault();
        initializeAudio();
        toggleDayNight();
    } else if (event.code === 'Enter' || event.code === 'NumpadEnter') {
        event.preventDefault();
        toggleAddOn();
    }
});

// --- INITIALIZATION SEQUENCE ---
document.addEventListener('DOMContentLoaded', async () => {
    // 1. Element lookups
    pad = document.getElementById('audioPad');
    indicator = document.getElementById('mouseIndicator');
    messageBox = document.getElementById('messageBox');
    bgLayer1 = document.getElementById('bgLayer1');
    bgLayer2 = document.getElementById('bgLayer2');
    currentBgLayer = bgLayer1;
    nextBgLayer = bgLayer2;

    // Label Element Lookups
    labelTL = document.getElementById('labelTL');
    labelTR = document.getElementById('labelTR');
    labelBL = document.getElementById('labelBL');
    labelBR = document.getElementById('labelBR');
    labels = [labelTL, labelTR, labelBL, labelBR];
    
    // NEW: Icon Element Lookups
    iconTL = document.getElementById('iconTL');
    iconTR = document.getElementById('iconTR');
    iconBL = document.getElementById('iconBL');
    iconBR = document.getElementById('iconBR');
    
    // NEW: Populate the icon map
    addOnIcons = {
        'TL': iconTL,
        'TR': iconTR,
        'BL': iconBL,
        'BR': iconBR
    };

    if (pad) {
        pad.addEventListener('mouseenter', handleMouseEnter);
        pad.addEventListener('mouseleave', handleMouseLeave);
    }

    // 2. Load all audio files asynchronously
    const daySuccess = await loadInitialAudio();
    if (!daySuccess) return; 

    const nightSuccess = await loadNightAudio();
    if (!nightSuccess) return; 
    
    const addOnSuccess = await loadAddOnAudio(); 
    if (!addOnSuccess) return;

    // Load the specific SFX files (now 40 total)
    const sfxSuccess = await loadSfxAudio();
    if (!sfxSuccess) showMessage("SFX failed to load, button features for Cabin and Ranger Station will be disabled.", true);
});

// Global listener for movement (mouse and touch)
document.addEventListener('mousemove', handleMouseMove);

// Initial click/tap listener to unlock AudioContext
document.addEventListener('mousedown', initializeAudio);
document.addEventListener('touchstart', initializeAudio);

// Touch-specific listeners
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);
</script>
