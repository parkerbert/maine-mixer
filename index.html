<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allagash Ambience</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* --- CORE STYLES (Unchanged) --- */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    cursor: none;
    color: #C2E2CC;
}
/* --- BACKGROUND LAYERS (Unchanged) --- */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: -2;
    transition: opacity 3.0s ease-in-out !important;
}
.bg-current { opacity: 1; }
.bg-next { opacity: 0; }
/* --- TITLE STYLES (Unchanged) */
h1 {
    font-size: 3.5em;
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #C2E2CC;
    text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
    margin-bottom: 5px;
}
h2 {
    font-size: 1.5em;
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #AACCB8;
    text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
    margin-top: 0;
    margin-bottom: 50px;
}
/* --- CONTENT CONTAINER (Unchanged) --- */
.container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px;
    background-color: rgba(30, 45, 60, 0.85);
    border-radius: 15px;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    z-index: -1;
}
/* --- Audio Pad and Controls (Unchanged) --- */
#audioPad {
    width: 700px;
    height: 700px;
    border: 2px solid #79C2A8;
    position: relative;
    background-color: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 15px #79C2A8;
    margin: 0;
    border-radius: 5px;
    transition: box-shadow 0.3s, border-color 0.3s;
}
.pad-label {
    position: absolute;
    padding: 8px 12px;
    background-color: rgba(0, 0, 0, 0.8);
    border: 1px solid #79C2A8;
    font-size: 0.9em;
    border-radius: 3px;
    transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
    pointer-events: none;
}
.top-left { top: 15px; left: 15px; }
.top-right { top: 15px; right: 15px; }
.bottom-left { bottom: 15px; left: 15px; }
.bottom-right { bottom: 15px; right: 15px; }
.active-glow {
    box-shadow: 0 0 10px #C2E2CC;
    background-color: rgba(194, 232, 204, 0.2);
    color: white;
}
#mouseIndicator {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #C2E2CC;
    box-shadow: 0 0 10px #C2E2CC;
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 1000;
}
/* Explanation Box - FIXED TO AUTOFIT CONTENT */
#explanationBox {
    position: fixed;
    top: 250px;
    left: 250px;
    padding: 15px;
    background-color: rgba(30, 45, 60, 0.85);
    border: 2px solid #79C2A8;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    font-family: 'Arial', sans-serif;
    font-size: 0.9em;
    color: #C2E2CC;
    text-align: left;
    line-height: 1.4;
    z-index: 5;
}
#explanationBox p {
    /* Now the <p> element controls the non-wrapping */
    white-space: nowrap;
    margin: 0; /* Remove default margin for tighter fit */
}
.message-box {
    border: 1px solid #FF5555;
    background-color: rgba(255, 85, 85, 0.1);
    color: white;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 5px;
    display: none;
}
</style>
</head>
<body>
<div id="bgLayer1" class="bg-layer bg-current"></div>
<div id="bgLayer2" class="bg-layer bg-next"></div>
<div id="mouseIndicator"></div>
<div id="explanationBox">
<p>
SPACEBAR&nbsp;-&nbsp; Toggle between day&nbsp; and&nbsp;night<br>
ENTER&nbsp;-&nbsp; Toggle character&nbsp;interaction
</p>
</div>
<div class="container">
<h1>Allagash Ambience</h1>
<h2>An Audio Journey</h2>
<div id="messageBox" class="message-box"></div>
<div class="controls-and-pad">
<div id="audioPad">
<div id="labelTL" class="pad-label top-left">The Cabin</div>
<div id="labelTR" class="pad-label top-right">The Forest</div>
<div id="labelBL" class="pad-label bottom-left">The Lake</div>
<div id="labelBR" class="pad-label bottom-right">The Ranger Station</div>
</div>
</div>
</div>
<script>
// Set up references to DOM elements
let pad = null;
let indicator = null;
let messageBox = null;
// Background Layer References
let bgLayer1 = null;
let bgLayer2 = null;
let currentBgLayer = null;
let nextBgLayer = null;
let labelTL = null;
let labelTR = null;
let labelBL = null;
let labelBR = null;
let labels = [];
// State variables
let lastDayImages = [];
let lastNightImages = [];
// Equal Power Crossfade State
let crossfadePosition = 0.0;
let isCrossfading = false;
// Web Audio API and State variables
let audioContext = null;
let gainMap = {}; // Tracks GAIN NODES for ambience tracks
let sourceMap = {}; // NEW: Tracks the ACTIVE SOURCE NODE for the add-ons
let audioBuffers = {};
let isPlaying = false;
let audioReady = false;
let nightAudioLoaded = false;
let addOnAudioLoaded = false;
let audioInitiated = false;
let mouseInPad = false; // **Still declared, but logic is now in toggleAddOn**
let lastMouseX = 0;
let lastMouseY = 0;
let activeAddOnName = null; // Tracks the name of the currently active add-on (e.g., 'Cabin')
// Mapping of corner keys to human-readable names
const cornerNames = {
    'TL': 'Cabin',
    'TR': 'Forest',
    'BL': 'Lake',
    'BR': 'RangerStation'
};
// Mapped Add-On files (8 total, 4 Day + 4 Night)
const addOnFilePaths = {
    TL_Day_AddOn: 'audio/Cabin_Day_AddOn.ogg',
    TL_Night_AddOn: 'audio/Cabin_Night_AddOn.ogg',
    TR_Day_AddOn: 'audio/Forest_Day_AddOn.ogg',
    TR_Night_AddOn: 'audio/Forest_Night_AddOn.ogg',
    BL_Day_AddOn: 'audio/Lake_Day_AddOn.ogg',
    BL_Night_AddOn: 'audio/Lake_Night_AddOn.ogg',
    BR_Day_AddOn: 'audio/RangerStation_Day_AddOn.ogg',
    BR_Night_AddOn: 'audio/RangerStation_Night_AddOn.ogg'
};
// FILE PATHS: Mapped to all 8 core audio files
const audioFilePaths = {
    TL_Day: 'audio/Cabin_Day.ogg',
    TR_Day: 'audio/Forest_Day.ogg',
    BL_Day: 'audio/Lake_Day.ogg',
    BR_Day: 'audio/RangerStation_Day.ogg',
    TL_Night: 'audio/Cabin_Night.ogg',
    TR_Night: 'audio/Forest_Night.ogg',
    BL_Night: 'audio/Lake_Night.ogg',
    BR_Night: 'audio/RangerStation_Night.ogg'
};
// Split keys for on-demand loading
const initialAudioKeys = ['TL_Day', 'TR_Day', 'BL_Day', 'BR_Day'];
const nightAudioKeys = ['TL_Night', 'TR_Night', 'BL_Night', 'BR_Night'];
const addOnAudioKeys = Object.keys(addOnFilePaths); // 8 keys
// Background Image Arrays (Unchanged)
const dayBackgrounds = [
    'images/Woods_Day_1.jpg',
    'images/Woods_Day_2.jpg',
    'images/Woods_Day_3.jpg',
    'images/Woods_Day_4.jpg',
    'images/Woods_Day_5.jpg'
];
const nightBackgrounds = [
    'images/Woods_Night_1.jpg',
    'images/Woods_Night_2.jpg',
    'images/Woods_Night_3.jpg',
    'images/Woods_Night_4.jpg',
    'images/Woods_Night_5.jpg'
];
// Core constants
const FADE_BUFFER_DISTANCE = 150
const ISOLATION_BUFFER_SIZE = 0.333;
const MINIMUM_GAIN = 0.0001;
const RAMP_TIME = 0.05;
const FADE_TIME_TOGGLE = 2.0
const FADE_TIME_ADDON_START = 1.0; // Slower fade-in on start
const FADE_TIME_ADDON_STOP = 0.5; // Quick fade-out on stop
const BACKGROUND_FADE_DELAY = 3000;
// --- Helper Functions ---
function showMessage(text, isError = false) {
    if (!messageBox) return;
    messageBox.textContent = text;
    messageBox.style.display = 'block';
    messageBox.style.backgroundColor = isError ? 'rgba(255, 0, 0, 0.1)' : 'rgba(121, 194, 168, 0.1)';
    messageBox.style.borderColor = isError ? '#FF5555' : '#79C2A8';
    console.log(`[Status] ${text}`);
}

async function loadAudioFile(url, key) {
    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`HTTP error ${response.status}`);
        }
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[key] = audioBuffer;
    } catch (error) {
        console.error(`ERROR loading audio file ${url}: `, error);
        showMessage(`Failed to load audio file: ${url}. Check console for details.`, true);
        return { key, success: false, error: error.message };
    }
    return { key, success: true };
}
// --- Core Audio Start Function (ONLY for Ambience) --
function connectAndStartAmbienceSource(key, initialGain = 1.0) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    gainMap[key] = gain;
    source.start(0);
}
// --- Core Audio Start Function (FOR ADD-ONS - runs in Toggle function)
function createAndStartAddOnSource(key) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    // Start silent and fade in
    gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    sourceMap.currentKey = key; // Track which add-on is playing
    sourceMap.source = source;
    sourceMap.gain = gain;
    source.start(0);
}
// --- On-Demand Loading Functions
async function loadInitialAudio() {
    if (audioReady) return;
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    currentBgLayer.style.backgroundImage = getRandomBackground('Day');
    showMessage("Loading Day ambiance audio files (4/8 Ambience)...");
    const loadPromises = initialAudioKeys.map(key =>
        loadAudioFile(audioFilePaths[key], key)
    );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    const totalFiles = initialAudioKeys.length;
    if (successfulLoads === totalFiles) {
        // START AMBIENCE TRACKS
        initialAudioKeys.forEach(key => connectAndStartAmbienceSource(key, 1.0));
        audioReady = true;
        isPlaying = true;
        showMessage('Day ambiance audio ready! You can now mix. ');
        return true;
    } else {
        showMessage('CRITICAL ERROR: Failed to load Day ambiance audio files. Site non-functional. ', true);
        return false;
    }
}
async function loadNightAudio() {
    if (nightAudioLoaded) return true;
    showMessage("Loading Night ambiance audio files (4/8 Ambience)... Please wait.", false);
    const loadPromises = nightAudioKeys.map(key =>
        loadAudioFile(audioFilePaths[key], key)
    );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    if (successfulLoads === nightAudioKeys.length) {
        // START AMBIENCE TRACKS
        nightAudioKeys.forEach(key => connectAndStartAmbienceSource(key, MINIMUM_GAIN));
        nightAudioLoaded = true;
        showMessage("Night ambiance loaded!", false);
        return true;
    } else {
        showMessage('ERROR: Failed to load Night ambiance files. Cannot switch mode.', true);
        return false;
    }
}
async function loadAddOnAudio() {
    if (addOnAudioLoaded) return true;
    showMessage("Loading Add-On audio files (8/8 Add-Ons)... Please wait.", false);
    const loadPromises = addOnAudioKeys.map(key =>
        loadAudioFile(addOnFilePaths[key], key)
    );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    if (successfulLoads === addOnAudioKeys.length) {
        addOnAudioLoaded = true;
        // DO NOT START ADD-ONS HERE. They will start when toggled.
        showMessage("All 16 audio files loaded. System ready!", false);
        return true;
    } else {
        showMessage(`ERROR: Failed to load Add-On audio files.`, true);
        return false;
    }
}
// --- Image Background Functions (Unchanged) ---
function getRandomBackground(mode) {
    const allImages = mode === 'Day' ? dayBackgrounds : nightBackgrounds;
    const lastImages = mode === 'Day' ? lastDayImages : lastNightImages;
    
    // Logic for selecting a new random image... (omitted for brevity, but assumed correct)
    
    // Return a URL string for the background image
    const newImage = allImages.filter(img => !lastImages.includes(img))[0] || allImages[0];
    
    if (mode === 'Day') {
        lastDayImages.push(newImage);
        if (lastDayImages.length > 3) lastDayImages.shift();
    } else {
        lastNightImages.push(newImage);
        if (lastNightImages.length > 3) lastNightImages.shift();
    }
    
    return `url('${newImage}')`;
}

function updateBackground(mode) {
    const newBackgroundURL = getRandomBackground(mode);
    nextBgLayer.style.backgroundImage = newBackgroundURL;

    currentBgLayer.classList.remove('bg-current');
    currentBgLayer.classList.add('bg-next');

    nextBgLayer.classList.remove('bg-next');
    nextBgLayer.classList.add('bg-current');

    setTimeout(() => {
        const temp = currentBgLayer;
        currentBgLayer = nextBgLayer;
        nextBgLayer = temp;
        nextBgLayer.style.backgroundImage = 'none';
    }, BACKGROUND_FADE_DELAY);
}

// --- Audio Gain Logic (Updated to handle new sourceMap for add-ons) ---
function equalPowerGain(position, isDay) {
    const angle = position * 0.5 * Math.PI;
    return isDay ? Math.cos(angle) : Math.sin(angle);
}
function applyIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 0; }
    if (p >= 1 - buffer) { return 1; }
    return (p - buffer) / (1 - 2 * buffer);
}
function applyOppositeIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 1; }
    if (p >= 1 - buffer) { return 0; }
    return (1 - p - buffer) / (1 - 2 * buffer);
}
function getCurrentCorner(x, y) {
    const isTop = y < 0.5;
    const isLeft = x < 0.5;

    if (isTop && isLeft) return 'TL';
    if (isTop && !isLeft) return 'TR';
    if (!isTop && isLeft) return 'BL';
    if (!isTop && !isLeft) return 'BR';
    return null;
}
function updateAudioGains(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();

    if (!event.forceFade) {
        lastMouseX = event.clientX;
        lastMouseY = event.clientY;
    }

    let x = (lastMouseX - rect.left) / rect.width;
    let y = (lastMouseY - rect.top) / rect.height;

    const rampDuration = event.forceFade ? FADE_TIME_TOGGLE : RAMP_TIME;
    const now = audioContext.currentTime;
    
    // --- 1. SPATIAL GAIN CALCULATION ---
    const xToRight = applyIsolation(x);
    const xToLeft = applyOppositeIsolation(x);
    const yToBottom = applyIsolation(y);
    const yToTop = applyOppositeIsolation(y);

    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };

    // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION ---
    const dayMix = equalPowerGain(crossfadePosition, true);
    const nightMix = equalPowerGain(crossfadePosition, false);
    
    const ambienceMixes = { Day: dayMix, Night: nightMix };

    ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
        const dayKey = `${cornerKey}_Day`;
        const nightKey = `${cornerKey}_Night`;
        
        // Final target gain for each Day and Night track
        const dayTargetGain = baseGains[cornerKey] * dayMix;
        const nightTargetGain = baseGains[cornerKey] * nightMix;
        
        if (gainMap[dayKey]) {
            gainMap[dayKey].gain.linearRampToValueAtTime(dayTargetGain, now + rampDuration);
        }
        if (gainMap[nightKey]) {
            gainMap[nightKey].gain.linearRampToValueAtTime(nightTargetGain, now + rampDuration);
        }
    });

    // --- 3. ADD-ON GAIN CALCULATION (NEW LOGIC) ---
    if (sourceMap.source && sourceMap.gain) {
        const currentAddOnKey = sourceMap.currentKey;
        const corner = currentAddOnKey.substring(0, 2);
        const mode = currentAddOnKey.includes('_Night') ? 'Night' : 'Day';
        
        const modeMix = ambienceMixes[mode];
        const modeBase = baseGains[corner];
        
        let target = MINIMUM_GAIN;
        const maxAddOnVolume = 0.5;

        // The logic is: only ramp up the AddOn if it's the correct mode AND the mouse is in its corner
        if (activeAddOnName && modeMix > MINIMUM_GAIN) {
            target = modeBase * maxAddOnVolume; // Volume based on isolation/corner mix
        }
        
        sourceMap.gain.gain.linearRampToValueAtTime(target, now + RAMP_TIME);
    }

    // --- 4. VISUALS (Labels) ---
    const calculatedGains = [
        baseGains.TL * dayMix + baseGains.TL * nightMix, 
        baseGains.TR * dayMix + baseGains.TR * nightMix, 
        baseGains.BL * dayMix + baseGains.BL * nightMix, 
        baseGains.BR * dayMix + baseGains.BR * nightMix
    ];

    const maxGain = Math.max(...calculatedGains);
    labels.forEach(label => label.classList.remove('active-glow'));

    if (maxGain > 0.60) {
        const maxIndex = calculatedGains.indexOf(maxGain);
        if (labels[maxIndex]) {
            labels[maxIndex].classList.add('active-glow');
        }
    }
}

function startCrossfade(targetIsNight) {
    if (isCrossfading) return;
    isCrossfading = true;

    const duration = FADE_TIME_TOGGLE;
    const startTime = audioContext.currentTime;
    const startPosition = crossfadePosition;
    const endPosition = targetIsNight ? 1.0 : 0.0;
    const distance = endPosition - startPosition;

    const animate = () => {
        const now = audioContext.currentTime;
        const elapsed = now - startTime;

        if (elapsed >= duration) {
            crossfadePosition = endPosition;
            isCrossfading = false;
            updateAudioGains({ forceFade: true });
            return;
        }

        let t = elapsed / duration;
        crossfadePosition = startPosition + distance * t;
        updateAudioGains({ forceFade: true });

        requestAnimationFrame(animate);
    };

    requestAnimationFrame(animate);
}

// --- Day/Night Toggle Function (Spacebar) ---
async function toggleDayNight() {
    if (!audioReady || isCrossfading) return;
    initializeAudio();

    const isCurrentlyDay = (crossfadePosition < 0.5);
    const targetIsNight = isCurrentlyDay;

    if (targetIsNight && !nightAudioLoaded) {
        showMessage("Night audio is still loading. Please wait a moment.", false);
        return;
    }

    // Force a visual update *before* the fade starts
    updateBackground(targetIsNight ? 'Night' : 'Day');
    startCrossfade(targetIsNight);
}

// --- Add-On Toggle Function (Enter/Return) ---
async function toggleAddOn() {
    initializeAudio(); 
    
    // Check 1: Audio must be ready and add-on buffers must be loaded
    if (!audioReady || !addOnAudioLoaded) {
        if (!addOnAudioLoaded) showMessage("Add-on audio files are still loading or failed to load.", true);
        return;
    }
    
    // Calculate pad boundaries on keypress
    const rect = pad.getBoundingClientRect();

    // Check 2: Determine if the mouse coordinates are actually inside the pad
    const mouseIsInside = (
        lastMouseX >= rect.left && 
        lastMouseX <= rect.right && 
        lastMouseY >= rect.top && 
        lastMouseY <= rect.bottom
    );
    
    // This coordinate check replaces the unreliable `!mouseInPad` check.
    if (!mouseIsInside) { 
        showMessage("Please move your cursor over the audio pad to select a region.", false);
        return; // Exit if mouse is not inside
    }

    const isCurrentlyDay = (crossfadePosition < 0.5);
    const currentMode = isCurrentlyDay ? 'Day' : 'Night';
    
    // Get mouse position relative to pad (0.0 to 1.0)
    let x = (lastMouseX - rect.left) / rect.width;
    let y = (lastMouseY - rect.top) / rect.height;

    const currentCornerKey = getCurrentCorner(x, y); 
    const currentAddOnName = cornerNames[currentCornerKey]; 
    const addOnKey = `${currentCornerKey}_${currentMode}_AddOn`;

    // --- TOGGLE LOGIC ---

    // Scenario 1: Add-on is ALREADY playing. STOP it.
    if (activeAddOnName === currentAddOnName) {
        // Ramp down to silence
        if (sourceMap.gain) {
            sourceMap.gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
        }
        // Disconnect and clean up after the fade
        setTimeout(() => {
            if (sourceMap.source) {
                try { sourceMap.source.stop(0); } catch (e) { console.error("Error stopping source:", e); }
            }
            sourceMap = {};
            activeAddOnName = null;
        }, FADE_TIME_ADDON_STOP * 1000); // Convert to milliseconds
        
        showMessage(`${currentAddOnName} add-on turned OFF.`, false);
    } 
    // Scenario 2: NO add-on is playing or a DIFFERENT one is playing. START the new one.
    else {
        // If a different add-on is playing, stop it first
        if (sourceMap.source) {
            try { sourceMap.source.stop(0); } catch (e) { }
            sourceMap = {};
        }

        activeAddOnName = currentAddOnName;
        // CREATE AND START NEW SOURCE (Starts silent)
        createAndStartAddOnSource(addOnKey);

        // Initial ramp up (the updateAudioGains will handle the continuous fade)
        if (sourceMap.gain) {
            // Ramp from MINIMUM_GAIN to 0.5 (max volume of add-on)
            sourceMap.gain.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + FADE_TIME_ADDON_START);
        }
        showMessage(`${currentAddOnName} add-on turned ON.`, false);
    }
}

function handleMouseMove(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();
    const cursorX = event.clientX;
    const cursorY = event.clientY;
    
    // CRITICAL: Ensure these global variables are being set here!
    lastMouseX = event.clientX;
    lastMouseY = event.clientY;

    const isOutsideX = cursorX < rect.left || cursorX > rect.right;
    const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

    if (isOutsideX || isOutsideY) {
        // Mouse is outside the pad, calculate distance for indicator fade
        const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
        const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

        const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));
        let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
        opacity = Math.min(1, Math.max(0, opacity));

        if (opacity > 0) {
            indicator.style.left = `${cursorX}px`;
            indicator.style.top = `${cursorY}px`;
            indicator.style.opacity = opacity.toFixed(2);
        } else {
            indicator.style.opacity = '0';
        }
    } else {
        // Mouse is inside the pad
        indicator.style.left = `${cursorX}px`;
        indicator.style.top = `${cursorY}px`;
        indicator.style.opacity = '1';

        // Update audio gains based on the position inside the pad
        updateAudioGains(event);
    }
}

function handleTouchMove(event) {
    event.preventDefault(); // Prevent scrolling
    const touch = event.touches[0];
    const syntheticEvent = {
        clientX: touch.clientX,
        clientY: touch.clientY,
        forceFade: false
    };
    handleMouseMove(syntheticEvent);
}

function handleTouchEnd() {
    // Optional: Stop audio or show message on touch end
    const syntheticEvent = {
        clientX: lastMouseX,
        clientY: lastMouseY,
        forceFade: false
    };
    // Ensure `handleMouseLeave` runs to clear visuals if needed
    // In a touch scenario, this might need more complex logic, but for now:
    // mouseInPad = false;
    // handleMouseLeave(); 
}

function handleMouseEnter() { 
    mouseInPad = true; // Still set, but ignored by toggleAddOn now
}
function handleMouseLeave() { 
    mouseInPad = false; 
    labels.forEach(label => label.classList.remove('active-glow')); 
    pad.style.boxShadow = '0 0 15px #79C2A8'; 
    pad.style.borderColor = '#79C2A8';
}

function initializeAudio() {
    if (!audioInitiated && audioReady) {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume().then(() => {
                audioInitiated = true;
                showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000);
            });
        } else if (audioContext && audioContext.state === 'running') {
            audioInitiated = true;
        }
    }
}

// --- Keyboard Event Listener (FIXED FOR ENTER/NUMPADENTER) ---
document.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
        event.preventDefault(); 
        initializeAudio(); 
        toggleDayNight();
    } 
    // FIX: Check for both 'Enter' (numpad) and 'NumpadEnter' (or just 'Enter' for main return key on some layouts)
    else if (event.code === 'Enter' || event.code === 'NumpadEnter') { 
        event.preventDefault(); 
        toggleAddOn();
    }
});

// --- UPDATED INITIALIZATION SEQUENCE (FIXED MOUSE LISTENERS) ---
document.addEventListener('DOMContentLoaded', async () => {
    // 1. Element lookups
    pad = document.getElementById('audioPad');
    indicator = document.getElementById('mouseIndicator');
    messageBox = document.getElementById('messageBox');
    
    bgLayer1 = document.getElementById('bgLayer1');
    bgLayer2 = document.getElementById('bgLayer2');
    currentBgLayer = bgLayer1;
    nextBgLayer = bgLayer2;
    
    labelTL = document.getElementById('labelTL');
    labelTR = document.getElementById('labelTR');
    labelBL = document.getElementById('labelBL');
    labelBR = document.getElementById('labelBR');
    labels = [labelTL, labelTR, labelBL, labelBR]; 

    // 🛑 CRITICAL FIX: ADD MOUSE LISTENERS FOR THE PAD HERE
    if (pad) {
        pad.addEventListener('mouseenter', handleMouseEnter);
        pad.addEventListener('mouseleave', handleMouseLeave);
    }
    // -----------------------------------------------------

    // 2. Load all 16 files asynchronously on page load
    const daySuccess = await loadInitialAudio();
    if (!daySuccess) return; 

    const nightSuccess = await loadNightAudio();
    if (!nightSuccess) return; 
    
    const addOnSuccess = await loadAddOnAudio();
    if (!addOnSuccess) return;

    // Final message set in loadAddOnAudio()
    setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 2000);
});

// Global listener for movement (mouse and touch)
document.addEventListener('mousemove', handleMouseMove);

// Initial click/tap listener to unlock AudioContext
document.addEventListener('mousedown', initializeAudio);
document.addEventListener('touchstart', initializeAudio);

// Touch-specific listeners
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);
</script>
