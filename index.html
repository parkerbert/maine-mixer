<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allagash Ambience</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* --- CORE STYLES --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            cursor: none;
            color: #C2E2CC;
        }

        /* --- BACKGROUND LAYERS --- */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
            transition: opacity 3.0s ease-in-out !important;
        }
        .bg-current { opacity: 1; }
        .bg-next { opacity: 0; }

        /* --- TITLE STYLES --- */
        h1 {
            font-size: 3.0em;
            font-family: 'Garamond', 'Times New Roman', serif;
            color: #C2E2CC;
            text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
            margin-bottom: 5px;
        }
        h2 {
            font-size: 1.2em;
            font-family: 'Garamond', 'Times New Roman', serif;
            color: #AACCB8;
            text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* --- CONTENT CONTAINER --- */
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px;
            background-color: rgba(30, 45, 60, 0.85);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        /* --- Audio Pad and Controls (CRITICAL SIZE SETTING) --- */
        #audioPad {
            width: min(70vh, 80vw);
            height: min(70vh, 80vw);
            max-width: 700px;
            max-height: 700px;
            border: 2px solid #79C2A8;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 15px #79C2A8;
            margin: 20px;
            border-radius: 5px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        
        /* The label for ambiance */
        .pad-label {
            position: absolute;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #79C2A8;
            font-size: 0.9em;
            border-radius: 3px;
            transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
            pointer-events: none;
            z-index: 1;
        }
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }

        /* --- CRITICAL: LARGE ADDON ICONS (SVG) --- */
        .addon-icon {
            position: absolute;
            /* Explicit size fix */
            width: 200px; 
            height: 200px;
            
            color: #C2E2CC;
            opacity: 0.2;
            stroke: currentColor;
            stroke-width: 1.5;
            fill: none;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s, color 0.3s;
            pointer-events: auto;
        }

        /* Positioning for AddOn Icons (Uses translate to center outside the corner) */
        .top-left-icon { top: 0; left: 0; transform: translate(-50%, -50%); }
        .top-right-icon { top: 0; right: 0; transform: translate(50%, -50%); }
        .bottom-left-icon { bottom: 0; left: 0; transform: translate(-50%, 50%); }
        .bottom-right-icon { bottom: 0; right: 0; transform: translate(50%, 50%); }

        /* Active/Hover states for both labels and icons */
        .active-glow {
            box-shadow: 0 0 10px #C2E2CC;
            background-color: rgba(194, 232, 204, 0.2);
            color: white;
            opacity: 1.0;
        }
        .icon-active-glow {
            opacity: 1.0;
            color: #C2E2CC;
            box-shadow: 0 0 30px rgba(194, 232, 204, 0.5);
            transform: scale(1.05);
        }
        
        /* Hide the default mouse cursor */
        #mouseIndicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #C2E2CC;
            box-shadow: 0 0 10px #C2E2CC;
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 1000;
        }

        /* Explanation Box - RESPONSIVE POSITIONING */
        #explanationBox {
            position: fixed;
            top: 5vh;
            left: 5vw;
            padding: 15px;
            background-color: rgba(30, 45, 60, 0.85);
            border: 2px solid #79C2A8;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
            color: #C2E2CC;
            text-align: left;
            line-height: 1.4;
            z-index: 5;
            pointer-events: none;
        }
        #explanationBox p {
            white-space: nowrap;
            margin: 0;
        }
        .message-box {
            border: 1px solid #FF5555;
            background-color: rgba(255, 85, 85, 0.1);
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="bgLayer1" class="bg-layer bg-current"></div>

    </div>
    <script>
        // Set up references to DOM elements
        let pad = null;
        let indicator = null;
        let messageBox = null;
        // Background Layer References
        let bgLayer1 = null;
        let bgLayer2 = null;
        let currentBgLayer = null;
        let nextBgLayer = null;
        let labelTL = null;
        let labelTR = null;
        let labelBL = null;
        let labelBR = null;
        let labels = [];

        // NEW: Icon references and map
        let iconTL, iconTR, iconBL, iconBR;
        let addOnIcons = {};

        // State variables
        let lastDayImages = [];
        let lastNightImages = [];
        // Equal Power Crossfade State
        let crossfadePosition = 0.0;
        let isCrossfading = false;
        // Web Audio API and State variables
        let audioContext = null;
        let gainMap = {}; // Tracks GAIN NODES for ambience tracks
        let audioBuffers = {};
        let isPlaying = false;
        let audioReady = false;
        let nightAudioLoaded = false;
        let addOnAudioLoaded = false;
        let sfxLoaded = false;
        let audioInitiated = false;
        let mouseInPad = false;
        let lastMouseX = 0; // Last known X position of the mouse/touch
        let lastMouseY = 0; // Last known Y position of the mouse/touch
        
        // NEW: Ambience start time tracker (for loop synchronization)
        let ambienceStartTime = {};
        // NEW: Lake Day Add-On Scheduler
        let lakeDayAddOnTimer = null; 

        // Map to track the state of all 8 LOGICAL AddOns (key: 'TL_Day_AddOn', value: {source, gain, active})
        // NOTE: BL_Day_AddOn has a logical state (BL_Day_AddOn_Logical) and two physical audio track states.
        let addOnStateMap = {};
        // Mapping of corner keys to human-readable names
        const cornerNames = {
            'TL': 'Cabin',
            'TR': 'Forest',
            'BL': 'Lake',
            'BR': 'RangerStation'
        };

        // --- SFX DEFINITIONS (40 total files: 20 Cabin + 20 Ranger Station) ---
        const sfxFilePaths = {
            Cabin_Day_ButtonOn_AddOn_1: 'audio/Cabin_Day_ButtonOn_AddOn_01.ogg',
            Cabin_Day_ButtonOn_AddOn_2: 'audio/Cabin_Day_ButtonOn_AddOn_02.ogg',
            Cabin_Day_ButtonOn_AddOn_3: 'audio/Cabin_Day_ButtonOn_AddOn_03.ogg',
            Cabin_Day_ButtonOn_AddOn_4: 'audio/Cabin_Day_ButtonOn_AddOn_04.ogg',
            Cabin_Day_ButtonOn_AddOn_5: 'audio/Cabin_Day_ButtonOn_AddOn_05.ogg',
            Cabin_Day_ButtonOff_AddOn_1: 'audio/Cabin_Day_ButtonOff_AddOn_01.ogg',
            Cabin_Day_ButtonOff_AddOn_2: 'audio/Cabin_Day_ButtonOff_AddOn_02.ogg',
            Cabin_Day_ButtonOff_AddOn_3: 'audio/Cabin_Day_ButtonOff_AddOn_03.ogg',
            Cabin_Day_ButtonOff_AddOn_4: 'audio/Cabin_Day_ButtonOff_AddOn_04.ogg',
            Cabin_Day_ButtonOff_AddOn_5: 'audio/Cabin_Day_ButtonOff_AddOn_05.ogg',
            Cabin_Night_ButtonOn_AddOn_1: 'audio/Cabin_Night_ButtonOn_AddOn_01.ogg',
            Cabin_Night_ButtonOn_AddOn_2: 'audio/Cabin_Night_ButtonOn_AddOn_02.ogg',
            Cabin_Night_ButtonOn_AddOn_3: 'audio/Cabin_Night_ButtonOn_AddOn_03.ogg',
            Cabin_Night_ButtonOn_AddOn_4: 'audio/Cabin_Night_ButtonOn_AddOn_04.ogg',
            Cabin_Night_ButtonOn_AddOn_5: 'audio/Cabin_Night_ButtonOn_AddOn_05.ogg',
            Cabin_Night_ButtonOff_AddOn_1: 'audio/Cabin_Night_ButtonOff_AddOn_01.ogg',
            Cabin_Night_ButtonOff_AddOn_2: 'audio/Cabin_Night_ButtonOff_AddOn_02.ogg',
            Cabin_Night_ButtonOff_AddOn_3: 'audio/Cabin_Night_ButtonOff_AddOn_03.ogg',
            Cabin_Night_ButtonOff_AddOn_4: 'audio/Cabin_Night_ButtonOff_AddOn_04.ogg',
            Cabin_Night_ButtonOff_AddOn_5: 'audio/Cabin_Night_ButtonOff_AddOn_05.ogg',
            RangerStaion_Day_ButtonOn_AddOn_1: 'audio/RangerStaion_Day_ButtonOn_AddOn_01.ogg',
            RangerStaion_Day_ButtonOn_AddOn_2: 'audio/RangerStaion_Day_ButtonOn_AddOn_02.ogg',
            RangerStaion_Day_ButtonOn_AddOn_3: 'audio/RangerStaion_Day_ButtonOn_AddOn_03.ogg',
            RangerStaion_Day_ButtonOn_AddOn_4: 'audio/RangerStaion_Day_ButtonOn_AddOn_04.ogg',
            RangerStaion_Day_ButtonOn_AddOn_5: 'audio/RangerStaion_Day_ButtonOn_AddOn_05.ogg',
            RangerStaion_Day_ButtonOff_AddOn_1: 'audio/RangerStaion_Day_ButtonOff_AddOn_01.ogg',
            RangerStaion_Day_ButtonOff_AddOn_2: 'audio/RangerStaion_Day_ButtonOff_AddOn_02.ogg',
            RangerStaion_Day_ButtonOff_AddOn_3: 'audio/RangerStaion_Day_ButtonOff_AddOn_03.ogg',
            RangerStaion_Day_ButtonOff_AddOn_4: 'audio/RangerStaion_Day_ButtonOff_AddOn_04.ogg',
            RangerStaion_Day_ButtonOff_AddOn_5: 'audio/RangerStaion_Day_ButtonOff_AddOn_05.ogg',
            RangerStaion_Night_ButtonOn_AddOn_1: 'audio/RangerStaion_Night_ButtonOn_AddOn_01.ogg',
            RangerStaion_Night_ButtonOn_AddOn_2: 'audio/RangerStaion_Night_ButtonOn_AddOn_02.ogg',
            RangerStaion_Night_ButtonOn_AddOn_3: 'audio/RangerStaion_Night_ButtonOn_AddOn_03.ogg',
            RangerStaion_Night_ButtonOn_AddOn_4: 'audio/RangerStaion_Night_ButtonOn_AddOn_04.ogg',
            RangerStaion_Night_ButtonOn_AddOn_5: 'audio/RangerStaion_Night_ButtonOn_AddOn_05.ogg',
            RangerStaion_Night_ButtonOff_AddOn_1: 'audio/RangerStaion_Night_ButtonOff_AddOn_01.ogg',
            RangerStaion_Night_ButtonOff_AddOn_2: 'audio/RangerStaion_Night_ButtonOff_AddOn_02.ogg',
            RangerStaion_Night_ButtonOff_AddOn_3: 'audio/RangerStaion_Night_ButtonOff_AddOn_03.ogg',
            RangerStaion_Night_ButtonOff_AddOn_4: 'audio/RangerStaion_Night_ButtonOff_AddOn_04.ogg',
            RangerStaion_Night_ButtonOff_AddOn_5: 'audio/RangerStaion_Night_ButtonOff_AddOn_05.ogg'
        };

        const buttonCabinDayOnKeys = ['Cabin_Day_ButtonOn_AddOn_1', 'Cabin_Day_ButtonOn_AddOn_2', 'Cabin_Day_ButtonOn_AddOn_3', 'Cabin_Day_ButtonOn_AddOn_4', 'Cabin_Day_ButtonOn_AddOn_5'];
        const buttonCabinDayOffKeys = ['Cabin_Day_ButtonOff_AddOn_1', 'Cabin_Day_ButtonOff_AddOn_2', 'Cabin_Day_ButtonOff_AddOn_3', 'Cabin_Day_ButtonOff_AddOn_4', 'Cabin_Day_ButtonOff_AddOn_5'];
        const buttonCabinNightOnKeys = ['Cabin_Night_ButtonOn_AddOn_1', 'Cabin_Night_ButtonOn_AddOn_2', 'Cabin_Night_ButtonOn_AddOn_3', 'Cabin_Night_ButtonOn_AddOn_4', 'Cabin_Night_ButtonOn_AddOn_5'];
        const buttonCabinNightOffKeys = ['Cabin_Night_ButtonOff_AddOn_1', 'Cabin_Night_ButtonOff_AddOn_2', 'Cabin_Night_ButtonOff_AddOn_3', 'Cabin_Night_ButtonOff_AddOn_4', 'Cabin_Night_ButtonOff_AddOn_5'];
        const buttonRangerDayOnKeys = ['RangerStaion_Day_ButtonOn_AddOn_1', 'RangerStaion_Day_ButtonOn_AddOn_2', 'RangerStaion_Day_ButtonOn_AddOn_3', 'RangerStaion_Day_ButtonOn_AddOn_4', 'RangerStaion_Day_ButtonOn_AddOn_5'];
        const buttonRangerDayOffKeys = ['RangerStaion_Day_ButtonOff_AddOn_1', 'RangerStaion_Day_ButtonOff_AddOn_2', 'RangerStaion_Day_ButtonOff_AddOn_3', 'RangerStaion_Day_ButtonOff_AddOn_4', 'RangerStaion_Day_ButtonOff_AddOn_5'];
        const buttonRangerNightOnKeys = ['RangerStaion_Night_ButtonOn_AddOn_1', 'RangerStaion_Night_ButtonOn_AddOn_2', 'RangerStaion_Night_ButtonOn_AddOn_3', 'RangerStaion_Night_ButtonOn_AddOn_4', 'RangerStaion_Night_ButtonOn_AddOn_5'];
        const buttonRangerNightOffKeys = ['RangerStaion_Night_ButtonOff_AddOn_1', 'RangerStaion_Night_ButtonOff_AddOn_2', 'RangerStaion_Night_ButtonOff_AddOn_3', 'RangerStaion_Night_ButtonOff_AddOn_4', 'RangerStaion_Night_ButtonOff_AddOn_5'];

        const allSfxKeys = Object.keys(sfxFilePaths);

        // Mapped Add-On files (9 total: 6 singles + 2 Lake variations + 1 Night)
        const addOnFilePaths = {
            TL_Day_AddOn: 'audio/Cabin_Day_AddOn.ogg',
            TL_Night_AddOn: 'audio/Cabin_Night_AddOn.ogg',
            TR_Day_AddOn: 'audio/Forest_Day_AddOn.ogg',
            TR_Night_AddOn: 'audio/Forest_Night_AddOn.ogg',
            BL_Day_Calm_AddOn: 'audio/Lake_Day_Calm_AddOn.ogg', 
            BL_Day_Storm_AddOn: 'audio/Lake_Day_Storm_AddOn.ogg',
            BL_Night_AddOn: 'audio/Lake_Night_AddOn.ogg',
            BR_Day_AddOn: 'audio/RangerStation_Day_AddOn.ogg',
            BR_Night_AddOn: 'audio/RangerStation_Night_AddOn.ogg'
        };
        const allAddOnKeys = Object.keys(addOnFilePaths);

        // FILE PATHS: Mapped to all 8 core audio files
        const audioFilePaths = {
            TL_Day: 'audio/Cabin_Day.ogg',
            TR_Day: 'audio/Forest_Day.ogg',
            BL_Day: 'audio/Lake_Day.ogg',
            BR_Day: 'audio/RangerStation_Day.ogg',
            TL_Night: 'audio/Cabin_Night.ogg',
            TR_Night: 'audio/Forest_Night.ogg',
            BL_Night: 'audio/Lake_Night.ogg',
            BR_Night: 'audio/RangerStation_Night.ogg'
        };

        // Split keys for on-demand loading
        const initialAudioKeys = ['TL_Day', 'TR_Day', 'BL_Day', 'BR_Day'];
        const nightAudioKeys = ['TL_Night', 'TR_Night', 'BL_Night', 'BR_Night'];

        // Background Image Arrays (Omitted for brevity)
        const dayBackgrounds = [
            'images/Woods_Day_1.jpg',
            'images/Woods_Day_2.jpg',
            'images/Woods_Day_3.jpg',
            'images/Woods_Day_4.jpg',
            'images/Woods_Day_5.jpg'
        ];
        const nightBackgrounds = [
            'images/Woods_Night_1.jpg',
            'images/Woods_Night_2.jpg',
            'images/Woods_Night_3.jpg',
            'images/Woods_Night_4.jpg',
            'images/Woods_Night_5.jpg'
        ];

        // Core constants
        const FADE_BUFFER_DISTANCE = 150;
        const ISOLATION_BUFFER_SIZE = 0.333;
        const MINIMUM_GAIN = 0.0001;
        const RAMP_TIME = 0.05;
        const FADE_TIME_TOGGLE = 3.0; // Increased to 3.0s for smoother transition
        const FADE_TIME_ADDON_STOP = 1.0;
        const BACKGROUND_FADE_DELAY = 3000;
        const MAX_ADDON_VOLUME = 1.0;
        const CABINET_ADDON_DELAY = 0.5; // Constant for the 0.5 second delay

        // --- NEW LAKE DAY CONSTANTS ---
        const LAKE_DAY_DURATION = 425.0; // 7 minutes 5 seconds
        const CROSSFADE_TIME = 1.5; // 1.5 second crossfade
        // Time markers (in seconds)
        const LAKE_DAY_STORM_START = 150.0; // 2:30
        const LAKE_DAY_CALM_START_2 = 275.0; // 4:35
        const BL_DAY_CALM_KEY = 'BL_Day_Calm_AddOn';
        const BL_DAY_STORM_KEY = 'BL_Day_Storm_AddOn';


        // --- Helper Functions (Console logging only) ---
        function showMessage(text, isError = false) {
            const prefix = isError ? '[ERROR]' : '[Status]';
            console.log(`${prefix} ${text}`);
        }

        // --- SFX Play Function (Unchanged) ---
        function playSfx(key) {
            if (!audioContext || !sfxLoaded) return;
            const buffer = audioBuffers[key];
            if (!buffer) {
                console.warn(`SFX buffer not found for key: ${key}`);
                return;
            }
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start(0);
        }

        // --- Audio File Loader (Unchanged) ---
        async function loadAudioFile(url, key) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                audioBuffers[key] = audioBuffer;
            } catch (error) {
                console.error(`ERROR loading audio file ${url}:`, error);
                showMessage(`Failed to load audio file: ${url}. Check console for details.`, true);
                return { key, success: false, error: error.message };
            }
            return { key, success: true };
        }

        // --- Core Ambience Start Function (UPDATED to track BL_Day start time) ---
        function connectAndStartAmbienceSource(key, initialGain = 1.0) {
            const buffer = audioBuffers[key];
            const source = audioContext.createBufferSource();
            const gain = audioContext.createGain();
            source.buffer = buffer;
            source.loop = true;
            gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
            source.connect(gain);
            gain.connect(audioContext.destination);
            gainMap[key] = gain;
            source.start(0);

            // CRITICAL: Record the start time for loop synchronization
            if (key === 'BL_Day') {
                ambienceStartTime[key] = audioContext.currentTime;
            }
        }

        // --- AddOn Audio Start Function (Starts running silently) ---
        function connectAndStartAddOnSource(key) {
            const buffer = audioBuffers[key];
            if (!buffer) return;

            const source = audioContext.createBufferSource();
            const gain = audioContext.createGain();
            
            source.buffer = buffer;
            source.loop = true;
            // Start silent (volume controlled by the spatial mix or Add-On logic)
            gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
            source.connect(gain);
            gain.connect(audioContext.destination);
            
            // Save to the persistent state map
            const state = addOnStateMap[key];
            if (state) {
                state.source = source;
                state.gain = gain;
            }

            // Start the source immediately and let it run forever
            source.start(0);
        }

        // --- On-Demand Loading Functions ---
        async function loadInitialAudio() {
            if (audioReady) return;
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            currentBgLayer.style.backgroundImage = getRandomBackground('Day');
            showMessage("Loading Day ambiance audio files (4/8 Ambience)...");
            const loadPromises = initialAudioKeys.map(key =>
                loadAudioFile(audioFilePaths[key], key)
            );
            const results = await Promise.all(loadPromises);
            const successfulLoads = results.filter(r => r && r.success).length;
            const totalFiles = initialAudioKeys.length;

            if (successfulLoads === totalFiles) {
                // START DAY TRACKS AT FULL VOLUME (1.0)
                initialAudioKeys.forEach(key => connectAndStartAmbienceSource(key, 1.0));
                audioReady = true;
                isPlaying = true;
                showMessage('Day ambiance audio ready! You can now mix.');
                return true;
            } else {
                showMessage('CRITICAL ERROR: Failed to load Day ambiance audio files. Site non-functional.', true);
                return false;
            }
        }

        async function loadNightAudio() {
            if (nightAudioLoaded) return true;
            showMessage("Loading Night ambiance audio files (4/8 Ambience)... Please wait.", false);
            const loadPromises = nightAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key));
            const results = await Promise.all(loadPromises);
            const successfulLoads = results.filter(r => r && r.success).length;

            if (successfulLoads === nightAudioKeys.length) {
                nightAudioLoaded = true;
                
                // FIX: Start Night tracks silently so they are ready for crossfade.
                nightAudioKeys.forEach(key => connectAndStartAmbienceSource(key, MINIMUM_GAIN));
                
                showMessage("Night ambiance audio loaded and started silently.", false);
                return true;
            } else {
                showMessage(`ERROR: Failed to load Night ambiance audio files.`, true);
                return false;
            }
        }

        async function loadSfxAudio() {
            if (sfxLoaded) return true;
            showMessage("Loading SFX audio files (40 files)... Please wait.", false);
            const loadPromises = allSfxKeys.map(key => {
                const url = sfxFilePaths[key];
                return loadAudioFile(url, key);
            });
            const results = await Promise.all(loadPromises);
            const successfulLoads = results.filter(r => r && r.success).length;
            
            if (successfulLoads === allSfxKeys.length) {
                sfxLoaded = true;
                showMessage("SFX loaded.", false);
                return true;
            } else {
                showMessage(`ERROR: Failed to load SFX audio files.`, true);
                return false;
            }
        }

        // NEW: Load all Add-On files (now 9 total)
        async function loadAddOnAudio() {
            if (addOnAudioLoaded) return true;
            showMessage("Loading Add-On audio files (9 total)... Please wait.", false);
            const loadPromises = allAddOnKeys.map(key => 
                loadAudioFile(addOnFilePaths[key], key)
            );
            const results = await Promise.all(loadPromises);
            const successfulLoads = results.filter(r => r && r.success).length;

            if (successfulLoads === allAddOnKeys.length) {
                addOnAudioLoaded = true;
                // Initialize the persistent state map for all 9 AddOns + 1 Logical State
                allAddOnKeys.forEach(key => { 
                    addOnStateMap[key] = { source: null, gain: null, active: false };
                    connectAndStartAddOnSource(key);
                });
                // Add the logical state for Lake Day AddOn
                addOnStateMap['BL_Day_AddOn_Logical'] = { active: false };
                showMessage("All ambiance/addon audio files loaded. System ready!", false);
                return true;
            } else {
                showMessage(`ERROR: Failed to load Add-On audio files. Check for missing or misnamed Lake Day files.`, true);
                return false;
            }
        }

        // ... (Image Background Functions - Unchanged) ...
        function getRandomBackground(mode) {
            const allImages = mode === 'Day' ? dayBackgrounds : nightBackgrounds;
            const lastImages = mode === 'Day' ? lastDayImages : lastNightImages;

            let newImage;
            let attempts = 0;
            do {
                newImage = allImages[Math.floor(Math.random() * allImages.length)];
                attempts++;
            } while (lastImages.includes(newImage) && attempts < 10);

            lastImages.push(newImage);
            if (lastImages.length > 3) lastImages.shift();

            return `url('${newImage}')`;
        }

        function updateBackground(mode) {
            const newImage = getRandomBackground(mode);
            nextBgLayer.style.backgroundImage = newImage;
            nextBgLayer.classList.remove('bg-next');
            nextBgLayer.classList.add('bg-current');

            currentBgLayer.classList.remove('bg-current');
            currentBgLayer.classList.add('bg-next');

            setTimeout(() => {
                const temp = currentBgLayer;
                currentBgLayer = nextBgLayer;
                nextBgLayer = temp;
                nextBgLayer.style.backgroundImage = 'none';
            }, BACKGROUND_FADE_DELAY);
        }

        // ... (Audio Gain Logic - Unchanged) ...
        function equalPowerGain(position, isDay) {
            const angle = position * 0.5 * Math.PI;
            // Equal-power crossfade curve: cos for day, sin for night
            return isDay ? Math.cos(angle) : Math.sin(angle);
        }

        function applyIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 0; }
            if (p >= 1 - buffer) { return 1; }
            return (p - buffer) / (1 - 2 * buffer);
        }

        function applyOppositeIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 1; }
            if (p >= 1 - buffer) { return 0; }
            return (1 - p - buffer) / (1 - 2 * buffer);
        }

        function getCurrentCorner(x, y) {
            const isTop = y < 0.5;
            const isLeft = x < 0.5;
            if (isTop && isLeft) return 'TL'; // Top-Left (Cabin)
            if (isTop && !isLeft) return 'TR'; // Top-Right (Forest)
            if (!isTop && isLeft) return 'BL'; // Bottom-Left (Lake)
            if (!isTop && !isLeft) return 'BR'; // Bottom-Right (Ranger Station)
            return null;
        }

        // --- LAKE DAY ADD-ON MANAGEMENT FUNCTIONS (Unchanged) ---
        function getLakeDayLoopTime() {
            if (!ambienceStartTime['BL_Day'] || !audioContext) return 0;
            const elapsedTime = audioContext.currentTime - ambienceStartTime['BL_Day'];
            return elapsedTime % LAKE_DAY_DURATION;
        }

        function checkAndScheduleLakeDaySwitch() {
            const isCurrentlyDay = (crossfadePosition < 0.5);
            if (!addOnStateMap['BL_Day_AddOn_Logical'].active || !isCurrentlyDay) {
                manageLakeDayAddOn(false);
                return;
            }

            const loopTime = getLakeDayLoopTime(); // 0 to 425 seconds
            const now = audioContext.currentTime;
            const fadeTime = CROSSFADE_TIME;
            
            const switchPoints = [
                { time: LAKE_DAY_STORM_START, from: BL_DAY_CALM_KEY, to: BL_DAY_STORM_KEY, message: "Calm -> Storm" },
                { time: LAKE_DAY_CALM_START_2, from: BL_DAY_STORM_KEY, to: BL_DAY_CALM_KEY, message: "Storm -> Calm" },
                { time: LAKE_DAY_DURATION, from: BL_DAY_CALM_KEY, to: BL_DAY_STORM_KEY, message: "Calm -> Storm (Loop Reset)" } 
            ];
            
            for (const point of switchPoints) {
                const timeUntilSwitch = point.time - loopTime;
                
                if (timeUntilSwitch > 0 && timeUntilSwitch < fadeTime + 0.1) { 
                    
                    const switchStartContextTime = now + timeUntilSwitch;

                    const gainOut = addOnStateMap[point.from].gain.gain;
                    const gainIn = addOnStateMap[point.to].gain.gain;

                    gainOut.setValueAtTime(MAX_ADDON_VOLUME, now); 
                    gainIn.setValueAtTime(MINIMUM_GAIN, now);     

                    gainOut.linearRampToValueAtTime(MINIMUM_GAIN, switchStartContextTime + fadeTime);
                    gainIn.linearRampToValueAtTime(MAX_ADDON_VOLUME, switchStartContextTime + fadeTime);

                    showMessage(`Lake Day Add-On: Scheduled ${point.message} switch to begin in ${timeUntilSwitch.toFixed(2)}s.`, false);
                    
                    return;
                }
            }
        }

        function manageLakeDayAddOn(enable) {
            if (lakeDayAddOnTimer) {
                clearInterval(lakeDayAddOnTimer);
                lakeDayAddOnTimer = null;
            }

            if (enable) {
                lakeDayAddOnTimer = setInterval(checkAndScheduleLakeDaySwitch, 50);
                showMessage("Lake Day Add-On scheduling loop started.", false);
            } else {
                 showMessage("Lake Day Add-On scheduling loop stopped.", false);
            }
        }

        // --- Core Audio Update Function (CRITICAL FIX FOR CROSSFADE RAMPING) ---
        function updateAudioGains(event) {
            if (!audioReady || !isPlaying || !pad) return;

            const rect = pad.getBoundingClientRect();
            // Store mouse position if event is a genuine move, but allow forceFade to bypass the check
            if (event && event.clientX && !event.forceFade) {
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
            }

            let x = (lastMouseX - rect.left) / rect.width;
            let y = (lastMouseY - rect.top) / rect.height;

            // Use RAMP_TIME for spatial mixing, or FADE_TIME_TOGGLE if a crossfade is forced (from spacebar)
            const rampDuration = (event && event.forceFade) ? FADE_TIME_TOGGLE : RAMP_TIME;
            const now = audioContext.currentTime;

            // --- 1. SPATIAL GAIN CALCULATION ---
            const xToRight = applyIsolation(x);
            const xToLeft = applyOppositeIsolation(x);
            const yToBottom = applyIsolation(y);
            const yToTop = applyOppositeIsolation(y);

            const baseGains = {
                TL: xToLeft * yToTop, // Cabin
                TR: xToRight * yToTop, // Forest
                BL: xToLeft * yToBottom, // Lake
                BR: xToRight * yToBottom // Ranger Station
            };
            
            // --- 2. AMBIENCE GAIN CALCULATION (Day/Night Mix) ---
            const currentDayMix = equalPowerGain(crossfadePosition, true);
            const currentNightMix = equalPowerGain(crossfadePosition, false);
            
            // Iterate over all four corners
            ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
                const dayKey = `${cornerKey}_Day`;
                const nightKey = `${cornerKey}_Night`;
                
                // Calculate the final target gain for this track
                const dayTargetGain = baseGains[cornerKey] * currentDayMix;
                const nightTargetGain = baseGains[cornerKey] * currentNightMix;

                // CRITICAL FIX: Use linearRampToValueAtTime for the Day and Night tracks
                if (gainMap[dayKey]) {
                    gainMap[dayKey].gain.linearRampToValueAtTime(dayTargetGain, now + rampDuration);
                }
                if (gainMap[nightKey]) {
                    gainMap[nightKey].gain.linearRampToValueAtTime(nightTargetGain, now + rampDuration);
                }
            });


            // --- 3. ADD-ON GAIN CALCULATION ---
            // This is complex, as AddOns also mix Day/Night based on crossfadePosition, but they only play if their state is active.
            allAddOnKeys.forEach(addOnKey => {
                const state = addOnStateMap[addOnKey];
                if (!state || !state.gain) return;

                const corner = addOnKey.substring(0, 2);
                const mode = addOnKey.includes('_Night') ? 'Night' : 'Day';
                
                const modeMix = (mode === 'Day') ? currentDayMix : currentNightMix;
                const modeBase = baseGains[corner];
                let target = MINIMUM_GAIN;

                // --- SPECIAL CASE: Lake Day Add-On (BL_Day_Calm/Storm) ---
                if (corner === 'BL' && mode === 'Day') {
                    const logicalState = addOnStateMap['BL_Day_AddOn_Logical'];
                    if (logicalState.active && modeMix > MINIMUM_GAIN) {
                        // When spatial mixing is involved, we scale the current value by the spatial position
                        const spatialMixTarget = modeBase * MAX_ADDON_VOLUME * modeMix;
                        
                        // We must check if the Add-On track is currently at max volume (meaning it's the active one for this segment)
                        // If it's the active track, we apply the spatial mix and crossfade mix.
                        // We rely on the `checkAndScheduleLakeDaySwitch` function to handle the crossfading between Calm/Storm.
                        if (state.gain.gain.value > MINIMUM_GAIN * 10) { 
                            target = spatialMixTarget;
                        } else {
                            // If it's the inactive track, it remains silent (MINIMUM_GAIN).
                            target = MINIMUM_GAIN; 
                        }

                    } else {
                         target = MINIMUM_GAIN;
                    }
                } 
                // --- GENERAL CASE: All other Add-Ons ---
                else {
                    const generalState = addOnStateMap[addOnKey]; // TL_Day_AddOn, TR_Night_AddOn, etc.

                    if (generalState && generalState.active) {
                        if (modeMix > MINIMUM_GAIN) {
                            target = modeBase * modeMix * MAX_ADDON_VOLUME;
                        }
                    }
                }

                state.gain.gain.linearRampToValueAtTime(target, now + rampDuration);
            });


            // --- 4. VISUALS (Labels & Mouse Indicator) ---
            const isCurrentlyDay = (crossfadePosition < 0.5);
            
            // Mouse Indicator
            if (mouseInPad) {
                indicator.style.opacity = 1;
                indicator.style.left = `${x * 100}%`;
                indicator.style.top = `${y * 100}%`;
            }

            // Labels
            ['TL', 'TR', 'BL', 'BR'].forEach(key => {
                const label = document.getElementById(`label${key}`);
                const icon = addOnIcons[key];
                const ambienceGain = baseGains[key];
                
                if (ambienceGain > 0.3) {
                    label.classList.add('active-glow');
                } else {
                    label.classList.remove('active-glow');
                }

                // Add-on button icon visibility/opacity
                if (icon) {
                    let isAddOnActive = false;
                    if (key === 'BL' && isCurrentlyDay) {
                        isAddOnActive = addOnStateMap['BL_Day_AddOn_Logical'].active;
                    } else {
                        const stateKeyDay = `${key}_Day_AddOn`;
                        const stateKeyNight = `${key}_Night_AddOn`;
                        isAddOnActive = addOnStateMap[stateKeyDay].active || addOnStateMap[stateKeyNight].active;
                    }

                    if (isAddOnActive) {
                        icon.classList.add('icon-active-glow');
                    } else {
                        icon.classList.remove('icon-active-glow');
                        icon.style.opacity = Math.min(0.5, ambienceGain * 2); 
                    }
                }
            });
        }
        
        // --- Crossfade Logic (CRITICAL FIX FOR RESETTING isCrossfading) ---
        function startCrossfade(targetIsNight) {
            if (isCrossfading) return;
            isCrossfading = true;

            const duration = FADE_TIME_TOGGLE;
            const startTime = audioContext.currentTime;
            const startPosition = crossfadePosition;
            const endPosition = targetIsNight ? 1.0 : 0.0;
            const distance = endPosition - startPosition;

            const animate = () => {
                const now = audioContext.currentTime;
                const elapsed = now - startTime;

                if (elapsed >= duration) {
                    crossfadePosition = endPosition;
                    // *** FIX 2: Reset the flag to allow subsequent presses ***
                    isCrossfading = false;
                    updateAudioGains({ forceFade: true }); 
                    
                    if (targetIsNight) {
                         // Stop Lake Day scheduler when transitioning to night
                         manageLakeDayAddOn(false);
                         if (addOnStateMap['BL_Day_AddOn_Logical'].active) {
                            // Ensure day lake tracks fade out completely
                            addOnStateMap[BL_DAY_CALM_KEY].gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
                            addOnStateMap[BL_DAY_STORM_KEY].gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
                         }
                    } else {
                        if (addOnStateMap['BL_Day_AddOn_Logical'].active) {
                            // Start Lake Day scheduler when returning to day
                            initializeLakeDayAddOnGains(true); 
                            manageLakeDayAddOn(true);
                        }
                    }
                    
                    return;
                }
                let t = elapsed / duration;
                crossfadePosition = startPosition + distance * t;
                // Calls updateAudioGains with forceFade: true so it uses the long fade time.
                updateAudioGains({ forceFade: true }); 

                requestAnimationFrame(animate);
            };

            animate();
        }

        // ... (Lake Day Add-On Initialization - Unchanged) ...
        function initializeLakeDayAddOnGains(forceRamp = false) {
            const loopTime = getLakeDayLoopTime();
            const now = audioContext.currentTime;
            const rampTime = forceRamp ? FADE_TIME_TOGGLE : RAMP_TIME;

            let initialCalmGain = MINIMUM_GAIN;
            let initialStormGain = MINIMUM_GAIN;

            if (loopTime >= 0 && loopTime < LAKE_DAY_STORM_START) { 
                initialCalmGain = MAX_ADDON_VOLUME;
            } else if (loopTime >= LAKE_DAY_STORM_START && loopTime < LAKE_DAY_CALM_START_2) { 
                initialStormGain = MAX_ADDON_VOLUME;
            } else { 
                initialCalmGain = MAX_ADDON_VOLUME;
            }

            const calmGainNode = addOnStateMap[BL_DAY_CALM_KEY].gain.gain;
            const stormGainNode = addOnStateMap[BL_DAY_STORM_KEY].gain.gain;

            if (forceRamp) {
                calmGainNode.linearRampToValueAtTime(initialCalmGain, now + rampTime);
                stormGainNode.linearRampToValueAtTime(initialStormGain, now + rampTime);
            } else {
                calmGainNode.linearRampToValueAtTime(initialCalmGain, now + RAMP_TIME);
                stormGainNode.linearRampToValueAtTime(initialStormGain, now + RAMP_TIME);
            }
        }


        // ... (Add-On Toggle Function - Unchanged) ...
        async function toggleAddOn() {
            initializeAudio();
            if (!audioReady || !addOnAudioLoaded) {
                if (!addOnAudioLoaded) showMessage("Add-on audio files are still loading or failed to load.", true);
                return;
            }
            
            const isCurrentlyDay = (crossfadePosition < 0.5);
            const currentMode = isCurrentlyDay ? 'Day' : 'Night';
            
            const rect = pad.getBoundingClientRect();
            let x = (lastMouseX - rect.left) / rect.width;
            let y = (lastMouseY - rect.top) / rect.height;

            const currentCornerKey = getCurrentCorner(x, y); 
            if (!currentCornerKey) return;
            
            const isLakeAddOn = (currentCornerKey === 'BL');
            const isCabinAddOn = (currentCornerKey === 'TL');
            const isRangerAddOn = (currentCornerKey === 'BR');
            const isSFXAddOn = isCabinAddOn || isRangerAddOn; 
            const currentAddOnName = cornerNames[currentCornerKey];

            const checkKey = isLakeAddOn && isCurrentlyDay ? 'BL_Day_AddOn_Logical' : `${currentCornerKey}_${currentMode}_AddOn`;
            const state = addOnStateMap[checkKey];
            if (!state) return;
            
            const iconElement = addOnIcons[currentCornerKey];


            // --- TOGGLE LOGIC ---
            if (state.active) {
                state.active = false; 
                
                if (isSFXAddOn && sfxLoaded) {
                    let offKeys;
                    if (isCabinAddOn) {
                        offKeys = currentMode === 'Day' ? buttonCabinDayOffKeys : buttonCabinNightOffKeys;
                    } else if (isRangerAddOn) {
                        offKeys = currentMode === 'Day' ? buttonRangerDayOffKeys : buttonRangerNightOffKeys;
                    }
                    if (offKeys) {
                        const randomKey = offKeys[Math.floor(Math.random() * offKeys.length)];
                        playSfx(randomKey);
                    }
                }
                
                if (!isLakeAddOn || !isCurrentlyDay) {
                    if (addOnStateMap[checkKey].gain) {
                       addOnStateMap[checkKey].gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
                    }
                } else if (isLakeAddOn && isCurrentlyDay) {
                    manageLakeDayAddOn(false);
                    addOnStateMap[BL_DAY_CALM_KEY].gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
                    addOnStateMap[BL_DAY_STORM_KEY].gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
                }

                iconElement.classList.remove('icon-active-glow');
                showMessage(`${currentAddOnName} ${currentMode} add-on turned OFF.`, false);

            } 
            else {
                state.active = true; 

                if (isLakeAddOn && isCurrentlyDay) {
                    initializeLakeDayAddOnGains();
                    manageLakeDayAddOn(true); 
                }
                
                if (isSFXAddOn) {
                    let onKeys = null;
                    let rampStart = audioContext.currentTime;
                    
                    if (isCabinAddOn) {
                        onKeys = currentMode === 'Day' ? buttonCabinDayOnKeys : buttonCabinNightOnKeys;
                        rampStart += CABINET_ADDON_DELAY; 
                    } else if (isRangerAddOn) {
                        onKeys = currentMode === 'Day' ? buttonRangerDayOnKeys : buttonRangerNightOnKeys;
                        rampStart += CABINET_ADDON_DELAY; 
                    }

                    if (onKeys && sfxLoaded) {
                        const randomKey = onKeys[Math.floor(Math.random() * onKeys.length)];
                        playSfx(randomKey);
                    }
                    
                    if (addOnStateMap[checkKey].gain) {
                        const gain = addOnStateMap[checkKey].gain.gain;
                        gain.setValueAtTime(MINIMUM_GAIN, rampStart);
                        gain.linearRampToValueAtTime(MAX_ADDON_VOLUME, rampStart + RAMP_TIME);
                    }
                } 
                
                iconElement.classList.add('icon-active-glow');
                showMessage(`${currentAddOnName} ${currentMode} add-on turned ON.`, false);
            }

            updateAudioGains({ forceFade: true }); 
        }

        // ... (Mouse/Touch Handlers - Unchanged) ...
        function handleMouseMove(event) {
            if (!audioReady || !isPlaying || !pad) return;

            const rect = pad.getBoundingClientRect();
            const isOutsidePad = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;

            if (isOutsidePad) {
                if (!mouseInPad) return;
            } else {
                updateAudioGains(event);
            }
            
            const cursorX = event.clientX;
            const cursorY = event.clientY;
            
            let closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
            let closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

            const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));
            let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
            opacity = Math.min(1, Math.max(0, opacity));
            indicator.style.opacity = mouseInPad ? opacity : 0;
            indicator.style.left = `${cursorX}px`;
            indicator.style.top = `${cursorY}px`;
        }
        
        function handleTouchMove(event) {
            event.preventDefault(); 
            const touch = event.touches[0];
            const syntheticEvent = { clientX: touch.clientX, clientY: touch.clientY, forceFade: false };
            handleMouseMove(syntheticEvent);
        }

        function handleTouchEnd() {
            const syntheticEvent = { clientX: lastMouseX, clientY: lastMouseY, forceFade: false };
        }

        function handleMouseEnter() {
            mouseInPad = true;
        } 

        function handleMouseLeave() {
            showMessage("MOUSE LEAVE TRIGGERED: Fading Ambience Out.");
            mouseInPad = false; 
            const now = audioContext.currentTime;
            const rampDuration = 0.5;

            Object.keys(gainMap).forEach(key => {
                gainMap[key].gain.linearRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);
            });
            
            manageLakeDayAddOn(false);
            if (addOnStateMap['BL_Day_AddOn_Logical'].active) {
                addOnStateMap[BL_DAY_CALM_KEY].gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);
                addOnStateMap[BL_DAY_STORM_KEY].gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, now + rampDuration);
            }
        }
        
        function initializeAudio() {
            if (!audioInitiated && audioReady) {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        audioInitiated = true;
                        showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                    });
                } else if (audioContext && audioContext.state === 'running') {
                    audioInitiated = true;
                }
            }
        }
        
        // --- Keyboard Event Listener (Unchanged) ---
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); 
                // Only allow spacebar press if not already crossfading
                if (!audioReady || isCrossfading) return;
                initializeAudio();

                const isCurrentlyDay = (crossfadePosition < 0.5);
                const targetIsNight = isCurrentlyDay;

                if (targetIsNight && !nightAudioLoaded) {
                    showMessage("Night audio is still loading. Please wait a moment.", false);
                    return;
                }

                updateBackground(targetIsNight ? 'Night' : 'Day');
                startCrossfade(targetIsNight);
            } else if (event.code === 'Enter') {
                event.preventDefault();
                toggleAddOn();
            }
        });

        // --- INITIALIZATION SEQUENCE ---
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Element lookups
            pad = document.getElementById('audioPad');
            indicator = document.getElementById('mouseIndicator');
            messageBox = document.getElementById('messageBox');
            bgLayer1 = document.getElementById('bgLayer1');
            bgLayer2 = document.getElementById('bgLayer2');
            currentBgLayer = bgLayer1;
            nextBgLayer = bgLayer2;
            labelTL = document.getElementById('labelTL');
            labelTR = document.getElementById('labelTR');
            labelBL = document.getElementById('labelBL');
            labelBR = document.getElementById('labelBR');
            labels = [labelTL, labelTR, labelBL, labelBR];

            iconTL = document.getElementById('iconTL');
            iconTR = document.getElementById('iconTR');
            iconBL = document.getElementById('iconBL');
            iconBR = document.getElementById('iconBR');

            addOnIcons = {
                'TL': iconTL,
                'TR': iconTR,
                'BL': iconBL,
                'BR': iconBR
            };
            
            ['TL', 'TR', 'BL', 'BR'].forEach(key => {
                const icon = addOnIcons[key];
                if (icon) {
                    icon.addEventListener('click', toggleAddOn);
                }
            });


            if (pad) {
                pad.addEventListener('mouseenter', handleMouseEnter);
                pad.addEventListener('mouseleave', handleMouseLeave);
            }


            // 2. Load all audio files asynchronously
            const daySuccess = await loadInitialAudio();
            if (!daySuccess) return;

            // Load and START Night Audio SILENTLY
            const nightSuccess = await loadNightAudio();
            if (!nightSuccess) return;

            const sfxSuccess = await loadSfxAudio();
            if (!sfxSuccess) showMessage("SFX failed to load, button features for Cabin and Ranger Station will be disabled.", true);
            
            const addOnSuccess = await loadAddOnAudio(); 
            if (!addOnSuccess) return;

        });

        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mousedown', initializeAudio);
        document.addEventListener('touchstart', initializeAudio);
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd);
    </script>
</body>
</html>
