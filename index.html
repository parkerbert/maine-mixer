<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allagash Ambience</title> 
    <link rel="icon" type="image/png" href="favicon.png"> 
    
    <style>
        /* (Styles omitted for brevity, assumed to be the same as before) */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            font-family: 'Arial', sans-serif;
            cursor: none;
            color: #C2E2CC; 
        }
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2; 
            transition: opacity 3.0s ease-in-out !important; 
        }
        .bg-current { opacity: 1; }
        .bg-next { opacity: 0; }
        h1, h2 { font-family: 'Garamond', 'Times New Roman', serif; color: #C2E2CC; }
        .container {
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            background-color: rgba(30, 45, 60, 0.85); 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: -1; 
        }
        #audioPad {
            width: 700px; 
            height: 700px; 
            border: 2px solid #79C2A8;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3); 
            box-shadow: 0 0 15px #79C2A8;
            margin: 0;
            border-radius: 5px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .pad-label {
            position: absolute;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #79C2A8;
            font-size: 0.9em;
            border-radius: 3px;
            transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
            pointer-events: none;
        }
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }
        .active-glow {
            box-shadow: 0 0 10px #C2E2CC;
            background-color: rgba(194, 232, 204, 0.2);
            color: white;
        }
        #mouseIndicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #C2E2CC;
            box-shadow: 0 0 10px #C2E2CC;
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 1000;
        }
        #explanationBox {
            position: fixed;
            top: 250px; 
            left: 250px; 
            padding: 15px;
            background-color: rgba(30, 45, 60, 0.85); 
            border: 2px solid #79C2A8; 
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
            color: #C2E2CC;
            text-align: left;
            line-height: 1.4;
            z-index: 5;
        }
        #explanationBox p { white-space: nowrap; margin: 0; }
        .message-box {
            border: 1px solid #FF5555;
            background-color: rgba(255, 85, 85, 0.1);
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    
    <div id="bgLayer1" class="bg-layer bg-current"></div>
    <div id="bgLayer2" class="bg-layer bg-next"></div>

    <div id="mouseIndicator"></div>

    <div id="explanationBox">
        <p>
            SPACEBAR&nbsp;-&nbsp;Toggle between day&nbsp;and&nbsp;night<br>
            ENTER&nbsp;-&nbsp;Toggle character&nbsp;interaction
        </p>
    </div>
    <div class="container">
        <h1>Allagash Ambience</h1>
        <h2>An Audio Journey</h2> 
        
        <div id="messageBox" class="message-box"></div> 
        
        <div class="controls-and-pad">
            <div id="audioPad">
                <div id="labelTL" class="pad-label top-left">The Cabin</div> 
                <div id="labelTR" class="pad-label top-right">The Forest</div>
                <div id="labelBL" class="pad-label bottom-left">The Lake</div>
                <div id="labelBR" class="pad-label bottom-right">The Storm</div> 
            </div>
        </div>
            
    </div>
    
    <script>
        // Set up references to DOM elements
        let pad = null;
        let indicator = null; 
        let messageBox = null;
        
        // Web Audio API and State variables
        let audioContext = null;
        let gainMap = {}; // Tracks GAIN NODES for ambience tracks (Web Audio)
        let audioBuffers = {}; // Stores all 16 audio buffers
        let isPlaying = false; 
        let audioReady = false; 
        let nightAudioLoaded = false; 
        let addOnAudioLoaded = false; 
        let audioInitiated = false; 
        let mouseInPad = false;
        let lastMouseX = 0; 
        let lastMouseY = 0;
        
        // NEW: Add-On Player Map (HTML5 Audio Elements)
        let addOnPlayerMap = {}; // Key: AddOnKey (e.g., 'TL_Day_AddOn'), Value: <audio> element
        let addOnFadeInterval = null; // Tracks the interval for the simple HTML5 linear fade
        let activeAddOnKey = null; // Key for the currently playing add-on (e.g., 'TL_Day_AddOn')
        let activeAddOnName = null; // Tracks the name of the currently active add-on (e.g., 'Cabin')

        // Mapping of corner keys to human-readable names
        const cornerNames = {
            'TL': 'Cabin',
            'TR': 'Forest',
            'BL': 'Lake',
            'BR': 'Storm' // UPDATED for visual consistency
        };

        // Mapped Add-On files (8 total, 4 Day + 4 Night)
        const addOnFilePaths = {
            TL_Day_AddOn: 'audio/Cabin_Day_AddOn.wav',    
            TL_Night_AddOn: 'audio/Cabin_Night_AddOn.wav',    
            TR_Day_AddOn: 'audio/Forest_Day_AddOn.wav',   
            TR_Night_AddOn: 'audio/Forest_Night_AddOn.wav',   
            BL_Day_AddOn: 'audio/Lake_Day_AddOn.wav',     
            BL_Night_AddOn: 'audio/Lake_Night_AddOn.wav',     
            BR_Day_AddOn: 'audio/RangerStation_Day_AddOn.wav', // Keeping the original file name
            BR_Night_AddOn: 'audio/RangerStation_Night_AddOn.wav' // Keeping the original file name
        };

        // FILE PATHS: Mapped to all 8 core ambience audio files
        const audioFilePaths = {
            TL_Day: 'audio/Cabin_Day.wav',
            TR_Day: 'audio/Forest_Day.wav',
            BL_Day: 'audio/Lake_Day.wav',
            BR_Day: 'audio/RangerStation_Day.wav', // Keeping the original file name
            TL_Night: 'audio/Cabin_Night.wav',
            TR_Night: 'audio/Forest_Night.wav',
            BL_Night: 'audio/Lake_Night.wav',
            BR_Night: 'audio/RangerStation_Night.wav' // Keeping the original file name
        };
        
        // Split keys for loading
        const initialAudioKeys = ['TL_Day', 'TR_Day', 'BL_Day', 'BR_Day'];
        const nightAudioKeys = ['TL_Night', 'TR_Night', 'BL_Night', 'BR_Night'];
        const addOnAudioKeys = Object.keys(addOnFilePaths); // 8 keys

        // Core constants 
        const FADE_BUFFER_DISTANCE = 150; 
        const ISOLATION_BUFFER_SIZE = 0.333; 
        const MINIMUM_GAIN = 0.0001;
        const RAMP_TIME = 0.05; // Web Audio Ramp Time (fast)
        const FADE_TIME_TOGGLE = 2.0; // Web Audio Crossfade Time (slow)
        const ADDON_FADE_STEP = 0.02; // Volume step for HTML5 audio fade
        const ADDON_FADE_INTERVAL_MS = 50; // Interval for HTML5 audio fade loop (50ms = 20 steps/sec)
        
        // (Other helper functions like showMessage, loadAudioFile, getRandomBackground are omitted but assumed present and correct)

        function connectAndStartAmbienceSource(key, initialGain = 1.0) {
            const buffer = audioBuffers[key];
            const source = audioContext.createBufferSource();
            const gain = audioContext.createGain();

            source.buffer = buffer;
            source.loop = true;
            
            gain.gain.setValueAtTime(initialGain, audioContext.currentTime); 
            source.connect(gain);
            gain.connect(audioContext.destination);

            gainMap[key] = gain; 
            source.start(0); 
        }

        async function loadAddOnAudio() {
            if (addOnAudioLoaded) return true;

            showMessage("Loading Add-On audio files (8/8 Add-Ons)... Please wait.", false);
            
            // 1. Load Buffers (Still needed for the total file count and data integrity check)
            const bufferPromises = addOnAudioKeys.map(key => 
                loadAudioFile(addOnFilePaths[key], key)
            );
            const bufferResults = await Promise.all(bufferPromises);
            const successfulLoads = bufferResults.filter(r => r && r.success).length;

            if (successfulLoads === addOnAudioKeys.length) {
                // 2. Create HTML5 Audio Elements (Instead of Web Audio Source Nodes)
                addOnAudioKeys.forEach(key => {
                    const audio = new Audio(addOnFilePaths[key]);
                    audio.loop = true;
                    audio.volume = 0.0; // Start muted
                    addOnPlayerMap[key] = audio;
                });

                addOnAudioLoaded = true;
                showMessage("All 16 audio files loaded. System ready!", false);
                return true; 
            } else {
                showMessage(`ERROR: Failed to load Add-On audio files.`, true);
                return false;
            }
        }
        
        function initializeAudio() {
            // (Web Audio Ambience initialize logic unchanged)
            if (!audioInitiated && audioReady) {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        audioInitiated = true;
                        showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                        setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                    });
                } else if (audioContext && audioContext.state === 'running') {
                    audioInitiated = true;
                    showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                    setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                }
            }
        }

        // NEW: HTML5 Audio Fade Function
        function fadeHtml5Audio(audioElement, targetVolume, durationMs) {
            const currentVolume = audioElement.volume;
            const diff = targetVolume - currentVolume;
            const steps = durationMs / ADDON_FADE_INTERVAL_MS;
            const stepVolume = diff / steps;
            
            if (addOnFadeInterval) clearInterval(addOnFadeInterval);

            // If we are fading a *different* track out, we need a special handler
            if (audioElement !== addOnPlayerMap[activeAddOnKey] && audioElement.volume > 0) {
                 // For immediate shut-off of the old track:
                 audioElement.volume = 0;
                 audioElement.pause();
                 return;
            }

            addOnFadeInterval = setInterval(() => {
                let newVolume = currentVolume + stepVolume;

                if ((stepVolume > 0 && newVolume >= targetVolume) || (stepVolume < 0 && newVolume <= targetVolume)) {
                    audioElement.volume = targetVolume;
                    clearInterval(addOnFadeInterval);
                    addOnFadeInterval = null;
                    
                    if (targetVolume < MINIMUM_GAIN) {
                        audioElement.pause();
                    }
                } else {
                    audioElement.volume = newVolume;
                }
            }, ADDON_FADE_INTERVAL_MS);
        }
        
        function updateAudioGains(event) {
            if (!audioReady || !isPlaying || !pad) return; 
            // (Calculation of masterVolume, baseGains, dayMix, nightMix... - UNCHANGED)

            const now = audioContext.currentTime;
            
            // --- 1. SPATIAL GAIN CALCULATION (UNCHANGED) ---
            // ... (xToRight, yToTop, baseGains calculated here) ...
            
            // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION (UNCHANGED) ---
            const dayMix = equalPowerGain(crossfadePosition, true);
            const nightMix = equalPowerGain(crossfadePosition, false);
            const ambienceMixes = { Day: dayMix, Night: nightMix };

            // Update Ambience Gains (Web Audio API - UNCHANGED)
            Object.keys(audioFilePaths).forEach(key => { 
                // ... (Ambience gain update logic using gainMap and rampToValueAtTime) ...
            });
            
            // --- 3. ADD-ON GAIN/VOLUME CALCULATION (NEW HTML5 AUDIO LOGIC) ---
            if (activeAddOnKey) {
                const corner = activeAddOnKey.substring(0, 2); 
                const mode = activeAddOnKey.includes('_Night') ? 'Night' : 'Day'; 
                
                const currentAddOn = addOnPlayerMap[activeAddOnKey];

                const modeMix = ambienceMixes[mode];
                const modeBase = baseGains[corner];
                
                const maxAddOnVolume = 0.5; // Cap add-on volume at 50%
                
                // Calculate Web Audio style target gain
                const targetWebGain = Math.max(
                    MINIMUM_GAIN, 
                    modeBase * masterVolume * modeMix * maxAddOnVolume 
                );
                
                // HTML5 volume is 0.0 to 1.0, so the targetWebGain is the target volume.
                const targetHtmlVolume = targetWebGain; 
                
                // Use a simple immediate assignment for responsiveness:
                currentAddOn.volume = targetHtmlVolume;
            }

            updateVisualGlow(calculatedGains, masterVolume);
        }

        // --- Add-On Toggle Function (ENTER key - HEAVILY MODIFIED) ---
        async function toggleAddOn() {
            initializeAudio(); 
            
            if (!audioReady || !mouseInPad || !addOnAudioLoaded) {
                // (Error messages omitted but assumed present)
                if (!mouseInPad) showMessage("Please move your cursor over the audio pad to select a region.", false);
                return;
            }
            
            const rect = pad.getBoundingClientRect();
            let x = (lastMouseX - rect.left) / rect.width;
            let y = (lastMouseY - rect.top) / rect.height;
            const currentCornerKey = getCurrentCorner(x, y); 
            const currentAddOnName = cornerNames[currentCornerKey]; 
            
            const isCurrentlyDay = (crossfadePosition < 0.5);
            const currentMode = isCurrentlyDay ? 'Day' : 'Night';
            const newAddOnKey = `${currentCornerKey}_${currentMode}_AddOn`;
            
            const newAddOnElement = addOnPlayerMap[newAddOnKey];

            // --- TOGGLE LOGIC ---
            if (activeAddOnName === currentAddOnName) {
                // CASE 1: Add-on is already active -> TURN OFF
                activeAddOnName = null;
                activeAddOnKey = null;
                
                // Stop the active HTML5 audio element
                newAddOnElement.pause();
                newAddOnElement.volume = 0.0;
                
                showMessage(`${currentAddOnName} add-on turned OFF.`, false);
                
            } else {
                // CASE 2: Add-on is not active or new add-on selected -> TURN ON (and stop old one)
                
                // 2a. Stop the previously active add-on (if any)
                if (activeAddOnKey && addOnPlayerMap[activeAddOnKey]) {
                    const oldAddOn = addOnPlayerMap[activeAddOnKey];
                    oldAddOn.pause();
                    oldAddOn.volume = 0.0;
                }
                
                activeAddOnName = currentAddOnName;
                activeAddOnKey = newAddOnKey;
                
                // 2b. Start the new HTML5 audio element
                newAddOnElement.volume = MINIMUM_GAIN; // Start near mute
                newAddOnElement.play().catch(e => {
                    showMessage(`Error playing add-on: ${e.message}.`, true);
                    console.error("HTML5 Audio Play Error:", e);
                }); 
                
                // 2c. Force an immediate gain update (which sets volume based on mouse position)
                updateAudioGains({ forceFade: true, clientX: lastMouseX, clientY: lastMouseY }); 
                
                showMessage(`${currentAddOnName} add-on turned ON.`, false);
            }
        }
        
        // (Other functions omitted for brevity: handleMouseMove, toggleDayNight, etc.)

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); 
                initializeAudio(); 
                toggleDayNight();
            } else if (event.code === 'Enter') {
                event.preventDefault(); 
                toggleAddOn(); 
            }
        });

        // (Final DOMContentLoaded and event listeners omitted for brevity)
    </script>
    
</body>
</html>
