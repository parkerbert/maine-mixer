<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Soundscape</title> 
    
    <style>
        /* --- General Layout and Background --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            font-family: 'Arial', sans-serif;
            cursor: none;
            color: #C2E2CC; 
            
            /* UPDATED: Add a transition for a smooth fade effect on background-image */
            transition: background-image 1.5s ease-in-out; 
            
            /* The initial background will be set by JavaScript in loadAllAudioFiles */
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        h1 {
            font-size: 3.5em;
            font-family: 'Garamond', 'Times New Roman', serif; 
            color: #C2E2CC;
            text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
            margin-bottom: 50px; 
        }

        /* --- Main Container (The dark background box) --- */
        .container {
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            background-color: rgba(30, 45, 60, 0.8); 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* --- Audio Pad --- */
        #audioPad {
            width: 700px; 
            height: 700px; 
            border: 2px solid #79C2A8;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3); 
            box-shadow: 0 0 15px #79C2A8;
            margin: 0;
            border-radius: 5px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
