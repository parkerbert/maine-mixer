<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allagash Ambience</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* --- CORE STYLES (Unchanged) --- */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    cursor: none;
    color: #C2E2CC;
}
/* --- BACKGROUND LAYERS (Unchanged) --- */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: -2;
    transition: opacity 3.0s ease-in-out !important;
}
.bg-current { opacity: 1; }
.bg-next { opacity: 0; }
/* --- TITLE STYLES (Restored) */
h1 {
    font-size: 3.0em; 
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #C2E2CC;
    text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
    margin-bottom: 5px;
}
h2 {
    font-size: 1.2em;
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #AACCB8;
    text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
    margin-top: 0;
    margin-bottom: 10px;
}
/* --- CONTENT CONTAINER (MODIFIED FOR CENTERING) ---
The container is now explicitly set to a max-width and centered.
*/
.container {
    /* Existing resets */
    padding: 0;

    /* FIX: Set max width and center the container */
    width: 100%;
    max-width: 800px;
    margin: 0 auto;

    /* Layout properties for grid */
    display: grid;
    /* This creates a single column layout */
    grid-template-areas:
        "title"
        "mixpad";
    /* Place the title and mix pad in their respective areas */
}

.centered-title {
    /* 1. Center the text horizontally within its grid area */
    text-align: center;
    /* 2. Assign it to the 'title' area */
    grid-area: title;
    /* Ensure it fills the new container width */
    width: 100%;
    /* Optional: Give it some spacing above the mix pad */
    margin-bottom: 15px;
}

.mix-pad {
    /* Assign it to the 'mixpad' area */
    grid-area: mixpad;
    /* Ensure the mix pad takes up the full width of the container (max-width/margin handled by parent) */
    width: 100%;
}
/* --- Audio Pad and Controls (All Margins Adjusted) --- */
#audioPad {
    /* Set to 70vh for better vertical scaling on laptops */
    width: min(70vh, 80vw);
    height: min(70vh, 80vw);

    max-width: 700px;
    max-height: 700px;

    border: 2px solid #79C2A8;
    position: relative;
    background-color: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 15px #79C2A8;
    margin: 20px auto; /* Centered with a margin */
    border-radius: 5px;
    transition: box-shadow 0.3s, border-color 0.3s;
    /* Allow clicks inside the pad, but not on the pad itself to avoid interfering with mousemove */
    pointer-events: all;
}

/* ADDED: Class for dynamic mixpad border glow */
.pad-active-glow {
    /* More intense box-shadow when the cursor is inside */
    box-shadow: 0 0 25px #C2E2CC, 0 0 50px rgba(194, 232, 204, 0.2);
    border-color: #C2E2CC !important;
}

/* --- PAD LABELS (Text) --- */
.pad-label {
    position: absolute;
    padding: 8px 12px;
    background-color: rgba(0, 0, 0, 0.8);
    border: 1px solid #79C2A8;
    font-size: 0.9em;
    border-radius: 3px;
    transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
    /* Added to allow the click to propagate up to the audioPad element */
    pointer-events: none;
    z-index: 1; /* Keep labels above large icons */
}
.top-left { top: 15px; left: 15px; }
.top-right { top: 15px; right: 15px; }
.bottom-left { bottom: 15px; left: 15px; }
.bottom-right { bottom: 15px; right: 15px; }
.active-glow {
    box-shadow: 0 0 10px #C2E2CC;
    background-color: rgba(194, 232, 204, 0.2);
    color: white;
}

/* --- NEW: LARGE ADDON ICONS (SVG) --- */
.addon-icon {
    position: absolute;
    width: 200px; /* Much larger */
    height: 200px; /* Much larger */
    color: #C2E2CC;
    /* Set stroke property for the line drawing SVGs */
    stroke: currentColor;
    stroke-width: 1.5; /* Default line thickness for a finer look */
    fill: none; /* Ensure no fill, just stroke */

    opacity: 0.15; /* Much dimmer when inactive for stronger contrast */
    transition: opacity 0.5s, box-shadow 0.5s;
    /* IMPORTANT: Allow the icon itself to be clicked */
    pointer-events: all;
    padding: 10px;
    cursor: pointer;
}
/* Positioning to center them visually within their quadrants */
.top-left-icon { top: 25%; left: 25%; transform: translate(-50%, -50%); }
.top-right-icon { top: 25%; right: 25%; transform: translate(50%, -50%); }
.bottom-left-icon { bottom: 25%; left: 25%; transform: translate(-50%, 50%); }
.bottom-right-icon { bottom: 25%; right: 25%; transform: translate(50%, 50%); }

/* The new glow class for activated AddOns (Enhanced Effect) */
.icon-active-glow {
    opacity: 1.0; /* Full visibility */
    background-color: rgba(194, 232, 204, 0.05); /* Very light background/container glow */
    box-shadow: 
        0 0 10px rgba(194, 232, 204, 0.6), /* Inner glow */
        0 0 30px rgba(194, 232, 204, 0.4); /* Outer halo */
    border-radius: 10px;
}

/* --- CURSOR INDICATOR (Unchanged) --- */
#mouseIndicator {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #C2E2CC;
    box-shadow: 0 0 10px #C2E2CC;
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 1000;
}
/* Explanation Box - RESPONSIVE POSITIONING (Unchanged) */
#explanationBox {
    position: fixed;
    top: 5vh;
    left: 5vw;
    padding: 15px;
    background-color: rgba(30, 45, 60, 0.85);
    border: 2px solid #79C2A8;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    font-family: 'Arial', sans-serif;
    font-size: 0.9em;
    color: #C2E2CC;
    text-align: left;
    line-height: 1.4;
    z-index: 5;
    pointer-events: none;
}
#explanationBox p {
    white-space: nowrap;
    margin: 0;
}
.message-box {
    /* Kept for element definition, but will remain hidden */
    border: 1px solid #FF5555;
    background-color: rgba(255, 85, 85, 0.1);
    color: white;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 5px;
    display: none;
}
</style>
</head>

<script>
// Set up references to DOM elements
let pad = null;
let indicator = null;
let messageBox = null;
// Background Layer References
let bgLayer1 = null;
let bgLayer2 = null;
let currentBgLayer = null;
let nextBgLayer = null;
let labelTL = null;
let labelTR = null;
let labelBL = null;
let labelBR = null;
let labels = [];

// NEW: Icon references and map
let iconTL, iconTR, iconBL, iconBR;
let addOnIcons = {};

// State variables
let lastDayImages = [];
let lastNightImages = [];
// Equal Power Crossfade State
let crossfadePosition = 0.0;
let isCrossfading = false;
// Web Audio API and State variables
let audioContext = null;
let gainMap = {}; // Tracks GAIN NODES for ambience tracks
let audioBuffers = {};
let isPlaying = false;
let audioReady = false;
let nightAudioLoaded = false;
let addOnAudioLoaded = false;
let sfxLoaded = false;
let audioInitiated = false;
let mouseInPad = false;
let lastMouseX = 0; // Last known X position of the mouse/touch
let lastMouseY = 0; // Last known Y position of the mouse/touch

// Map to track the state of all 8 AddOns (key: 'TL_Day_AddOn', value: {source, gain, active})
let addOnStateMap = {};

// Mapping of corner keys to human-readable names
const cornerNames = {
    'TL': 'Cabin',
    'TR': 'Forest',
    'BL': 'Lake',
    'BR': 'RangerStation'
};

// --- SFX DEFINITIONS (40 total files: 20 Cabin + 20 Ranger Station) ---
const sfxFilePaths = {
    // --- CABIN (TL) SFX ---
    // 5 DAY ON SFX VARIATIONS
    Cabin_Day_ButtonOn_AddOn_1: 'audio/Cabin_Day_ButtonOn_AddOn_01.ogg',

    Cabin_Day_ButtonOn_AddOn_4: 'audio/Cabin_Day_ButtonOn_AddOn_04.ogg',
    Cabin_Day_ButtonOn_AddOn_5: 'audio/Cabin_Day_ButtonOn_AddOn_05.ogg',
    // 5 DAY OFF SFX VARIATIONS
    Cabin_Day_ButtonOff_AddOn_1: 'audio/Cabin_Day_ButtonOff_AddOn_01.ogg',
    Cabin_Day_ButtonOff_AddOn_2: 'audio/Cabin_Day_ButtonOff_AddOn_02.ogg',
    Cabin_Day_ButtonOff_AddOn_3: 'audio/Cabin_Day_ButtonOff_AddOn_03.ogg',
    Cabin_Day_ButtonOff_AddOn_4: 'audio/Cabin_Day_ButtonOff_AddOn_04.ogg',
    Cabin_Day_ButtonOff_AddOn_5: 'audio/Cabin_Day_ButtonOff_AddOn_05.ogg',

    // 5 NIGHT ON SFX VARIATIONS
    Cabin_Night_ButtonOn_AddOn_1: 'audio/Cabin_Night_ButtonOn_AddOn_01.ogg',
    Cabin_Night_ButtonOn_AddOn_2: 'audio/Cabin_Night_ButtonOn_AddOn_02.ogg',
    Cabin_Night_ButtonOn_AddOn_3: 'audio/Cabin_Night_ButtonOn_AddOn_03.ogg',
    Cabin_Night_ButtonOn_AddOn_4: 'audio/Cabin_Night_ButtonOn_AddOn_04.ogg',
    Cabin_Night_ButtonOn_AddOn_5: 'audio/Cabin_Night_ButtonOn_AddOn_05.ogg',
    // 5 NIGHT OFF SFX VARIATIONS
    Cabin_Night_ButtonOff_AddOn_1: 'audio/Cabin_Night_ButtonOff_AddOn_01.ogg',
    Cabin_Night_ButtonOff_AddOn_2: 'audio/Cabin_Night_ButtonOff_AddOn_02.ogg',
    Cabin_Night_ButtonOff_AddOn_3: 'audio/Cabin_Night_ButtonOff_AddOn_03.ogg',
    Cabin_Night_ButtonOff_AddOn_4: 'audio/Cabin_Night_ButtonOff_AddOn_04.ogg',
    Cabin_Night_ButtonOff_AddOn_5: 'audio/Cabin_Night_ButtonOff_AddOn_05.ogg',

    // --- RANGER STATION (BR) SFX ---
    // 5 DAY ON SFX VARIATIONS
    RangerStaion_Day_ButtonOn_AddOn_1: 'audio/RangerStaion_Day_ButtonOn_AddOn_01.ogg',
    RangerStaion_Day_ButtonOn_AddOn_2: 'audio/RangerStaion_Day_ButtonOn_AddOn_02.ogg',
    RangerStaion_Day_ButtonOn_AddOn_3: 'audio/RangerStaion_Day_ButtonOn_AddOn_03.ogg',
    RangerStaion_Day_ButtonOn_AddOn_4: 'audio/RangerStaion_Day_ButtonOn_AddOn_04.ogg',
    RangerStaion_Day_ButtonOn_AddOn_5: 'audio/RangerStaion_Day_ButtonOn_AddOn_05.ogg',
    // 5 DAY OFF SFX VARIATIONS
    RangerStaion_Day_ButtonOff_AddOn_1: 'audio/RangerStaion_Day_ButtonOff_AddOn_01.ogg',
    RangerStaion_Day_ButtonOff_AddOn_2: 'audio/RangerStaion_Day_ButtonOff_AddOn_02.ogg',

    RangerStaion_Day_ButtonOff_AddOn_4: 'audio/RangerStaion_Day_ButtonOff_AddOn_04.ogg',
    RangerStaion_Day_ButtonOff_AddOn_5: 'audio/RangerStaion_Day_ButtonOff_AddOn_05.ogg',
    
    // 5 NIGHT ON SFX VARIATIONS
    RangerStaion_Night_ButtonOn_AddOn_1: 'audio/RangerStaion_Night_ButtonOn_AddOn_01.ogg',
    RangerStaion_Night_ButtonOn_AddOn_2: 'audio/RangerStaion_Night_ButtonOn_AddOn_02.ogg',
    RangerStaion_Night_ButtonOn_AddOn_3: 'audio/RangerStaion_Night_ButtonOn_AddOn_03.ogg',
    RangerStaion_Night_ButtonOn_AddOn_4: 'audio/RangerStaion_Night_ButtonOn_AddOn_04.ogg',
    RangerStaion_Night_ButtonOn_AddOn_5: 'audio/RangerStaion_Night_ButtonOn_AddOn_05.ogg',
    // 5 NIGHT OFF SFX VARIATIONS
    RangerStaion_Night_ButtonOff_AddOn_1: 'audio/RangerStaion_Night_ButtonOff_AddOn_01.ogg',
    RangerStaion_Night_ButtonOff_AddOn_2: 'audio/RangerStaion_Night_ButtonOff_AddOn_02.ogg',
    RangerStaion_Night_ButtonOff_AddOn_3: 'audio/RangerStaion_Night_ButtonOff_AddOn_03.ogg',
    RangerStaion_Night_ButtonOff_AddOn_4: 'audio/RangerStaion_Night_ButtonOff_AddOn_04.ogg',
    RangerStaion_Night_ButtonOff_AddOn_5: 'audio/RangerStaion_Night_ButtonOff_AddOn_05.ogg',
};

const allSfxKeys = Object.keys(sfxFilePaths);

// Define keys for specific SFX variations
const buttonCabinDayOnKeys = allSfxKeys.filter(k => k.startsWith('Cabin_Day_ButtonOn'));
const buttonCabinDayOffKeys = allSfxKeys.filter(k => k.startsWith('Cabin_Day_ButtonOff'));
const buttonCabinNightOnKeys = allSfxKeys.filter(k => k.startsWith('Cabin_Night_ButtonOn'));
const buttonCabinNightOffKeys = allSfxKeys.filter(k => k.startsWith('Cabin_Night_ButtonOff'));
const buttonRangerDayOnKeys = allSfxKeys.filter(k => k.startsWith('RangerStaion_Day_ButtonOn'));
const buttonRangerDayOffKeys = allSfxKeys.filter(k => k.startsWith('RangerStaion_Day_ButtonOff'));
const buttonRangerNightOnKeys = allSfxKeys.filter(k => k.startsWith('RangerStaion_Night_ButtonOn'));
const buttonRangerNightOffKeys = allSfxKeys.filter(k => k.startsWith('RangerStaion_Night_ButtonOff'));


// --- AUDIO FILES (8 Ambience tracks + 4 Add-On tracks) ---
const audioFilePaths = {
    // Ambience
    TL_Day: 'audio/Cabin_Day_Ambience.ogg',
    TR_Day: 'audio/Forest_Day_Ambience.ogg',
    BL_Day: 'audio/Lake_Day_Ambience.ogg',
    BR_Day: 'audio/RangerStaion_Day_Ambience.ogg',
    TL_Night: 'audio/Cabin_Night_Ambience.ogg',
    TR_Night: 'audio/Forest_Night_Ambience.ogg',
    BL_Night: 'audio/Lake_Night_Ambience.ogg',
    BR_Night: 'audio/RangerStaion_Night_Ambience.ogg',
    // Add-Ons (These are mode-specific but share a key for the icon)
    TL_Day_AddOn: 'audio/Cabin_Day_AddOn.ogg',
    TL_Night_AddOn: 'audio/Cabin_Night_AddOn.ogg',
    TR_Day_AddOn: 'audio/Forest_Day_AddOn.ogg',
    TR_Night_AddOn: 'audio/Forest_Night_AddOn.ogg',
    BL_Day_AddOn: 'audio/Lake_Day_AddOn.ogg',
    BL_Night_AddOn: 'audio/Lake_Night_AddOn.ogg',
    BR_Day_AddOn: 'audio/RangerStaion_Day_AddOn.ogg',
    BR_Night_AddOn: 'audio/RangerStaion_Night_AddOn.ogg',
};

// All keys for ambience and add-on tracks
const dayAudioKeys = ['TL_Day', 'TR_Day', 'BL_Day', 'BR_Day'];
const nightAudioKeys = ['TL_Night', 'TR_Night', 'BL_Night', 'BR_Night'];
const addOnAudioKeys = ['TL_Day_AddOn', 'TL_Night_AddOn', 'TR_Day_AddOn', 'TR_Night_AddOn', 'BL_Day_AddOn', 'BL_Night_AddOn', 'BR_Day_AddOn', 'BR_Night_AddOn'];

// --- BACKGROUND IMAGES ---
const dayImages = [
    'img/day_1.jpg',
    'img/day_2.jpg',
    'img/day_3.jpg',
    'img/day_4.jpg',
];
const nightImages = [
    'img/night_1.jpg',
    'img/night_2.jpg',
    'img/night_3.jpg',
    'img/night_4.jpg',
];

// --- CONSTANTS ---
const MINIMUM_GAIN = 0.001; // Avoid setting gain to absolute zero to prevent audio context sleep/glitches
const RAMP_TIME = 0.05; // Quick ramp for mouse movement
const CROSSFADE_RAMP_TIME = 3.0; // Slow ramp for Day/Night crossfade
const ISOLATION_BUFFER_SIZE = 0.05; // Buffer around the 0.5 point for isolation (5%)
const FADE_BUFFER_DISTANCE = 100; // Distance buffer for cursor indicator opacity fade
const LABEL_GLOW_THRESHOLD = 0.8; // NEW: Threshold for corner text to reach 'full glow' (0.0 to 1.0)
const FADE_TIME_TOGGLE = 2.0;
const FADE_TIME_ADDON_STOP = 1.0;
const BACKGROUND_FADE_DELAY = 3000;
const MAX_ADDON_VOLUME = 1.0;
const CABINET_ADDON_DELAY = 0.5; // Constant for the 0.5 second delay

// --- Helper Functions (Console logging only) ---
function showMessage(text, isError = false) {
    const prefix = isError ? '[ERROR]' : '[Status]';
    // Only log to console, do not modify the DOM messageBox
    console.log(`${prefix} ${text}`);
}

function playSfx(key) {
    if (!audioContext || !sfxLoaded) return;
    const buffer = audioBuffers[key];
    if (!buffer) {
        console.warn(`SFX buffer not found for key: ${key}`);
        return;
    }

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start(0);
}

async function loadAudioFile(url, key) {
    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`HTTP error ${response.status}`);
        }
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[key] = audioBuffer;
    } catch (error) {
        console.error(`ERROR loading audio file ${url}: `, error);
        showMessage(`Failed to load audio file: ${url}. Check console for details.`, true);
        return { key, success: false, error: error.message };
    }
    return { key, success: true };
}

// --- Core Ambience Start Function (Unchanged) --
function connectAndStartAmbienceSource(key, initialGain = 1.0) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();

    source.buffer = buffer;
    source.loop = true;
    source.connect(gain);
    gain.connect(audioContext.destination);

    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.start(0);

    // Store the gain node and source for later manipulation
    gainMap[key] = gain;
    // (We don't need to store the source, as it loops indefinitely)
}

// --- Add-On Audio Start Function ---
function connectAndStartAddOnSource(key, initialGain = MINIMUM_GAIN) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();

    source.buffer = buffer;
    source.loop = true;
    source.connect(gain);
    gain.connect(audioContext.destination);

    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.start(0);

    // Track the state for this Add-On (key, source, gain, and active status)
    addOnStateMap[key] = {
        source: source, // Source is needed for potential stopping, though we rely on gain for now
        gain: gain,
        active: false, // Starts inactive
    };
}


// --- Audio Loading Functions (Unchanged) ---
async function loadInitialAudio() {
    if (audioReady) return true;
    showMessage("Loading Day ambiance audio files (4/8 Ambience)... Please wait.", false);

    const loadPromises = dayAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key));
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === dayAudioKeys.length) {
        // Only connect and start the Day tracks (Night tracks are loaded later)
        dayAudioKeys.forEach(key => connectAndStartAmbienceSource(key));
        audioReady = true;
        isPlaying = true;
        showMessage('Day ambiance audio ready! You can now mix. ', false);
        return true;
    } else {
        showMessage('CRITICAL ERROR: Failed to load Day ambiance audio files. Site non-functional. ', true);
        return false;
    }
}

async function loadNightAudio() {
    if (nightAudioLoaded) return true;
    showMessage("Loading Night ambiance audio files (4/8 Ambience)... Please wait.", false);
    const loadPromises = nightAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key) );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === nightAudioKeys.length) {
        nightAudioKeys.forEach(key => connectAndStartAmbienceSource(key, MINIMUM_GAIN));
        nightAudioLoaded = true;
        showMessage("Night ambiance loaded!", false);
        return true;
    } else {
        showMessage('ERROR: Failed to load Night ambiance files. Cannot switch mode.', true);
        return false;
    }
}

async function loadAddOnAudio() {
    if (addOnAudioLoaded) return true;
    showMessage(`Loading Add-on audio files (${addOnAudioKeys.length} total)...`, false);
    const loadPromises = addOnAudioKeys.map(key => loadAudioFile(audioFilePaths[key], key) );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === addOnAudioKeys.length) {
        // Connect and start Add-On tracks at MINIMUM_GAIN (off)
        addOnAudioKeys.forEach(key => connectAndStartAddOnSource(key, MINIMUM_GAIN));
        addOnAudioLoaded = true;
        showMessage("Add-on audio loaded.", false);
        return true;
    } else {
        showMessage('ERROR: Failed to load Add-on audio files. Add-on features disabled.', true);
        return false;
    }
}

async function loadSfxAudio() {
    if (sfxLoaded) return true;
    // allSfxKeys now contains the 40 mode-specific SFX keys
    showMessage(`Loading SFX audio files (${allSfxKeys.length} total)...`, false);
    const loadPromises = allSfxKeys.map(key => {
        const url = sfxFilePaths[key];
        return loadAudioFile(url, key);
    });
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;

    if (successfulLoads === allSfxKeys.length) {
        sfxLoaded = true;
        showMessage("SFX loaded.", false);
        return true;
    } else {
        showMessage(`SFX loading complete. WARNING: ${allSfxKeys.length - successfulLoads} files failed.`, true);
        // The rest of the site should still function, just without SFX
        return false;
    }
}

function getCurrentCorner(x, y) {
    if (x < 0.5) {
        return y < 0.5 ? 'TL' : 'BL';
    } else {
        return y < 0.5 ? 'TR' : 'BR';
    }
}

// --- Background Image Logic (Unchanged) ---
function getRandomBackground(mode) {
    const allImages = mode === 'Day' ? dayImages : nightImages;
    let lastImages = mode === 'Day' ? lastDayImages : lastNightImages;

    // Logic for selecting a new random image...
    const newImage = allImages.filter(img => !lastImages.includes(img))[0] || allImages[0];

    if (mode === 'Day') {
        lastDayImages.push(newImage);
        if (lastDayImages.length > 3) lastDayImages.shift();
    } else {
        lastNightImages.push(newImage);
        if (lastNightImages.length > 3) lastNightImages.shift();
    }
    return `url('${newImage}')`;
}

function updateBackground(mode) {
    const newBackgroundURL = getRandomBackground(mode);
    nextBgLayer.style.backgroundImage = newBackgroundURL;

    currentBgLayer.classList.remove('bg-current');
    currentBgLayer.classList.add('bg-next');

    nextBgLayer.classList.remove('bg-next');
    nextBgLayer.classList.add('bg-current');

    setTimeout(() => {
        const temp = currentBgLayer;
        currentBgLayer = nextBgLayer;
        nextBgLayer = temp;
        nextBgLayer.style.backgroundImage = 'none';
    }, BACKGROUND_FADE_DELAY);
}

// --- Audio Gain Logic (Unchanged) ---
function equalPowerGain(position, isDay) {
    const angle = position * 0.5 * Math.PI;
    return isDay ? Math.cos(angle) : Math.sin(angle);
}
function applyIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 0; }
    if (p >= 1 - buffer) { return 1; }
    return (p - buffer) / (1 - 2 * buffer);
}
function applyOppositeIsolation(p) {
    const buffer = ISOLATION_BUFFER_SIZE;
    if (p <= buffer) { return 1; }
    if (p >= 1 - buffer) { return 0; }
    return (1 - p - buffer) / (1 - 2 * buffer);
}
function getIsolatedGain(baseGain) {
    return Math.max(MINIMUM_GAIN, baseGain);
}

// --- Core Gain Update Function (MODIFIED for Proximity Label Glow) ---
function updateAudioGains({ x, y, forceFade = false }) {
    if (!audioContext || !audioReady) return;
    
    // Determine which mode (Day or Night) is currently active/dominant
    const isDayMode = crossfadePosition < 0.5;
    const currentMode = isDayMode ? 'Day' : 'Night';

    // Normalized coordinates of the cursor within the pad (0 to 1)
    const xToLeft = applyOppositeIsolation(x);
    const xToRight = applyIsolation(x);
    const yToTop = applyOppositeIsolation(y);
    const yToBottom = applyIsolation(y);

    // Base gain for each corner. A value of 1 means cursor is exactly in the corner.
    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };

    // --- NEW: 1. Proximity-Based Label Glow Update ---
    labels.forEach(label => {
        const corner = label.getAttribute('data-corner');
        // baseGains[corner] is 1.0 when the cursor is exactly on that corner
        const proximity = baseGains[corner]; 

        if (proximity > LABEL_GLOW_THRESHOLD) {
            // If close enough, apply the full glow class
            label.classList.add('active-glow');
        } else {
            // Otherwise, remove it (it will use the base CSS transition)
            label.classList.remove('active-glow');
        }
    });
    
    // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION ---
    const dayMix = equalPowerGain(crossfadePosition, true);
    const nightMix = equalPowerGain(crossfadePosition, false);
    const ambienceMixes = { Day: dayMix, Night: nightMix };

    const now = audioContext.currentTime;
    const rampDuration = forceFade ? CROSSFADE_RAMP_TIME : RAMP_TIME;

    ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
        const dayKey = `${cornerKey}_Day`;
        const nightKey = `${cornerKey}_Night`;

        // Final target gain for each Day and Night track
        const dayTargetGain = getIsolatedGain(baseGains[cornerKey]) * dayMix;
        const nightTargetGain = getIsolatedGain(baseGains[cornerKey]) * nightMix;

        if (gainMap[dayKey]) {
            gainMap[dayKey].gain.linearRampToValueAtTime(dayTargetGain, now + rampDuration);
        }
        if (gainMap[nightKey]) {
            gainMap[nightKey].gain.linearRampToValueAtTime(nightTargetGain, now + rampDuration);
        }
    });

    // --- 3. ADD-ON GAIN CALCULATION ---
    addOnAudioKeys.forEach(addOnKey => {
        const state = addOnStateMap[addOnKey];

        if (state && state.gain) {
            const corner = addOnKey.substring(0, 2); // e.g., 'TL'
            const mode = addOnKey.includes('_Night') ? 'Night' : 'Day';
            const modeMix = ambienceMixes[mode];
            const modeBase = getIsolatedGain(baseGains[corner]);
            let target = MINIMUM_GAIN;

            // Only calculate a non-zero target if the user has explicitly turned the add-on ON
            if (state.active) {
                // Modulated by mouse position (modeBase) and Day/Night mix (modeMix)
                if (modeMix > MINIMUM_GAIN) {
                    target = modeBase * modeMix * MAX_ADDON_VOLUME;
                }
            }
            // The gain is updated spatially on every updateAudioGains call.
            state.gain.gain.linearRampToValueAtTime(target, now + rampDuration);
        }
    });
}

// --- Crossfade Logic (Unchanged) ---
function startCrossfade(targetIsNight) {
    isCrossfading = true;
    const targetPosition = targetIsNight ? 1.0 : 0.0;
    const initialPosition = crossfadePosition;
    const startTime = audioContext.currentTime;
    const duration = CROSSFADE_RAMP_TIME;

    // Use AudioContext's value ramping for smoother transition
    // Set a temporary gain node to control all gains during the crossfade
    const tempGain = audioContext.createGain();
    tempGain.gain.setValueAtTime(0, startTime);
    tempGain.gain.linearRampToValueAtTime(1, startTime + duration);

    // Instead of directly setting crossfadePosition, we'll use a listener/loop
    function crossfadeLoop() {
        const elapsed = audioContext.currentTime - startTime;
        let progress = Math.min(1, elapsed / duration);

        crossfadePosition = initialPosition + (targetPosition - initialPosition) * progress;

        // Force a gain update with a long ramp time (the full crossfade time)
        updateAudioGains({ x: lastMouseX, y: lastMouseY, forceFade: true });

        if (progress < 1) {
            requestAnimationFrame(crossfadeLoop);
        } else {
            crossfadePosition = targetPosition; // Ensure it lands exactly on 0.0 or 1.0
            isCrossfading = false;
            updateAudioGains({ x: lastMouseX, y: lastMouseY, forceFade: false }); // Final state update
            showMessage(targetIsNight ? "Switched to Night Mode." : "Switched to Day Mode.", false);
        }
    }
    crossfadeLoop();
}

async function toggleDayNight() {
    if (!audioReady || isCrossfading) return;
    initializeAudio();

    const isCurrentlyDay = (crossfadePosition < 0.5);
    const targetIsNight = isCurrentlyDay;

    if (targetIsNight && !nightAudioLoaded) {
        showMessage("Night audio is still loading. Please wait a moment.", false);
        return;
    }

    // Force a visual update *before* the fade starts
    updateBackground(targetIsNight ? 'Night' : 'Day');
    startCrossfade(targetIsNight);
}

// --- UPDATED Add-On Toggle Function ---
// Accepts an optional cornerKey, which is passed when an icon is clicked.
// If not passed, it defaults to using the current mouse position (for 'Enter' keypress).
async function toggleAddOn(eventOrCornerKey) {
    initializeAudio();
    if (!audioReady || !addOnAudioLoaded) {
        if (!addOnAudioLoaded) showMessage("Add-on audio files are still loading or failed to load.", true);
        return;
    }

    let currentCornerKey;
    // --- 1. DETERMINE CORNER KEY ---
    if (typeof eventOrCornerKey === 'string') {
        // If a string (the corner key) was passed, use it directly (e.g., from a click listener)
        currentCornerKey = eventOrCornerKey;
    } else {
        // If an event object (or nothing) was passed (e.g., from 'Enter' keypress), 
        // calculate based on the last known mouse position.
        const rect = pad.getBoundingClientRect();
        let x = (lastMouseX - rect.left) / rect.width;
        let y = (lastMouseY - rect.top) / rect.height;
        
        currentCornerKey = getCurrentCorner(x, y);

        // Also check if the click/tap event originated from a specific icon
        if (eventOrCornerKey && eventOrCornerKey.target && eventOrCornerKey.target.closest('.addon-icon')) {
            // If the click was on the icon, use its specific corner key
            currentCornerKey = eventOrCornerKey.target.closest('.addon-icon').getAttribute('data-corner');
        }
    }
    
    // Safety check: must have a corner key
    if (!currentCornerKey) return;
    
    // Determine the current mode (Day/Night)
    const isDayMode = crossfadePosition < 0.5;
    const currentMode = isDayMode ? 'Day' : 'Night';

    const addOnKey = `${currentCornerKey}_${currentMode}_AddOn`;
    const state = addOnStateMap[addOnKey];

    // Safety check: must have a state object
    if (!state) return;

    // The icon element associated with this corner (for visual glow)
    const iconElement = addOnIcons[currentCornerKey];
    if (!iconElement) return;

    // Get human-readable name for logging
    const currentAddOnName = cornerNames[currentCornerKey];

    // Check if this is a SFX-driven Add-On (Cabin/TL or Ranger Station/BR)
    const isSFXAddOn = (currentCornerKey === 'TL' || currentCornerKey === 'BR');
    const isCabinAddOn = (currentCornerKey === 'TL');
    const isRangerAddOn = (currentCornerKey === 'BR');

    // For instant toggle, we need to manually calculate the base gain for the current mouse position
    const rect = pad.getBoundingClientRect();
    const x = (lastMouseX - rect.left) / rect.width;
    const y = (lastMouseY - rect.top) / rect.height;

    const xToLeft = applyOppositeIsolation(x);
    const xToRight = applyIsolation(x);
    const yToTop = applyOppositeIsolation(y);
    const yToBottom = applyIsolation(y);

    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };
    const currentBaseGain = getIsolatedGain(baseGains[currentCornerKey]);

    // --- TOGGLE LOGIC ---

    // Scenario 1: Add-on is ALREADY active. TURN OFF.
    if (state.active) {
        state.active = false; // Mark state as OFF

        // 1. Play OFF SFX if Cabin or Ranger Station Add-On
        if (isSFXAddOn && sfxLoaded) {
            let offKeys;
            if (isCabinAddOn) {
                offKeys = currentMode === 'Day' ? buttonCabinDayOffKeys : buttonCabinNightOffKeys;
            } else if (isRangerAddOn) {
                offKeys = currentMode === 'Day' ? buttonRangerDayOffKeys : buttonRangerNightOffKeys;
            }
            if (offKeys) {
                const randomKey = offKeys[Math.floor(Math.random() * offKeys.length)];
                playSfx(randomKey);
            }
        }

        // 2. Explicitly ramp the gain down (no delay)
        if (state.gain) {
            if (isRangerAddOn) {
                // *** Instant cut for Ranger Station (BR) ***
                state.gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
            } else {
                // Standard 1.0s fade for Cabin (TL) and others
                state.gain.gain.linearRampToValueAtTime(MINIMUM_GAIN, audioContext.currentTime + FADE_TIME_ADDON_STOP);
            }
        }
        // NEW: Remove the glowing class
        iconElement.classList.remove('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned OFF.`, false);
    }
    // Scenario 2: Add-on is currently inactive. TURN ON.
    else {
        state.active = true; // Mark state as ON

        // 1. Play ON SFX if Cabin or Ranger Station Add-On
        if (isSFXAddOn && sfxLoaded) {
            let onKeys;
            if (isCabinAddOn) {
                onKeys = currentMode === 'Day' ? buttonCabinDayOnKeys : buttonCabinNightOnKeys;
            } else if (isRangerAddOn) {
                onKeys = currentMode === 'Day' ? buttonRangerDayOnKeys : buttonRangerNightOnKeys;
            }
            if (onKeys) {
                const randomKey = onKeys[Math.floor(Math.random() * onKeys.length)];
                playSfx(randomKey);
            }
        }

        // 2. Explicitly ramp the gain up (with optional delay for Cabin)
        const dayNightMix = ambienceMixes[currentMode] || (currentMode === 'Day' ? equalPowerGain(crossfadePosition, true) : equalPowerGain(crossfadePosition, false));
        let targetGain = currentBaseGain * dayNightMix * MAX_ADDON_VOLUME;
        targetGain = Math.max(MINIMUM_GAIN, targetGain); // Ensure minimum gain is met

        if (state.gain) {
            if (isCabinAddOn) {
                // *** 0.5s delay for Cabin (TL) ***
                state.gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime); // Ensure it's off at start
                state.gain.gain.linearRampToValueAtTime(targetGain, audioContext.currentTime + CABINET_ADDON_DELAY + RAMP_TIME);
            } else if (isRangerAddOn) {
                 // *** Instant on for Ranger Station (BR) ***
                state.gain.gain.setValueAtTime(targetGain, audioContext.currentTime);
            } else {
                // Non-SFX (TR, BL) ramp up instantly via the regular updateAudioGains logic.
            }
        }

        // This ensures non-SFX Add-Ons (TR, BL) ramp up instantly via the regular updateAudioGains logic.
        updateAudioGains({ forceFade: true });

        // NEW: Add the glowing class
        iconElement.classList.add('icon-active-glow');

        showMessage(`${currentAddOnName} ${currentMode} add-on turned ON.`, false);
    }
}

function handleMouseMove(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();
    const cursorX = event.clientX;
    const cursorY = event.clientY;

    // NOTE: lastMouseX and lastMouseY are set here, even if outside the pad,
    // which is necessary for the instant toggle logic in toggleAddOn.
    lastMouseX = event.clientX;
    lastMouseY = event.clientY;

    const isOutsideX = cursorX < rect.left || cursorX > rect.right;
    const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

    if (isOutsideX || isOutsideY) {
        // Mouse is outside the pad, handle visual fade
        const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
        const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

        const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));
        let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
        opacity = Math.min(1, Math.max(0, opacity));

        if (opacity > 0) {
            indicator.style.left = `${cursorX}px`;
            indicator.style.top = `${cursorY}px`;
            indicator.style.opacity = opacity;
        } else {
            indicator.style.opacity = 0;
        }
        
    } else {
        // Mouse is inside the pad, full indicator opacity
        indicator.style.left = `${cursorX}px`;
        indicator.style.top = `${cursorY}px`;
        indicator.style.opacity = 1;

        // Calculate normalized coordinates (0 to 1) for the audio logic
        const x = (cursorX - rect.left) / rect.width;
        const y = (cursorY - rect.top) / rect.height;

        // Update all audio gains based on the new position
        updateAudioGains({ x, y });
    }
}

function handleTouchMove(event) {
    if (event.touches.length > 0) {
        handleMouseMove(event.touches[0]);
        // Prevent default to stop scrolling
        event.preventDefault(); 
    }
}

function handleTouchEnd(event) {
    if (event.touches.length === 0) {
        // When the last touch lifts, treat it like mouseleave to dim the indicator
        indicator.style.opacity = 0;
        // Also call handleMouseLeave to remove mixpad border glow and label glows
        handleMouseLeave();
    }
}

// --- New Handlers for Mixpad Border Glow (MODIFIED) ---
function handleMouseEnter() {
    mouseInPad = true;
    // NEW: Intensify the mixpad border glow
    if (pad) {
        pad.classList.add('pad-active-glow');
    }
}

function handleMouseLeave() {
    mouseInPad = false;
    // NEW: Dim the mixpad border glow
    if (pad) {
        pad.classList.remove('pad-active-glow');
    }
    // Also remove the glow from the labels immediately
    labels.forEach(label => label.classList.remove('active-glow'));
}

// --- AudioContext Initialization (Unchanged) ---
function initializeAudio() {
    if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume().then(() => {
            console.log('AudioContext resumed successfully');
            audioInitiated = true;
        });
    } else if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioInitiated = true;
    } else if (audioContext && audioContext.state === 'running') {
        audioInitiated = true;
    }
}

// --- Keyboard Event Listener (Unchanged) ---
document.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
        event.preventDefault();
        initializeAudio();
        toggleDayNight();
    } else if (event.code === 'Enter' || event.code === 'NumpadEnter') {
        event.preventDefault();
        // Call toggleAddOn without arguments. It will use the last mouse position.
        toggleAddOn();
    }
});

// --- INITIALIZATION SEQUENCE ---
document.addEventListener('DOMContentLoaded', async () => {
    // 1. Element lookups
    pad = document.getElementById('audioPad');
    indicator = document.getElementById('mouseIndicator');
    messageBox = document.getElementById('messageBox'); // Kept for reference, but won't display.
    bgLayer1 = document.getElementById('bgLayer1');
    bgLayer2 = document.getElementById('bgLayer2');

    labelTL = document.getElementById('labelTL');
    labelTR = document.getElementById('labelTR');
    labelBL = document.getElementById('labelBL');
    labelBR = document.getElementById('labelBR');
    labels = [labelTL, labelTR, labelBL, labelBR]; // Populate the labels array

    iconTL = document.getElementById('iconTL');
    iconTR = document.getElementById('iconTR');
    iconBL = document.getElementById('iconBL');
    iconBR = document.getElementById('iconBR');

    // NEW: Populate the icon map (all elements are referenced correctly now)
    addOnIcons = {
        'TL': iconTL,
        'TR': iconTR,
        'BL': iconBL,
        'BR': iconBR
    };

    if (pad) {
        pad.addEventListener('mouseenter', handleMouseEnter);
        pad.addEventListener('mouseleave', handleMouseLeave);
        // NEW: Add click listener to the audioPad element (from previous response).
        pad.addEventListener('click', toggleAddOn); 
    }

    // 2. Load all audio files asynchronously
    const daySuccess = await loadInitialAudio();
    if (!daySuccess) return;

    const nightSuccess = await loadNightAudio();
    if (!nightSuccess) return;
    
    const addOnSuccess = await loadAddOnAudio();
    if (!addOnSuccess) return;

    // Load the specific SFX files (now 40 total)
    const sfxSuccess = await loadSfxAudio();
    if (!sfxSuccess) showMessage("SFX failed to load, button features for Cabin and Ranger Station will be disabled.", true);
});

// Global listener for movement (mouse and touch)
document.addEventListener('mousemove', handleMouseMove);

// Initial click/tap listener to unlock AudioContext
document.addEventListener('mousedown', initializeAudio);
document.addEventListener('touchstart', initializeAudio);

// Touch-specific listeners
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);
</script>
