<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allagash Ambience</title> 
    
    <link rel="icon" type="image/png" href="favicon.png"> 
    
    <style>
        /* --- CORE STYLES --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            font-family: 'Arial', sans-serif;
            cursor: none;
            color: #C2E2CC; 
        }

        /* --- BACKGROUND LAYERS --- */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2; 
            
            /* IMAGE FADE TIME SET TO 3.0 SECONDS */
            transition: opacity 3.0s ease-in-out !important; 
        }

        /* Initial state classes */
        .bg-current {
            opacity: 1; 
        }
        .bg-next {
            opacity: 0; 
        }

        /* --- TITLE STYLES --- */
        h1 {
            /* Title: Allagash Ambience (Title Case) */
            font-size: 3.5em; 
            font-family: 'Garamond', 'Times New Roman', serif; 
            color: #C2E2CC;
            text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
            margin-bottom: 5px; 
        }
        
        /* --- SUBTITLE STYLES --- */
        h2 {
            /* Subtitle: An Audio Journey */
            font-size: 1.5em; 
            font-family: 'Garamond', 'Times New Roman', serif; 
            color: #AACCB8; 
            text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
            margin-top: 0;
            margin-bottom: 50px; 
        }

        /* --- CONTENT CONTAINER --- */
        .container {
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            background-color: rgba(30, 45, 60, 0.85); 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: -1; 
        }

        /* --- Audio Pad and Controls --- */
        #audioPad {
            width: 700px; 
            height: 700px; 
            border: 2px solid #79C2A8;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3); 
            box-shadow: 0 0 15px #79C2A8;
            margin: 0;
            border-radius: 5px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .pad-label {
            position: absolute;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #79C2A8;
            font-size: 0.9em;
            border-radius: 3px;
            transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
            pointer-events: none;
        }

        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }

        .active-glow {
            box-shadow: 0 0 10px #C2E2CC;
            background-color: rgba(194, 232, 204, 0.2);
            color: white;
        }

        #mouseIndicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #C2E2CC;
            box-shadow: 0 0 10px #C2E2CC;
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 1000;
        }

        #dayNightToggle {
            position: absolute;
            top: 390px; 
            right: -250px; 

            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            
            background-color: #79C2A8; 
            color: #111;
            
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            z-index: 10; 
        }

        #dayNightToggle:disabled {
            cursor: wait;
            background-color: #555;
            color: #aaa;
        }

        .night-mode-active {
            background-color: #4A567D !important;
            color: #C2E2CC !important;
        }

        .message-box {
            border: 1px solid #FF5555;
            background-color: rgba(255, 85, 85, 0.1);
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    
    <div id="bgLayer1" class="bg-layer bg-current"></div>
    <div id="bgLayer2" class="bg-layer bg-next"></div>

    <div id="mouseIndicator"></div>

    <div class="container">
        <h1>Allagash Ambience</h1>
        <h2>An Audio Journey</h2> 
        
        <div id="messageBox" class="message-box"></div> 
        
        <div class="controls-and-pad">
            <div id="audioPad">
                <div id="labelTL" class="pad-label top-left">The Cabin</div>
                <div id="labelTR" class="pad-label top-right">The Forest</div>
                <div id="labelBL" class="pad-label bottom-left">The Lake</div>
                <div id="labelBR" class="pad-label bottom-right">The Storm</div>
            </div>
        </div>
        
        <button id="dayNightToggle" disabled>
            Day
        </button>
            
    </div>
    
    <script>
        // Set up references to DOM elements
        let pad = null;
        let indicator = null; 
        let messageBox = null;
        let toggleButton = null;
        
        // Background Layer References
        let bgLayer1 = null; 
        let bgLayer2 = null;
        let currentBgLayer = null; 
        let nextBgLayer = null; 

        let labelTL = null;
        let labelTR = null;
        let labelBL = null;
        let labelBR = null;
        let labels = []; 

        // State variables
        let lastDayImages = []; 
        let lastNightImages = []; 
        
        // Equal Power Crossfade State
        // 0.0 = Full Day, 1.0 = Full Night.
        let crossfadePosition = 0.0;
        let isCrossfading = false;
        
        // Web Audio API and State variables
        let audioContext = null;
        let gainMap = {};
        let audioBuffers = {};
        let isPlaying = false; 
        let audioReady = false; 
        let audioInitiated = false; 
        let mouseInPad = false;
        let lastMouseX = 0; 
        let lastMouseY = 0;

        // FILE PATHS: Mapped to all 8 audio files (Verified paths)
        const audioFilePaths = {
            TL_Day: 'audio/Cabin_Day.wav',
            TR_Day: 'audio/Forest_Day.wav',
            BL_Day: 'audio/Lake_Day.wav',
            BR_Day: 'audio/Storm_Day.wav', 
            TL_Night: 'audio/Cabin_Night.wav',
            TR_Night: 'audio/Forest_Night.wav',
            BL_Night: 'audio/Lake_Night.wav',
            BR_Night: 'audio/Storm_Night.wav' 
        };
        
        // Background Image Arrays (Verified paths)
        const dayBackgrounds = [
            'images/Woods_Day_1.jpg',
            'images/Woods_Day_2.jpg',
            'images/Woods_Day_3.jpg',
            'images/Woods_Day_4.jpg',
            'images/Woods_Day_5.jpg'
        ];
        
        const nightBackgrounds = [
            'images/Woods_Night_1.jpg',
            'images/Woods_Night_2.jpg',
            'images/Woods_Night_3.jpg',
            'images/Woods_Night_4.jpg',
            'images/Woods_Night_5.jpg'
        ];
        
        // Core constants 
        const FADE_BUFFER_DISTANCE = 150; 
        const ISOLATION_BUFFER_SIZE = 0.333; 
        const MINIMUM_GAIN = 0.0001;
        const RAMP_TIME = 0.05;

        // AUDIO DAY/NIGHT CROSSFADE TIME SET TO 3.0 SECONDS
        const FADE_TIME_TOGGLE = 3.0;

        // BACKGROUND FADE DELAY SET TO 3000ms (3.0s)
        const BACKGROUND_FADE_DELAY = 3000; 

        // --- Helper Functions ---
        
        function showMessage(text, isError = false) {
            if (!messageBox) return;
            messageBox.textContent = text;
            messageBox.style.display = 'block';
            messageBox.style.backgroundColor = isError ? 'rgba(255, 0, 0, 0.1)' : 'rgba(121, 194, 168, 0.1)';
            messageBox.style.borderColor = isError ? '#FF5555' : '#79C2A8';
            console.log(`[Status] ${text}`); 
        }

        async function loadAudioFile(url, key) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                audioBuffers[key] = audioBuffer;
            } catch (error) {
                console.error(`ERROR loading audio file ${url}:`, error);
                showMessage(`Failed to load audio file: ${url}. Check console for details.`, true); 
                return { key, success: false, error: error.message }; 
            }
            return { key, success: true };
        }
        
        // --- Image Background Functions ---

        function getRandomBackground(mode) {
            const allImages = mode === 'Day' ? dayBackgrounds : nightBackgrounds;
            const lastImages = mode === 'Day' ? lastDayImages : lastNightImages;
            
            const validImages = allImages.filter(img => !lastImages.includes(img));
            
            const selectionPool = validImages.length > 0 ? validImages : allImages;
            
            const randomIndex = Math.floor(Math.random() * selectionPool.length);
            const selectedImage = selectionPool[randomIndex];
            
            lastImages.push(selectedImage);
            if (lastImages.length > 2) {
                lastImages.shift(); 
            }
            
            if (mode === 'Day') {
                lastDayImages = lastImages;
            } else {
                lastNightImages = lastImages;
            }
            
            return `url('${selectedImage}')`;
        }

        function setRandomBackground(mode) {
            const newBackgroundURL = getRandomBackground(mode);
            
            // 1. Load the new image into the 'next' layer
            nextBgLayer.style.backgroundImage = newBackgroundURL;
            
            // 2. Trigger the CSS fade:
            currentBgLayer.classList.remove('bg-current');
            currentBgLayer.classList.add('bg-next');

            nextBgLayer.classList.remove('bg-next');
            nextBgLayer.classList.add('bg-current');

            // 3. Swap the layer references for the next fade after the transition is complete
            setTimeout(() => {
                const temp = currentBgLayer;
                currentBgLayer = nextBgLayer;
                nextBgLayer = temp;

                // Cleanup
                nextBgLayer.style.backgroundImage = 'none';
                
            }, BACKGROUND_FADE_DELAY); 
        }
        
        // --- Audio Gain Logic (Equal Power) ---

        function applyIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 0; } 
            if (p >= 1 - buffer) { return 1; }
            return (p - buffer) / (1 - 2 * buffer);
        }
        function applyOppositeIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE;
            if (p <= buffer) { return 1; }
            if (p >= 1 - buffer) { return 0; }
            return 1 - ((p - buffer) / (1 - 2 * buffer));
        }

        function equalPowerGain(p, isSignal1) {
            // Equal-power crossfade: Day Gain = cos(p * PI/2), Night Gain = sin(p * PI/2)
            if (isSignal1) {
                return Math.cos(p * 0.5 * Math.PI);
            } else {
                return Math.sin(p * 0.5 * Math.PI);
            }
        }

        function updateAudioGains(event) {
            if (!audioReady || !isPlaying || !pad) return; 

            const rect = pad.getBoundingClientRect();
            
            if (!event.forceFade) {
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
            }
            
            let x = (lastMouseX - rect.left) / rect.width;
            let y = (lastMouseY - rect.top) / rect.height;
            
            const rampDuration = event.forceFade ? FADE_TIME_TOGGLE : RAMP_TIME;

            // --- Master Volume Fade-out Logic (Mouse Proximity) ---
            let distanceToPad = 0;
            let clampedX = x;
            let clampedY = y;
            
            if (x < 0) { clampedX = 0; distanceToPad = Math.max(distanceToPad, -x); }
            if (x > 1) { clampedX = 1; distanceToPad = Math.max(distanceToPad, x - 1); }
            if (y < 0) { clampedY = 0; distanceToPad = Math.max(distanceToPad, -y); }
            if (y > 1) { clampedY = 1; distanceToPad = Math.max(distanceToPad, y - 1); }
            
            let normalizedDistance = 0;
            if (distanceToPad > 0) {
                const pixelDistance = Math.sqrt(Math.pow(lastMouseX - (rect.left + clampedX * rect.width), 2) + Math.pow(lastMouseY - (rect.top + clampedY * rect.height), 2));
                normalizedDistance = Math.min(1, pixelDistance / FADE_BUFFER_DISTANCE);
            }
            const masterVolume = 1 - normalizedDistance; 
            
            x = Math.min(1, Math.max(0, x));
            y = Math.min(1, Math.max(0, y));

            // --- 1. SPATIAL GAIN CALCULATION ---
            const xToRight = applyIsolation(x); 
            const xToLeft = applyOppositeIsolation(x);
            const yToBottom = applyIsolation(y); 
            const yToTop = applyOppositeIsolation(y);

            const baseGains = {
                TL: xToLeft * yToTop,     
                TR: xToRight * yToTop,   
                BL: xToLeft * yToBottom, 
                BR: xToRight * yToBottom 
            };
            
            const calculatedGains = [
                baseGains.TL, 
                baseGains.TR, 
                baseGains.BL, 
                baseGains.BR  
            ];

            const now = audioContext.currentTime;
            
            // --- 2. EQUAL POWER CROSSFADE CALCULATION ---
            
            // crossfadePosition is the value between 0 (Day) and 1 (Night)
            const dayMix = equalPowerGain(crossfadePosition, true);
            const nightMix = equalPowerGain(crossfadePosition, false);
            
            ['TL', 'TR', 'BL', 'BR'].forEach(corner => {
                const baseGain = baseGains[corner];
                
                // Ramp the volume of the DAY mode tracks
                const dayKey = corner + '_Day';
                const dayTarget = Math.max(MINIMUM_GAIN, baseGain * masterVolume * dayMix);
                if (gainMap[dayKey]) {
                    gainMap[dayKey].gain.exponentialRampToValueAtTime(dayTarget, now + rampDuration);
                }

                // Ramp the volume of the NIGHT mode tracks
                const nightKey = corner + '_Night';
                const nightTarget = Math.max(MINIMUM_GAIN, baseGain * masterVolume * nightMix); 
                if (gainMap[nightKey]) {
                    gainMap[nightKey].gain.exponentialRampToValueAtTime(nightTarget, now + rampDuration);
                }
            });

            updateVisualGlow(calculatedGains, masterVolume);
        }

        // --- Crossfade Animator ---
        
        function crossfadeModes(targetMode) {
            if (isCrossfading) return; 

            isCrossfading = true;
            const startTime = audioContext.currentTime;
            const duration = FADE_TIME_TOGGLE;
            
            const startPosition = crossfadePosition;
            const endPosition = (targetMode === 'Night') ? 1.0 : 0.0;
            const distance = endPosition - startPosition;

            const animate = () => {
                const now = audioContext.currentTime;
                const elapsed = now - startTime;

                if (elapsed >= duration) {
                    crossfadePosition = endPosition;
                    isCrossfading = false;
                    updateAudioGains({ forceFade: true }); 
                    return;
                }

                let t = elapsed / duration;
                
                crossfadePosition = startPosition + distance * t;

                updateAudioGains({ forceFade: true }); 
                
                requestAnimationFrame(animate);
            };

            requestAnimationFrame(animate);
        }
        
        // --- Day/Night Toggle Function ---
        function toggleDayNight() {
            if (!audioReady) return;
            
            initializeAudio();

            // Determine the new mode based on the current crossfade position
            const targetMode = (crossfadePosition < 0.5) ? 'Night' : 'Day';
            const isTargetDay = (targetMode === 'Day');
            
            // 1. Update UI and Image
            if (isTargetDay) {
                toggleButton.textContent = 'Day'; 
                toggleButton.classList.remove('night-mode-active');
                setRandomBackground('Day');
            } else {
                toggleButton.textContent = 'Night'; 
                toggleButton.classList.add('night-mode-active');
                setRandomBackground('Night');
            }
            
            // 2. Start the Equal Power Audio Crossfade
            crossfadeModes(targetMode);
        }

        // --- Initialization and Event Handlers ---
        
        async function loadAllAudioFiles() {
            if (audioReady) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            currentBgLayer.style.backgroundImage = getRandomBackground('Day');

            const loadPromises = Object.keys(audioFilePaths).map(key => 
                loadAudioFile(audioFilePaths[key], key)
            );

            const results = await Promise.all(loadPromises);
            
            const successfulLoads = results.filter(r => r && r.success).length;
            const totalFiles = Object.keys(audioFilePaths).length;

            if (successfulLoads === totalFiles) {
                audioReady = true;
                
                if (toggleButton) {
                    toggleButton.disabled = false;
                }
                showMessage(`All ${totalFiles} audio files loaded! Click the toggle or the pad to begin.`);

                // Initialize all 8 source nodes and connect them
                Object.keys(audioBuffers).forEach(key => {
                    const buffer = audioBuffers[key];
                    const source = audioContext.createBufferSource();
                    const gain = audioContext.createGain();

                    source.buffer = buffer;
                    source.loop = true;
                    // Initial Day mode: Night tracks start at MINIMUM_GAIN (near silent)
                    const isNightTrack = key.includes('_Night');
                    gain.gain.setValueAtTime(isNightTrack ? MINIMUM_GAIN : 1.0, audioContext.currentTime); 
                    source.connect(gain);
                    gain.connect(audioContext.destination);

                    gainMap[key] = gain; 
                    source.start(0); 
                });
                isPlaying = true;
            } else {
                showMessage(`CRITICAL ERROR: Only ${successfulLoads} of ${totalFiles} audio files loaded successfully. Check file names/format!`, true);
            }
        }
        
        function updateVisualGlow(gains, masterVolume) {
            
            // 1. Pad Border Glow 
            if (masterVolume > 0.1) {
                pad.style.boxShadow = '0 0 15px #79C2A8, 0 0 30px #79C2A8'; 
                pad.style.borderColor = '#C2E2CC';
            } else {
                pad.style.boxShadow = '0 0 15px #79C2A8'; 
                pad.style.borderColor = '#79C2A8';
            }
            
            // 2. Corner Label Glow 
            if (!mouseInPad || !labels) { 
                labels.forEach(label => label.classList.remove('active-glow'));
                return;
            }
            
            const maxGain = Math.max(...gains);
            labels.forEach(label => label.classList.remove('active-glow'));
            
            if (maxGain > 0.60) { 
                const maxIndex = gains.indexOf(maxGain);
                if (labels[maxIndex]) {
                    labels[maxIndex].classList.add('active-glow');
                }
            }
        }
        
        function initializeAudio() {
            if (!audioInitiated && audioReady) {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        audioInitiated = true;
                        showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                        setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                    });
                } else if (audioContext && audioContext.state === 'running') {
                    audioInitiated = true;
                    showMessage("Audio engaged! Start mixing by moving your cursor.", false);
                    setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                }
            }
        }
        
        function handleMouseEnter() { mouseInPad = true; }
        function handleMouseLeave() { 
            mouseInPad = false; 
            labels.forEach(label => label.classList.remove('active-glow')); 
            pad.style.boxShadow = '0 0 15px #79C2A8'; 
            pad.style.borderColor = '#79C2A8';
        }

        function handleMouseMove(event) {
            if (!indicator || !pad) return; 

            // 1. Position the Indicator
            indicator.style.left = `${event.clientX}px`;
            indicator.style.top = `${event.clientY}px`;
            
            const rect = pad.getBoundingClientRect();
            const cursorX = event.clientX;
            const cursorY = event.clientY;

            // 2. Determine visibility based on proximity to the pad
            const isOutsideX = cursorX < rect.left || cursorX > rect.right;
            const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

            if (isOutsideX || isOutsideY) {
                const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
                const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

                const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));

                let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
                opacity = Math.min(1, Math.max(0, opacity)); 

                if (opacity > 0) {
                    indicator.style.opacity = opacity.toFixed(2);
                } else {
                    indicator.style.opacity = '0'; 
                }
            } else {
                indicator.style.opacity = '0.8';
            }

            // 3. Update audio gains if ready
            if (audioReady && isPlaying) {
                // Do not set forceFade to true on regular mouse move
                updateAudioGains({ clientX: event.clientX, clientY: event.clientY, forceFade: false });
            }
        }
        
        function handleTouchMove(event) {
            event.preventDefault(); 
            const touch = event.touches[0];
            const syntheticEvent = { clientX: touch.clientX, clientY: touch.clientY, forceFade: false };
            handleMouseMove(syntheticEvent); 
            initializeAudio(); 
            mouseInPad = true; 
        }

        function handleTouchEnd(event) {
            const rect = pad.getBoundingClientRect();
            const syntheticEvent = { clientX: rect.left - FADE_BUFFER_DISTANCE * 2, clientY: rect.top - FADE_BUFFER_DISTANCE * 2, forceFade: false };
            handleMouseMove(syntheticEvent); 
            mouseInPad = false;
            handleMouseLeave(); 
        }
        
        // --- Event Listeners and Initialization ---
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); 
                initializeAudio(); 
                toggleDayNight();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            // 1. ASSIGN DOM elements
            pad = document.getElementById('audioPad');
            indicator = document.getElementById('mouseIndicator');
            messageBox = document.getElementById('messageBox');
            toggleButton = document.getElementById('dayNightToggle');

            // Assign new background layers
            bgLayer1 = document.getElementById('bgLayer1');
            bgLayer2 = document.getElementById('bgLayer2');
            currentBgLayer = bgLayer1; 
            nextBgLayer = bgLayer2;
            
            labelTL = document.getElementById('labelTL');
            labelTR = document.getElementById('labelTR');
            labelBL = document.getElementById('labelBL');
            labelBR = document.getElementById('labelBR');
            labels = [labelTL, labelTR, labelBL, labelBR]; 
            
            // Attach button click listener
            if (toggleButton) toggleButton.addEventListener('click', toggleDayNight);
            
            // Pad-specific mouse listeners for the glow state
            if (pad) {
                pad.addEventListener('mouseenter', handleMouseEnter);
                pad.addEventListener('mouseleave', handleMouseLeave);
            }
            
            // 2. START LOADING Audio and setting Initial Image LAST
            showMessage("Loading audio files...");
            loadAllAudioFiles();
        });
        
        // Global listener for movement (mouse and touch)
        document.addEventListener('mousemove', handleMouseMove);

        // Initial click/tap listener to unlock AudioContext
        document.addEventListener('mousedown', initializeAudio);
        document.addEventListener('touchstart', initializeAudio);
        
        // Touch-specific listeners
        document.addEventListener('touchmove', handleTouchMove, { passive: false });
        document.addEventListener('touchend', handleTouchEnd);
    </script>
    
</body>
</html>
