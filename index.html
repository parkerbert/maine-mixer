<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maine Mixer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS for Dark Wilderness Theme --- */
        body {
            font-family: 'Montserrat', sans-serif; 
            background-color: #1a1a1a;
            cursor: none; 
            
            /* BACKGROUND PATH: Relative path to file in repo root */
            background-image: url('Woods.jpg'); 
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #d4d4d4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            background: rgba(30, 40, 40, 0.6); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            max-width: 90%;
            backdrop-filter: blur(5px);
        }

        h1 {
            /* Maine Mixer Title Styling */
            font-family: 'Cinzel', serif; 
            font-size: 4em;
            color: #C2E8CC; 
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 
                0 0 5px rgba(194, 232, 204, 0.7),
                0 0 10px rgba(121, 194, 168, 0.5),
                0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* --- X-Y Pad Styling --- */
        #audioPad {
            width: 600px; 
            height: 600px;
            border: 3px solid #79C2A8;
            position: relative;
            margin: 20px auto;
            background: rgba(48, 62, 77, 0.4); 
            border-radius: 8px;
            transition: box-shadow 0.3s ease;
        }

        #audioPad:hover {
            box-shadow: 0 0 20px rgba(121, 194, 168, 0.8);
        }

        /* --- Elegant Corner Labels --- */
        .corner-label {
            position: absolute;
            padding: 8px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9em;
            font-weight: 400;
            color: #e0e0e0;
            
            /* Glass/Frosted Effect */
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            backdrop-filter: blur(4px); 
            
            border-radius: 6px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        #labelTL { top: 10px; left: 10px; }
        #labelTR { top: 10px; right: 10px; }
        #labelBL { bottom: 10px; left: 10px; }
        #labelBR { bottom: 10px; right: 10px; }

        #mouseIndicator {
            width: 20px;
            height: 20px;
            background-color: #79C2A8;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 15px 8px rgba(121, 194, 168, 0.7);
            opacity: 0; 
            transition: transform 0.05s ease-out, opacity 0.3s linear;
            z-index: 1000;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Maine Mixer</h1>
    <div id="audioPad">
        <div class="corner-label" id="labelTL">The Cabin</div>
        <div class="corner-label" id="labelTR">The Forest</div>
        <div class="corner-label" id="labelBL">The Lake</div>
        <div class="corner-label" id="labelBR">The Storm</div>
    </div>
</div>
<div id="mouseIndicator"></div>

<script>
    // --- JavaScript Audio Logic (Web Audio API) ---
    const pad = document.getElementById('audioPad');
    const indicator = document.getElementById('mouseIndicator');
    let audioContext = null;
    let gainNodes = [];
    let sourceNodes = [];
    let audioBuffers = {};
    let isPlaying = false; 
    let audioReady = false;
    let mouseInPad = false;

    // AUDIO FILE PATHS: MUST MATCH FILES UPLOADED TO GITHUB'S 'audio/' FOLDER
    const audioFilePaths = {
        TL: 'audio/the_cabin.wav', // Mapped to Gain Index 0
        TR: 'audio/the_forest.wav', // Mapped to Gain Index 1
        BL: 'audio/the_lake.wav', // Mapped to Gain Index 2
        BR: 'audio/the_storm.wav' // Mapped to Gain Index 3
    };
    
    // Define the size of the fade-out buffer zone in pixels
    const FADE_BUFFER_DISTANCE = 100; 

    // --- Helper Functions (Loading Audio) ---
    async function loadAudioFile(url, key) {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            audioBuffers[key] = audioBuffer;
        } catch (error) {
            console.error(`Error loading audio file ${url}:`, error);
        }
    }

    async function loadAllAudioFiles() {
        if (audioReady) return;
        // 🟢 FIX 2: Create AudioContext immediately on user interaction
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        const loadPromises = Object.keys(audioFilePaths).map(key => 
            loadAudioFile(audioFilePaths[key], key)
        );

        await Promise.all(loadPromises);
        
        if (Object.keys(audioBuffers).length === Object.keys(audioFilePaths).length) {
            audioReady = true;
            console.log("All audio files loaded and ready.");

            // Initialize all source nodes and start them silently
            // Order here MUST match the logical TL, TR, BL, BR order above!
            // This is the Quadrant Shift Fix (ensuring the gain calculation maps to the correct source)
            Object.keys(audioBuffers).forEach(key => {
                const buffer = audioBuffers[key];
                const source = audioContext.createBufferSource();
                const gain = audioContext.createGain();

                source.buffer = buffer;
                source.loop = true;
                gain.gain.setValueAtTime(0.0001, audioContext.currentTime); // Start silent
                source.connect(gain);
                gain.connect(audioContext.destination);

                sourceNodes.push(source);
                gainNodes.push(gain);
                source.start(0);
            });
            isPlaying = true;
        } else {
            console.error("Not all audio files loaded successfully.");
        }
    }

    // --- Audio Update Functions ---
    function updateAudioGains(event) {
        if (!audioReady || !isPlaying) return; // Note: mouseInPad check moved outside for global fade effect

        const rect = pad.getBoundingClientRect();
        
        let x = (event.clientX - rect.left) / rect.width;
        let y = (event.clientY - rect.top) / rect.height;

        // Calculate distance from the nearest edge/corner if outside the pad
        let distanceToPad = 0;
        let clampedX = x;
        let clampedY = y;

        if (x < 0) { clampedX = 0; distanceToPad = Math.max(distanceToPad, -x); }
        if (x > 1) { clampedX = 1; distanceToPad = Math.max(distanceToPad, x - 1); }
        if (y < 0) { clampedY = 0; distanceToPad = Math.max(distanceToPad, -y); }
        if (y > 1) { clampedY = 1; distanceToPad = Math.max(distanceToPad, y - 1); }

        // Determine the overall volume based on distance (0=on pad, 1=FADE_BUFFER_DISTANCE away)
        const maxDistance = 1; // max distance in normalized units (0 to 1)
        let normalizedDistance = 0;
        if (distanceToPad > 0) {
            // Need the actual pixel distance to calculate fade zone (100px)
            const pixelDistanceX = (event.clientX - (rect.left + clampedX * rect.width));
            const pixelDistanceY = (event.clientY - (rect.top + clampedY * rect.height));
            const pixelDistance = Math.sqrt(pixelDistanceX * pixelDistanceX + pixelDistanceY * pixelDistanceY);
            
            normalizedDistance = Math.min(1, pixelDistance / FADE_BUFFER_DISTANCE);
        }

        // Global volume factor based on fade zone (1 when inside, 0 when far outside)
        const masterVolume = 1 - normalizedDistance; 
        
        // Clamp x and y to 0-1 for quadrant calculation
        x = Math.min(1, Math.max(0, x));
        y = Math.min(1, Math.max(0, y));

        // Calculate normalized gains for the four corners
        const gainTL_norm = (1 - x) * (1 - y);
        const gainTR_norm = x * (1 - y);
        const gainBL_norm = (1 - x) * y;
        const gainBR_norm = x * y;

        // Apply master volume to the normalized gains
        const gainTL = gainTL_norm * masterVolume;
        const gainTR = gainTR_norm * masterVolume;
        const gainBL = gainBL_norm * masterVolume;
        const gainBR = gainBR_norm * masterVolume;
        
        const now = audioContext.currentTime;
        const rampTime = 0.05; 
        const minimumGain = 0.0001; 

        // 🟢 FIX 1: Connection order is fixed (TL=0, TR=1, BL=2, BR=3)
        if (gainNodes[0]) gainNodes[0].gain.exponentialRampToValueAtTime(Math.max(minimumGain, gainTL), now + rampTime); // TL
        if (gainNodes[1]) gainNodes[1].gain.exponentialRampToValueAtTime(Math.max(minimumGain, gainTR), now + rampTime); // TR
        if (gainNodes[2]) gainNodes[2].gain.exponentialRampToValueAtTime(Math.max(minimumGain, gainBL), now + rampTime); // BL
        if (gainNodes[3]) gainNodes[3].gain.exponentialRampToValueAtTime(Math.max(minimumGain, gainBR), now + rampTime); // BR
    }

    // --- Mouse Handlers ---
    // 🟢 FIX 2: handleMouseEnter now only manages the 'mouseInPad' flag.
    function handleMouseEnter() {
        mouseInPad = true;
    }

    function handleMouseLeave() {
        mouseInPad = false;
    }

    // --- Global Mouse Tracker (Includes Fade Zone Logic) ---
    document.addEventListener('mousemove', (event) => {
        // 🟢 FIX 3: Call updateAudioGains on ALL mouse moves to handle the global fade effect
        if (audioReady && isPlaying) {
             updateAudioGains(event);
        }
        
        // 1. Position the Indicator
        indicator.style.left = `${event.clientX}px`;
        indicator.style.top = `${event.clientY}px`;
        
        const rect = pad.getBoundingClientRect();
        const cursorX = event.clientX;
        const cursorY = event.clientY;

        // 2. Determine visibility based on proximity to the pad
        
        const isOutsideX = cursorX < rect.left || cursorX > rect.right;
        const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

        if (isOutsideX || isOutsideY) {
            // Find the closest point on the rectangle (clamped coordinates)
            const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
            const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

            // Calculate distance from the closest point
            const distance = Math.sqrt(
                Math.pow(cursorX - closestX, 2) + 
                Math.pow(cursorY - closestY, 2)
            );

            // Calculate opacity: 1 when distance=0, 0 when distance=FADE_BUFFER_DISTANCE
            let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
            opacity = Math.min(1, Math.max(0, opacity)); 

            if (opacity > 0) {
                indicator.style.opacity = opacity.toFixed(2);
            } else {
                indicator.style.opacity = '0'; 
            }
        } else {
            // Inside the pad: always fully visible
            indicator.style.opacity = '0.8';
        }

    });

    // --- Event Listeners ---
    // 🟢 FIX 2: Load and start audio silently as soon as possible after DOM is ready
    document.addEventListener('DOMContentLoaded', loadAllAudioFiles);
    
    // Mouse events on the pad only manage the internal flag now.
    pad.addEventListener('mouseenter', handleMouseEnter);
    pad.addEventListener('mouseleave', handleMouseLeave);
    
</script>

</body>
</html>
