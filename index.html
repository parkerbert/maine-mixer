<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allagash Ambience</title> 
    <link rel="icon" type="image/png" href="favicon.png"> 
    
    <style>
        /* --- CORE STYLES (Unchanged) --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            font-family: 'Arial', sans-serif;
            cursor: none;
            color: #C2E2CC; 
        }

        /* --- BACKGROUND LAYERS (Crossfade logic untouched) --- */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2; 
            transition: opacity 3.0s ease-in-out !important; 
        }

        .bg-current { 
            opacity: 1; 
        }
        .bg-next { 
            opacity: 0; 
        }
        
        /* --- TITLE STYLES (Unchanged) --- */
        h1 { font-size: 3.5em; font-family: 'Garamond', 'Times New Roman', serif; color: #C2E2CC; text-shadow: 0 0 10px rgba(194, 232, 204, 0.5); margin-bottom: 5px; }
        h2 { font-size: 1.5em; font-family: 'Garamond', 'Times New Roman', serif; color: #AACCB8; text-shadow: 0 0 5px rgba(194, 232, 204, 0.3); margin-top: 0; margin-bottom: 50px; }
        
        /* --- CONTENT CONTAINER (Unchanged) --- */
        .container {
            position: relative; 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px;
            background-color: rgba(30, 45, 60, 0.85); 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            z-index: -1; 
        }

        /* --- Audio Pad and Controls (Unchanged) --- */
        #audioPad {
            width: 700px; 
            height: 700px; 
            border: 2px solid #79C2A8;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3); 
            box-shadow: 0 0 15px #79C2A8;
            margin: 0;
            border-radius: 5px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .pad-label {
            position: absolute;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #79C2A8;
            font-size: 0.9em;
            border-radius: 3px;
            transition: box-shadow 0.2s, background-color 0.2s, color 0.2s;
            pointer-events: none;
        }

        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }

        .active-glow {
            box-shadow: 0 0 10px #C2E2CC;
            background-color: rgba(194, 232, 204, 0.2);
            color: white;
        }

        /* Mouse Indicator (Unchanged) */
        #mouseIndicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #C2E2CC;
            box-shadow: 0 0 10px #C2E2CC;
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 1000;
        }
        
        /* Explanation Box (Unchanged) */
        #explanationBox {
            position: fixed;
            top: 250px; 
            left: 250px; 
            padding: 15px;
            background-color: rgba(30, 45, 60, 0.85); 
            border: 2px solid #79C2A8; 
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
            color: #C2E2CC;
            text-align: left;
            line-height: 1.4;
            z-index: 5;
        }

        #explanationBox p { white-space: nowrap; margin: 0; }
        
        /* Message Box (Unchanged) */
        .message-box {
            border: 1px solid #FF5555;
            background-color: rgba(255, 85, 85, 0.1);
            color: white;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    
    <div id="bgLayer1" class="bg-layer bg-current"></div>
    <div id="bgLayer2" class="bg-layer bg-next"></div>

    <div id="mouseIndicator"></div>

    <div id="explanationBox">
        <p>
            SPACEBAR&nbsp;-&nbsp;Toggle between day&nbsp;and&nbsp;night<br>
            ENTER&nbsp;-&nbsp;Toggle character&nbsp;interaction
        </p>
    </div>

    <div class="container">
        <h1>Allagash Ambience</h1>
        <h2>An Audio Journey</h2> 
        
        <div id="messageBox" class="message-box"></div> 
        
        <div class="controls-and-pad">
            <div id="audioPad">
                <div id="labelTL" class="pad-label top-left">The Cabin</div> 
                <div id="labelTR" class="pad-label top-right">The Forest</div>
                <div id="labelBL" class="pad-label bottom-left">The Lake</div>
                <div id="labelBR" class="pad-label bottom-right">The Ranger Station</div> 
            </div>
        </div>
            
    </div>
    
    <script>
        // === GLOBAL DOM REFERENCES ===
        let pad = null;
        let indicator = null; 
        let messageBox = null;
        let bgLayer1 = null;
        let bgLayer2 = null;
        let currentBgLayer = null;
        let nextBgLayer = null;
        let labelTL = null;
        let labelTR = null;
        let labelBL = null;
        let labelBR = null;
        let labels = [];

        // === AUDIO API AND STATE VARIABLES ===
        let audioContext = null;
        let gainMap = {}; 
        let audioBuffers = {}; 
        
        // --- ADD-ON STATE (REVERTED TO HTML5 AUDIO LOGIC) ---
        let addOnPlayerMap = {}; // Will hold HTML5 <audio> elements
        let activeAddOnKey = null; // Tracks the currently playing add-on key (e.g., 'TL_Day_AddOn')
        let addOnAudioLoaded = false; 
        // -----------------------------------------------------
        
        let isPlaying = false; 
        let audioReady = false; 
        let nightAudioLoaded = false; 
        let audioInitiated = false; 
        let mouseInPad = false;
        let lastMouseX = 0; 
        let lastMouseY = 0;
        let crossfadePosition = 0.0; // 0.0 = Day, 1.0 = Night
        let isCrossfading = false;
        
        let activeAddOnName = null;
        let isDayMode = true; 


        // === CONFIGURATION CONSTANTS ===
        const cornerNames = {
            'TL': 'Cabin', 'TR': 'Forest', 'BL': 'Lake', 'BR': 'RangerStation'
        };

        // IMAGE PATHS 
        const dayBackgrounds = [
            'images/Woods_Day_1.jpg', 'images/Woods_Day_2.jpg', 'images/Woods_Day_3.jpg', 
            'images/Woods_Day_4.jpg', 'images/Woods_Day_5.jpg'
        ];
        const nightBackgrounds = [
            'images/Woods_Night_1.jpg', 'images/Woods_Night_2.jpg', 'images/Woods_Night_3.jpg', 
            'images/Woods_Night_4.jpg', 'images/Woods_Night_5.jpg'
        ];

        // ADD-ON AUDIO FILES (Now loaded via HTML5 Audio)
        const addOnFilePaths = {
            TL_Day_AddOn: 'audio/Cabin_Day_AddOn.wav', TL_Night_AddOn: 'audio/Cabin_Night_AddOn.wav',    
            TR_Day_AddOn: 'audio/Forest_Day_AddOn.wav', TR_Night_AddOn: 'audio/Forest_Night_AddOn.wav',   
            BL_Day_AddOn: 'audio/Lake_Day_AddOn.wav', BL_Night_AddOn: 'audio/Lake_Night_AddOn.wav',     
            BR_Day_AddOn: 'audio/RangerStation_Day_AddOn.wav', BR_Night_AddOn: 'audio/RangerStation_Night_AddOn.wav' 
        };

        // AMBIENCE AUDIO FILES (Web Audio API Buffers)
        const audioFilePaths = {
            TL_Day: 'audio/Cabin_Day.wav', TR_Day: 'audio/Forest_Day.wav',
            BL_Day: 'audio/Lake_Day.wav', BR_Day: 'audio/RangerStation_Day.wav', 
            TL_Night: 'audio/Cabin_Night.wav', TR_Night: 'audio/Forest_Night.wav',
            BL_Night: 'audio/Lake_Night.wav', BR_Night: 'audio/RangerStation_Night.wav' 
        };
        
        const initialAudioKeys = ['TL_Day', 'TR_Day', 'BL_Day', 'BR_Day']; 
        const nightAudioKeys = ['TL_Night', 'TR_Night', 'BL_Night', 'BR_Night']; 
        const addOnAudioKeys = Object.keys(addOnFilePaths); 

        const ISOLATION_BUFFER_SIZE = 0.333; 
        const MINIMUM_GAIN = 0.0001; 
        const RAMP_TIME = 0.05; 
        const FADE_TIME_TOGGLE = 2.0; // 2.0 seconds for audio crossfade (FROM PDF)
        const FADE_TIME_ADDON_START = 1.0; 
        const FADE_TIME_ADDON_STOP = 0.5; 
        const BACKGROUND_FADE_DELAY = 3000; // 3.0 seconds for visual swap (FROM PDF)
        const MAX_ADDON_VOLUME = 0.5;

        // === HELPER FUNCTIONS ===
        
        function showMessage(text, isError = false) {
            if (!messageBox) return;
            messageBox.textContent = text;
            messageBox.style.display = 'block';
            messageBox.style.backgroundColor = isError ? 'rgba(255, 0, 0, 0.1)' : 'rgba(121, 194, 168, 0.1)'; 
            messageBox.style.borderColor = isError ? '#FF5555' : '#79C2A8'; 
            console.log(`[Status] ${text}`); 
        }
        
        function getRandomBackground(mode) {
            const allImages = mode === 'Day' ? dayBackgrounds : nightBackgrounds; 
            const randomIndex = Math.floor(Math.random() * allImages.length);
            return `url('${allImages[randomIndex]}')`; 
        }

        // FUNCTION: Handles the visual crossfade (PDF LOGIC - DO NOT TOUCH)
        function crossfadeModes(targetMode) {
            if (isCrossfading || !currentBgLayer || !nextBgLayer) return;

            const newBackgroundURL = getRandomBackground(targetMode);

            nextBgLayer.style.backgroundImage = newBackgroundURL; 
            
            currentBgLayer.classList.remove('bg-current'); 
            currentBgLayer.classList.add('bg-next'); 
            
            nextBgLayer.classList.remove('bg-next'); 
            nextBgLayer.classList.add('bg-current'); 

            setTimeout(() => {
                const temp = currentBgLayer; 
                currentBgLayer = nextBgLayer; 
                nextBgLayer = temp; 
                nextBgLayer.style.backgroundImage = 'none';
            }, BACKGROUND_FADE_DELAY); 
        }
        
        // --- Audio Loading Functions ---
        
        async function loadAudioFile(url, key) {
            try {
                const response = await fetch(url); 
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`); 
                }
                const arrayBuffer = await response.arrayBuffer(); 
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer); 
                audioBuffers[key] = audioBuffer; 
            } catch (error) {
                console.error(`ERROR loading audio file ${url}:`, error); 
                showMessage(`Failed to load audio file: ${url}. Check console for details.`, true); 
                return { key, success: false, error: error.message }; 
            }
            return { key, success: true }; 
        }
        
        // --- Core Audio Start Function (ONLY for Ambience) ---
        function connectAndStartAmbienceSource(key, initialGain = 1.0) {
            const buffer = audioBuffers[key]; 
            const source = audioContext.createBufferSource(); 
            const gain = audioContext.createGain(); 

            source.buffer = buffer; 
            source.loop = true; 
            
            gain.gain.setValueAtTime(initialGain, audioContext.currentTime); 
            source.connect(gain); 
            gain.connect(audioContext.destination); 

            gainMap[key] = gain; 
            source.start(0); 
        }
        
        // --- NEW/RESTORED Add-On Loading (HTML5 Audio) ---
        async function loadAddOnAudio() {
            if (addOnAudioLoaded) return true;
            showMessage("Loading Add-On audio files...", false);
            
            // Only need to load the metadata/element, not buffer the files
            const successfulLoads = addOnAudioKeys.length;

            if (successfulLoads > 0) {
                addOnAudioKeys.forEach(key => {
                    const audio = new Audio(addOnFilePaths[key]);
                    audio.loop = true;
                    audio.volume = 0.0; // Start silent
                    addOnPlayerMap[key] = audio;
                });

                addOnAudioLoaded = true;
                showMessage("All audio files loaded. System ready!", false);
                return true; 
            } else {
                showMessage(`ERROR: Failed to initialize Add-On audio elements.`, true);
                return false;
            }
        }
        // -----------------------------------------------------


        // --- Audio Gain and Spatial Functions (Ambience logic untouched) ---

        function applyIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE; 
            if (p <= buffer) { return 0; } 
            if (p >= 1 - buffer) { return 1; } 
            return (p - buffer) / (1 - 2 * buffer); 
        }
        function applyOppositeIsolation(p) {
            const buffer = ISOLATION_BUFFER_SIZE; 
            if (p <= buffer) { return 1; }
            if (p >= 1 - buffer) { return 0; }
            return 1 - ((p - buffer) / (1 - 2 * buffer));
        }

        // Equal Power Crossfade function (PDF LOGIC - DO NOT TOUCH)
        function equalPowerGain(p, isSignal1) {
            if (isSignal1) {
                return Math.cos(p * 0.5 * Math.PI);
            } else {
                return Math.sin(p * 0.5 * Math.PI);
            }
        }
        function getCurrentCorner(x, y) {
            const isTop = y < 0.5;
            const isLeft = x < 0.5; 
            if (isTop && isLeft) return 'TL'; 
            if (isTop && !isLeft) return 'TR'; 
            if (!isTop && isLeft) return 'BL'; 
            if (!isTop && !isLeft) return 'BR'; 
            return null; 
        }

        function updateVisualGlow(gains) {
            const labels = [labelTL, labelTR, labelBL, labelBR]; 
            const threshold = 0.60; 
            
            labels.forEach(label => label.classList.remove('active-glow'));

            const maxGain = Math.max(...gains);
            if (maxGain > threshold) { 
                const maxIndex = gains.indexOf(maxGain); 
                if (labels[maxIndex]) { 
                    labels[maxIndex].classList.add('active-glow'); 
                }
            }
        }
        
        function updateAudioGains(event) {
            if (!audioReady || !isPlaying || !pad) return; 

            const rect = pad.getBoundingClientRect(); 
            
            if (!event.forceFade) {
                lastMouseX = event.clientX; 
                lastMouseY = event.clientY; 
            }
            
            let x = (lastMouseX - rect.left) / rect.width; 
            let y = (lastMouseY - rect.top) / rect.height; 
            
            const rampDuration = event.forceFade ? FADE_TIME_TOGGLE : RAMP_TIME; 
            
            x = Math.min(1, Math.max(0, x));
            y = Math.min(1, Math.max(0, y));
            
            const now = audioContext.currentTime; 
            
            // --- 1. SPATIAL GAIN CALCULATION ---
            const xToRight = applyIsolation(x); 
            const xToLeft = applyOppositeIsolation(x); 
            const yToBottom = applyIsolation(y); 
            const yToTop = applyOppositeIsolation(y); 

            const baseGains = {
                TL: xToLeft * yToTop, TR: xToRight * yToTop,   
                BL: xToLeft * yToBottom, BR: xToRight * yToBottom 
            };
            
            const calculatedGains = [
                baseGains.TL, baseGains.TR, baseGains.BL, baseGains.BR 
            ];

            // --- 2. AMBIENCE DAY/NIGHT CROSSFADE CALCULATION (PDF LOGIC - DO NOT TOUCH) ---
            const dayMix = equalPowerGain(crossfadePosition, true); 
            const nightMix = equalPowerGain(crossfadePosition, false); 
            const ambienceMixes = { Day: dayMix, Night: nightMix }; 

            // Update Ambience Gains (Web Audio API)
            Object.keys(audioFilePaths).forEach(key => { 
                const corner = key.substring(0, 2); 
                const isNight = key.includes('_Night');
                const modeMix = isNight ? nightMix : dayMix;
                const modeBase = baseGains[corner];
                
                const target = Math.max(MINIMUM_GAIN, modeBase * 1.0 * modeMix);
                
                if (gainMap[key]) {
                    gainMap[key].gain.linearRampToValueAtTime(target, now + rampDuration); 
                }
            });
            
            // --- 3. ADD-ON VOLUME CALCULATION (HTML5 AUDIO - RESTORED LOGIC) ---
            if (activeAddOnKey) {
                const corner = activeAddOnKey.substring(0, 2); 
                const mode = activeAddOnKey.includes('_Night') ? 'Night' : 'Day'; 
                const currentAddOn = addOnPlayerMap[activeAddOnKey];

                const modeMix = ambienceMixes[mode];
                const modeBase = baseGains[corner];
                
                // Volume calculation must sync with ambience mix
                const targetVolume = Math.max(MINIMUM_GAIN, modeBase * 1.0 * modeMix * MAX_ADDON_VOLUME);
                
                // Apply volume directly (HTML5 Audio)
                currentAddOn.volume = targetVolume;
            }

            updateVisualGlow(calculatedGains);
        }

        // --- Audio Crossfade Animation (PDF LOGIC - DO NOT TOUCH) ---
        function startCrossfadeAnimation(startPosition, endPosition, duration) {
            isCrossfading = true; 
            const startTime = audioContext.currentTime; 
            const distance = endPosition - startPosition; 
            
            const animate = () => {
                const now = audioContext.currentTime; 
                const elapsed = now - startTime; 
                
                if (elapsed >= duration) { 
                    crossfadePosition = endPosition; 
                    isCrossfading = false; 
                    updateAudioGains({ forceFade: true }); 
                    return; 
                }
                
                let t = elapsed / duration; 
                crossfadePosition = startPosition + distance * t; 
                
                updateAudioGains({ forceFade: true }); 
                
                requestAnimationFrame(animate); 
            };
            
            requestAnimationFrame(animate); 
        }
        
        // --- Day/Night Toggle Function (Updated for HTML5 Add-ons) ---
        async function toggleDayNight() {
            if (!audioReady || isCrossfading) return; 
            
            initializeAudio(); 

            const startPosition = crossfadePosition; 
            const endPosition = (startPosition < 0.5) ? 1.0 : 0.0;
            const targetMode = (endPosition === 1.0) ? 'Night' : 'Day';
            isDayMode = (targetMode === 'Day');
            
            // 1. Start the audio crossfade animation (PDF LOGIC - DO NOT TOUCH)
            startCrossfadeAnimation(startPosition, endPosition, FADE_TIME_TOGGLE); 

            // 2. Trigger the image crossfade (PDF LOGIC - DO NOT TOUCH)
            crossfadeModes(targetMode);

            // 3. Handle add-on switch (NEW HTML5 LOGIC)
            if (activeAddOnKey) {
                const corner = activeAddOnKey.substring(0, 2);
                
                // Stop the old mode add-on
                const oldAddOn = addOnPlayerMap[activeAddOnKey];
                oldAddOn.pause();
                oldAddOn.volume = 0.0;

                // Start the new mode add-on at the same corner
                const newAddOnKey = `${corner}_${targetMode}_AddOn`;
                activeAddOnKey = newAddOnKey; 
                
                const newAddOn = addOnPlayerMap[newAddOnKey];
                newAddOn.volume = MINIMUM_GAIN; // Start quiet
                newAddOn.play().catch(e => console.error("HTML5 Audio Play Error:", e)); 
            }
            
            showMessage(`Switched to ${targetMode} mode.`, false);
        }

        // --- Add-On Toggle Function (HTML5 AUDIO - RESTORED LOGIC) ---
        async function toggleAddOn() {
            initializeAudio(); 
            
            if (!audioReady || !mouseInPad || !addOnAudioLoaded) { 
                if (!addOnAudioLoaded) showMessage("Add-on audio files are still loading or failed to load.", true); 
                if (!mouseInPad) showMessage("Please move your cursor over the audio pad to select a region.", false); 
                return; 
            }
            
            const rect = pad.getBoundingClientRect(); 
            let x = (lastMouseX - rect.left) / rect.width; 
            let y = (lastMouseY - rect.top) / rect.height; 
            const currentCornerKey = getCurrentCorner(x, y); 
            const currentAddOnName = cornerNames[currentCornerKey]; 
            
            const isCurrentlyDay = (crossfadePosition < 0.5); 
            const currentMode = isCurrentlyDay ? 'Day' : 'Night'; 
            const newAddOnKey = `${currentCornerKey}_${currentMode}_AddOn`; 
            
            const newAddOnElement = addOnPlayerMap[newAddOnKey];

            if (activeAddOnKey === newAddOnKey) {
                // CASE 1: Add-on is already active -> TURN OFF
                newAddOnElement.volume = 0.0;
                newAddOnElement.pause();
                activeAddOnName = null;
                activeAddOnKey = null;
                showMessage(`${currentAddOnName} add-on turned OFF.`, false);
                
            } else {
                // CASE 2: Add-on is not active or new add-on selected -> TURN ON (and stop old one)
                
                if (activeAddOnKey && addOnPlayerMap[activeAddOnKey]) {
                    const oldAddOn = addOnPlayerMap[activeAddOnKey];
                    oldAddOn.volume = 0.0;
                    oldAddOn.pause();
                }
                
                activeAddOnName = currentAddOnName;
                activeAddOnKey = newAddOnKey;
                
                // Start the new one playing silently, volume will be set by updateAudioGains
                newAddOnElement.volume = MINIMUM_GAIN; 
                newAddOnElement.play().catch(e => console.error("HTML5 Audio Play Error:", e)); 
                
                updateAudioGains({ forceFade: true, clientX: lastMouseX, clientY: lastMouseY }); 
                
                showMessage(`${currentAddOnName} add-on turned ON.`, false);
            }
        }
        
        // --- Mouse Handling (Unchanged) ---
        function handleMouseMove(event) {
            if (!pad) return; 
            const rect = pad.getBoundingClientRect();
            
            const cursorX = event.clientX;
            const cursorY = event.clientY;
            const isOutsideX = cursorX < rect.left || cursorX > rect.right; 
            const isOutsideY = cursorY < rect.top || cursorY > rect.bottom; 

            if (isOutsideX || isOutsideY) { 
                const closestX = Math.max(rect.left, Math.min(cursorX, rect.right)); 
                const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom)); 
                const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2)); 
                let opacity = 1 - (distance / 150); 
                opacity = Math.min(1, Math.max(0, opacity)); 
                
                if (opacity > 0) { 
                    indicator.style.opacity = opacity.toFixed(2); 
                } else {
                    indicator.style.opacity = '0'; 
                }
                
                if (mouseInPad) handleMouseLeave();
            } else {
                if (!mouseInPad) handleMouseEnter();
                
                indicator.style.opacity = '0.8'; 
                indicator.style.left = `${cursorX}px`;
                indicator.style.top = `${cursorY}px`;
                
                if (audioReady && isPlaying) { 
                    updateAudioGains({ clientX: event.clientX, clientY: event.clientY, forceFade: false }); 
                }
                mouseInPad = true;
            }
        }

        function handleMouseEnter() {
            mouseInPad = true;
            if (audioReady && audioInitiated) {
                 if (messageBox) messageBox.style.display = 'none';
            }
        }

        function handleMouseLeave() {
            mouseInPad = false;
            indicator.style.opacity = '0';
            
            const now = audioContext.currentTime;
            // Fade all ambiance tracks to minimum gain
            Object.keys(gainMap).forEach(key => {
                gainMap[key].gain.linearRampToValueAtTime(MINIMUM_GAIN, now + RAMP_TIME); 
            });
            
            // Stop any active HTML5 audio add-on source (NEW LOGIC)
            if (activeAddOnKey && addOnPlayerMap[activeAddOnKey]) {
                addOnPlayerMap[activeAddOnKey].volume = 0.0;
                addOnPlayerMap[activeAddOnKey].pause();
                activeAddOnKey = null;
                activeAddOnName = null;
            }
            
            // Clear the glow
            updateVisualGlow([0, 0, 0, 0]);
        }

        function initializeAudio() {
            if (!audioInitiated && audioReady) { 
                if (audioContext && audioContext.state === 'suspended') { 
                    audioContext.resume().then(() => { 
                        audioInitiated = true; 
                        showMessage("Audio engaged! Start mixing by moving your cursor.", false); 
                        setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                    });
                } else if (audioContext && audioContext.state === 'running') { 
                    audioInitiated = true; 
                    showMessage("Audio engaged! Start mixing by moving your cursor.", false); 
                    setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 3000); 
                }
            }
        }


        // === KEYBOARD EVENT LISTENER (Unchanged) ===
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') { 
                event.preventDefault(); 
                initializeAudio(); 
                toggleDayNight(); 
            } else if (event.code === 'Enter') { 
                event.preventDefault(); 
                toggleAddOn(); 
            }
        });

        // === INITIALIZATION ===
        document.addEventListener('DOMContentLoaded', async () => {
            pad = document.getElementById('audioPad'); 
            indicator = document.getElementById('mouseIndicator'); 
            messageBox = document.getElementById('messageBox'); 

            bgLayer1 = document.getElementById('bgLayer1');
            bgLayer2 = document.getElementById('bgLayer2');
            currentBgLayer = bgLayer1;
            nextBgLayer = bgLayer2;
            
            labelTL = document.getElementById('labelTL'); 
            labelTR = document.getElementById('labelTR');
            labelBL = document.getElementById('labelBL');
            labelBR = document.getElementById('labelBR');
            labels = [labelTL, labelTR, labelBL, labelBR]; 
            
            currentBgLayer.style.backgroundImage = getRandomBackground('Day'); 
            
            document.addEventListener('mousemove', handleMouseMove); 
            document.addEventListener('mousedown', initializeAudio); 
            document.addEventListener('touchstart', initializeAudio); 

            // Load all ambience audio files on startup.
            const daySuccess = await loadInitialAudio();
            if (!daySuccess) return; 

            const nightSuccess = await loadNightAudio();
            if (!nightSuccess) return; 
            
            // Load HTML5 Audio elements for add-ons (NEW/RESTORED LOGIC)
            const addOnSuccess = await loadAddOnAudio();
            if (!addOnSuccess) return;

            setTimeout(() => { if (messageBox) messageBox.style.display = 'none'; }, 2000); 
        });
    </script>
    
</body>
</html>
