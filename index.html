<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allagash Ambience</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* --- CORE STYLES (Unchanged) --- */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    cursor: none;
    color: #C2E2CC;
}
/* --- BACKGROUND LAYERS (Unchanged) --- */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: -2;
    transition: opacity 3.0s ease-in-out !important;
}
.bg-current { opacity: 1; }
.bg-next { opacity: 0; }
/* --- TITLE STYLES (Restored) */
h1 {
    font-size: 3.0em; 
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #C2E2CC;
    text-shadow: 0 0 10px rgba(194, 232, 204, 0.5);
    margin-bottom: 5px; 
}
h2 {
    font-size: 1.2em; 
    font-family: 'Garamond', 'Times New Roman', serif;
    color: #AACCB8;
    text-shadow: 0 0 5px rgba(194, 232, 204, 0.3);
    margin-top: 0;
    margin-bottom: 10px; 
}
/* --- CONTENT CONTAINER (MODIFIED FOR CENTERING) --- 
The container is now explicitly set to a max-width and centered.
*/
.container {
    /* Existing resets */
    padding: 0;
    
    /* FIX: Set max width and center the container */
    width: 100%;
    max-width: 800px; 
    margin: 0 auto; 
    
    /* Layout properties for grid */
    display: grid;
    /* This creates a single column layout */
    grid-template-areas: 
        "title" 
        "mixpad";
    /* Place the title and mix pad in their respective areas */
}

.centered-title {
    /* 1. Center the text horizontally within its grid area */
    text-align: center;
    /* 2. Assign it to the 'title' area */
    grid-area: title;
    /* Ensure it fills the new container width */
    width: 100%; 
    /* Optional: Give it some spacing above the mix pad */
    margin-bottom: 15px; 
}

.mix-pad {
    /* Assign it to the 'mixpad' area */
    grid-area: mixpad;
    /* Ensure the mix pad takes up the full width of the container (max-width/margin handled by parent) */
    width: 100%;
}
/* --- Audio Pad and Controls (All Margins Adjusted) --- */
#audioPad {
    /* Set to 70vh for better vertical scaling on laptops */
    width: min(70vh, 80vw); 
    height: min(70vh, 80vw);
    
    max-width: 700px;
    max-height: 700px;
    
    border: 2px solid #79C2A8;
    position: relative;
    background-color: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 15px #79C2A8;
    margin: 20px auto; /* Centered with a margin */
    border-radius: 5px;
    transition: box-shadow 0.3s, border-color 0.3s;
    /* Allow clicks inside the pad, but not on the pad itself to avoid interfering with mousemove */
    pointer-events: all;
}
/* ADDED: Class for dynamic mixpad border glow (MAXIMUM INTENSITY AND SIZE) */
.pad-active-glow {
    box-shadow: 
        0 0 60px #C2E2CC, /* Main, tight glow (UNCHANGED) */
        
        /* MODIFIED: Extreme size (450px) and full opacity (1.0) for the halo */
        0 0 450px rgba(194, 232, 204, 1); 
        
    border-color: #C2E2CC !important;
}

/* --- PAD LABELS (Text) --- */
.pad-label {
    position: absolute;
    padding: 8px 12px;
    
    /* MODIFIED: Set a baseline background and shadow (almost invisible) */
    background-color: rgba(0, 0, 0, 0.8);
    box-shadow: 0 0 0px rgba(194, 232, 204, 0.0); /* Base shadow is now 0px and 0 opacity */
    color: #C2E2CC; /* Base color */
    
    border: 1px solid #79C2A8;
    font-size: 0.9em;
    border-radius: 3px;
    
    /* MODIFIED: Increased transition time for a smooth fade effect on CSS changes */
    transition: box-shadow 0.4s, background-color 0.4s, color 0.4s;
    
    pointer-events: none;
    z-index: 1;
}

/* REMOVED: The .active-glow class is no longer needed. We will apply styles directly. */
.top-left { top: 15px; left: 15px; }
.top-right { top: 15px; right: 15px; }
.bottom-left { bottom: 15px; left: 15px; }
.bottom-right { bottom: 15px; right: 15px; }
.active-glow {
    box-shadow: 0 0 10px #C2E2CC;
    background-color: rgba(194, 232, 204, 0.2);
    color: white;
}
/* --- ADDON ICON STYLES (NO GLOW, NO BORDER, PURE IMAGE) --- */

/* 1. The main class (Defines appearance/fade, but NO SIZE) */
.addon-icon {
    position: absolute;
    opacity: 1.0; 
    
    /* RESTORED: This handles the base 0.5s fade for mouse entry/exit */
    transition: opacity 0.5s ease-in-out; 
    
    pointer-events: all;
    cursor: pointer;
}

/* --- UPDATED SIZE AND POSITION (Individual Control) --- */

/* 2. Top-Left Icon (Cabin: 30% Default Size) */
#iconTL {
    width: 45%;
    height: 45%;
}

/* 3. Top-Right Icon (Forest: 42% Larger Size) */
#iconTR {
    width: 48%; 
    height: 48%;
}

/* 4. Bottom-Left Icon (Lake: 30% Default Size) */
#iconBL {
    width: 60%; 
    height: 60%;
}

/* 5. Bottom-Right Icon (Ranger: 30% Default Size) */
#iconBR {
    width: 45%;
    height: 45%;
}

/* 4. Style to ensure the PNG scales to fit its container */
.addon-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Scales image without distortion */
}

/* 5. The glow class for activated AddOns (REMOVED: NO GLOW) */
/* This class is now only a marker to indicate the audio is ON */
.icon-active-glow {
    /* No visual effect here. The icon is already at opacity 1.0 */
}

/* 6. Positioning for the "Overhang" Effect (10% marks) */
.top-left-icon    { top: 29%; left: 15%; transform: translate(-50%, -50%); } 
.top-right-icon   { top: 30%; right: 10%; transform: translate(50%, -50%); }
.bottom-left-icon { bottom: 25%; left: 20%; transform: translate(-50%, 50%); }
.bottom-right-icon{ bottom: 30%; right: 15%; transform: translate(50%, 50%); }

/* 7. Class to hide icons when inactive/out of quadrant */
.icon-hidden {
    opacity: 0.0 !important; /* Forces complete invisibility */
    /* NO TRANSITION needed here, the main class handles it */
}
/* 8. Override class for slow transitions (Day/Night Crossfade) */
.slow-fade-icon {
    /* Ensures the 2.0s transition overrides the 0.5s transition */
    transition: opacity 2.0s ease-in-out !important; 
}
/* --- CURSOR INDICATOR (Unchanged) --- */
#mouseIndicator {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: #C2E2CC;
    box-shadow: 0 0 10px #C2E2CC;
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 1000;
}
/* Explanation Box - RESPONSIVE POSITIONING (Unchanged) */
#explanationBox {
    position: fixed;
    top: 5vh;   
    left: 5vw;  
    padding: 15px;
    background-color: rgba(30, 45, 60, 0.85);
    border: 2px solid #79C2A8;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    font-family: 'Arial', sans-serif;
    font-size: 0.9em;
    color: #C2E2CC;
    text-align: left;
    line-height: 1.4;
    z-index: 5;
    pointer-events: none;  
}
#explanationBox p {
    white-space: nowrap;
    margin: 0; 
}
.message-box {
    /* Kept for element definition, but will remain hidden */
    border: 1px solid #FF5555;
    background-color: rgba(255, 85, 85, 0.1);
    color: white;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 5px;
    display: none; 
}
</style>

const ISOLATION_BUFFER_SIZE = 0.333;
const MINIMUM_GAIN = 0.0001;
const RAMP_TIME = 0.05;
const LABEL_GLOW_THRESHOLD = 0.5;
const FADE_TIME_TOGGLE = 2.0
const FADE_TIME_ADDON_STOP = 1.0;

// --- Helper Functions (Console logging only) ---
function showMessage(text, isError = false) {
    const prefix = isError ? '[ERROR]' : '[Status]';
    // Only log to console, do not modify the DOM messageBox
    console.log(`${prefix} ${text}`); 
}

function playSfx(key) {
    if (!audioContext || !sfxLoaded) return;
    
    const buffer = audioBuffers[key];
    if (!buffer) {
        console.warn(`SFX buffer not found for key: ${key}`);
        return;
    }

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start(0);
}


async function loadAudioFile(url, key) {
    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`HTTP error ${response.status}`);
        }
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[key] = audioBuffer;
    } catch (error) {
        console.error(`ERROR loading audio file ${url}: `, error);
        showMessage(`Failed to load audio file: ${url}. Check console for details.`, true);
        return { key, success: false, error: error.message };
    }
    return { key, success: true };
}

// --- Core Ambience Start Function (Unchanged) --
function connectAndStartAmbienceSource(key, initialGain = 1.0) {
    const buffer = audioBuffers[key];
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    gainMap[key] = gain;
    source.start(0);
}

// --- AddOn Audio Start Function (Starts running silently - Unchanged) ---
function connectAndStartAddOnSource(key) {
    const buffer = audioBuffers[key];
    if (!buffer) return; 
    
    const source = audioContext.createBufferSource();
    const gain = audioContext.createGain();
    source.buffer = buffer;
    source.loop = true;
    
    // Start silent (volume controlled by the spatial mix)
    gain.gain.setValueAtTime(MINIMUM_GAIN, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    
    // Update the state map for this specific AddOn
    addOnStateMap[key].source = source;
    addOnStateMap[key].gain = gain;
    
    // Start the source immediately and let it run forever
    source.start(0);
}

// --- On-Demand Loading Functions (showMessage calls updated) ---
async function loadInitialAudio() {
    if (audioReady) return;
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    currentBgLayer.style.backgroundImage = getRandomBackground('Day');
    showMessage("Loading Day ambiance audio files (4/8 Ambience)...");
    const loadPromises = initialAudioKeys.map(key =>
        loadAudioFile(audioFilePaths[key], key)
    );
    const results = await Promise.all(loadPromises);
    const successfulLoads = results.filter(r => r && r.success).length;
    const totalFiles = initialAudioKeys.length;
    if (successfulLoads === totalFiles) {
        initialAudioKeys.forEach(key => connectAndStartAmbienceSource(key, 1.0));
        audioReady = true;

    if (p >= 1 - buffer) { return 0; }

}

{

function startCrossfade(targetIsNight) {
    if (isCrossfading) return;
    isCrossfading = true;

    const duration = FADE_TIME_TOGGLE;
    const startTime = audioContext.currentTime;
    const startPosition = crossfadePosition;
    const endPosition = targetIsNight ? 1.0 : 0.0;
    const distance = endPosition - startPosition;

    const animate = () => {
        const now = audioContext.currentTime;
        const elapsed = now - startTime;

        if (elapsed >= duration) {
            crossfadePosition = endPosition;
            isCrossfading = false;
            updateAudioGains({ forceFade: true });
            return;
        }

        let t = elapsed / duration;
        crossfadePosition = startPosition + distance * t;
        updateAudioGains({ forceFade: true });

        requestAnimationFrame(animate);
    };

    requestAnimationFrame(animate);
}

function handleMouseMove(event) {
    if (!audioReady || !isPlaying || !pad) return;

    const rect = pad.getBoundingClientRect();
    const cursorX = event.clientX;
    const cursorY = event.clientY;
    
    // NOTE: lastMouseX and lastMouseY are set here, even if outside the pad,
    // which is necessary for the instant toggle logic in toggleAddOn.
    lastMouseX = event.clientX;
    lastMouseY = event.clientY;

    const isOutsideX = cursorX < rect.left || cursorX > rect.right;
    const isOutsideY = cursorY < rect.top || cursorY > rect.bottom;

    if (isOutsideX || isOutsideY) {
        // Mouse is outside the pad, handle visual fade
        const closestX = Math.max(rect.left, Math.min(cursorX, rect.right));
        const closestY = Math.max(rect.top, Math.min(cursorY, rect.bottom));

        const distance = Math.sqrt(Math.pow(cursorX - closestX, 2) + Math.pow(cursorY - closestY, 2));
        let opacity = 1 - (distance / FADE_BUFFER_DISTANCE);
        opacity = Math.min(1, Math.max(0, opacity));

        if (opacity > 0) {
            indicator.style.left = `${cursorX}px`;
            indicator.style.top = `${cursorY}px`;
            indicator.style.opacity = opacity.toFixed(2);
        } else {
            indicator.style.opacity = '0';
        }
        // When mouse is outside, call updateAudioGains to fade ambiance out 
        updateAudioGains(); 
    } else {
        // Mouse is inside the pad
        indicator.style.left = `${cursorX}px`;
        indicator.style.top = `${cursorY}px`;
        indicator.style.opacity = '1';

        updateAudioGains(event);
    }
}
