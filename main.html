<style>
    /* The Black Curtain */
#fade-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    z-index: 9999;
    transition: opacity 3.0s ease-in-out; /* Slow curtain draw */
    pointer-events: none;
}

/* The UI Container */
.container {
    opacity: 0; /* Start hidden */
    transition: opacity 2.5s ease-in-out;
    z-index: 10;
}

/* The Trigger Class */
.container-visible {
    opacity: 1 !important;
}

/* Background Layers */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    opacity: 0;
    transition: opacity 3s ease-in-out;

.bg-current { opacity: 1 !important; }

    min-height: 100vh;
    font-family: 'Roboto', sans-serif; /* 👈 MODIFIED */
    cursor: none;
    color: #C2E2CC;

/* --- BACKGROUND LAYERS (Unchanged) --- */
.bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: -2;
    transition: opacity 3.0s ease-in-out !important;

.bg-current { opacity: 1; }
.bg-next { opacity: 0; }

.sub-title {

    margin-top: 0;

The container is now explicitly set to a max-width and centered.
*/
.container {
    /* Existing resets */
    padding: 0;
    
    /* FIX: Set max width and center the container */
    width: 100%;
    max-width: 800px; 
    margin: 0 auto; 
    
    /* Layout properties for grid */
    display: grid;
    /* This creates a single column layout */
    grid-template-areas: 
        "title" 
        "mixpad";
    /* Place the title and mix pad in their respective areas */
}

.centered-title {
    /* 1. Center the text horizontally within its grid area */
    text-align: center;
    /* 2. Assign it to the 'title' area */
    grid-area: title;
    /* Ensure it fills the new container width */
    width: 100%; 
    /* Optional: Give it some spacing above the mix pad */
    margin-bottom: 15px; 
}

.mix-pad {
    /* Assign it to the 'mixpad' area */
    grid-area: mixpad;
    /* Ensure the mix pad takes up the full width of the container (max-width/margin handled by parent) */
    width: 100%;
}
/* --- Audio Pad and Controls (All Margins Adjusted) --- */
#audioPad {
    /* Set to 70vh for better vertical scaling on laptops */
    width: min(70vh, 80vw); 
    height: min(70vh, 80vw);
    
    max-width: 700px;
    max-height: 700px;
    
    border: 3px solid #79C2A8;
    position: relative;
    background-color: rgba(0, 0, 0, 0.3);
    box-shadow: 0 0 25px #79C2A8;
    margin: 20px auto; /* Centered with a margin */
    border-radius: 5px;
    transition: box-shadow 0.3s, border-color 0.3s;
    /* Allow clicks inside the pad, but not on the pad itself to avoid interfering with mousemove */
    pointer-events: all;

/* 5. Bottom-Right Icon (Ranger: 30% Default Size) */

function playSfx(key) {
    if (!audioContext || !sfxLoaded) return;
    
    const buffer = audioBuffers[key];
    if (!buffer) {
        console.warn(`SFX buffer not found for key: ${key}`);
        return;
    }

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    
    // Connect the source
    source.connect(audioContext.destination);
    
    // ⭐️ CRITICAL FIX: Add 'ended' event listener
    // This ensures the source is only disconnected (and made available for GC)
    // AFTER it has finished playing the buffer entirely.

async function loadAudioFile(url, key) {

        if (!response.ok) {

        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[key] = audioBuffer;
    } catch (error) {
        console.error(`ERROR loading audio file ${url}: `, error);

        return { key, success: false, error: error.message };
    }
    return { key, success: true };

    source.buffer = buffer;
    source.loop = true;
    gain.gain.setValueAtTime(initialGain, audioContext.currentTime);
    source.connect(gain);
    gain.connect(audioContext.destination);
    gainMap[key] = gain;
    source.start(0);

// --- 1. Audio Gain Logic ---
function equalPowerGain(position, isDay) {
    const angle = position * 0.5 * Math.PI;
    return isDay ? Math.cos(angle) : Math.sin(angle);
}

function applyIsolation(p) {
    const buffer = typeof ISOLATION_BUFFER_SIZE !== 'undefined' ? ISOLATION_BUFFER_SIZE : 0.1;
    if (p <= buffer) return 0;
    if (p >= 1 - buffer) return 1;
    return (p - buffer) / (1 - 2 * buffer);
}

function applyOppositeIsolation(p) {
    const buffer = typeof ISOLATION_BUFFER_SIZE !== 'undefined' ? ISOLATION_BUFFER_SIZE : 0.1;
    if (p <= buffer) return 1;
    if (p >= 1 - buffer) return 0;
    return (1 - p - buffer) / (1 - 2 * buffer);
}

function getCurrentCorner(x, y) {
    const isTop = y < 0.5;
    const isLeft = x < 0.5;
    if (isTop && isLeft) return 'TL';
    if (isTop && !isLeft) return 'TR';
    if (!isTop && isLeft) return 'BL';
    if (!isTop && !isLeft) return 'BR';
    return null;
}

function fadeInInitialAudio() {

    const now = audioContext.currentTime;
    initialAudioKeys.forEach(key => {

function updateAudioGains(event) {
    // CRITICAL SAFETY CHECK: Exit if elements aren't ready
    if (!audioReady || !isPlaying || !pad || !addOnIcons['TL']) return;

    const rect = pad.getBoundingClientRect();

    if (event && event.clientX && !event.forceFade) { 
        lastMouseX = event.clientX;
        lastMouseY = event.clientY;
    }

    let x = (lastMouseX - rect.left) / rect.width;
    let y = (lastMouseY - rect.top) / rect.height;
    
    // Ensure x/y stay in bounds for calculations
    x = Math.max(0, Math.min(1, x));
    y = Math.max(0, Math.min(1, y));

    const isCurrentlyDay = (crossfadePosition < 0.5); 
    const currentMode = isCurrentlyDay ? 'Day' : 'Night';
    const currentCorner = getCurrentCorner(x, y);

    // --- ICON VISIBILITY UPDATE ---
    ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
        const iconElement = addOnIcons[cornerKey];
        if (!iconElement) return;

        const addOnKey = `${cornerKey}_${currentMode}_AddOn`;
        const state = addOnStateMap[addOnKey];

        // 1. Handle Glow State
        if (state && state.active) {
            iconElement.classList.add('icon-active-glow');
        } else {
            iconElement.classList.remove('icon-active-glow');
        }
        
        // 2. Handle Hidden State (Only show if active AND mouse is in quadrant)
        if (state && state.active && cornerKey === currentCorner) {
            iconElement.classList.remove('icon-hidden');
        } else {
            iconElement.classList.add('icon-hidden');
        }
    });

    const rampDuration = (event && event.forceFade) ? 1.0 : 0.05;
    const now = audioContext.currentTime;
    
    const xToRight = applyIsolation(x);
    const xToLeft = applyOppositeIsolation(x);
    const yToBottom = applyIsolation(y);
    const yToTop = applyOppositeIsolation(y);

    const baseGains = {
        TL: xToLeft * yToTop,
        TR: xToRight * yToTop,
        BL: xToLeft * yToBottom,
        BR: xToRight * yToBottom
    };

    // --- PROPORTIONAL LABEL GLOW ---
    labels.forEach(label => {
        if (!label) return;
        const corner = label.getAttribute('data-corner');
        let proximity = baseGains[corner] || 0; 
        let glowFactor = Math.pow(proximity, 3); 
        
        let shadowSize = Math.min(10, Math.round(glowFactor * 10));
        let shadowOpacity = Math.min(1.0, glowFactor * 1.0);
        let bgOpacity = Math.min(0.2, glowFactor * 0.2); 
        
        label.style.boxShadow = `0 0 ${shadowSize}px rgba(194, 232, 204, ${shadowOpacity})`;
        label.style.backgroundColor = `rgba(194, 232, 204, ${bgOpacity})`;
        label.style.color = glowFactor > 0.5 ? 'white' : '#C2E2CC';
    });

    const dayMix = equalPowerGain(crossfadePosition, true);
    const nightMix = equalPowerGain(crossfadePosition, false);
    
    const ambienceMixes = { Day: dayMix, Night: nightMix };

    ['TL', 'TR', 'BL', 'BR'].forEach(cornerKey => {
        if (gainMap[`${cornerKey}_Day`]) {
            gainMap[`${cornerKey}_Day`].gain.linearRampToValueAtTime(baseGains[cornerKey] * dayMix, now + rampDuration);
        }
        if (gainMap[`${cornerKey}_Night`]) {
            gainMap[`${cornerKey}_Night`].gain.linearRampToValueAtTime(baseGains[cornerKey] * nightMix, now + rampDuration);
        }
    });

    // --- ADD-ON GAIN UPDATE (WITH HARD BOUNDARY FIX) ---
addOnAudioKeys.forEach(addOnKey => {
    const state = addOnStateMap[addOnKey];
    if (state && state.gain) { 
        const corner = addOnKey.substring(0, 2); // 'TL', 'TR', 'BL', or 'BR'
        const mode = addOnKey.includes('_Night') ? 'Night' : 'Day';
        
        // 1. HARD BOUNDARY CHECK: Compare the Add-On's corner to the mouse's corner
        // This forces the Ranger Station (BR) to be silent if the mouse is in TL, TR, or BL.
        const isInCorrectQuadrant = (corner === currentCorner);

        let target = 0;
        
        // 2. Only calculate volume if the Add-On is active AND the mouse is inside its quadrant
        if (state.active && isInCorrectQuadrant) {
            // Apply the standard isolation math using the baseGains gradient
            target = baseGains[corner] * ambienceMixes[mode] * 0.8;
        }

        // 3. Apply the gain transition
        const now = audioContext.currentTime;
        state.gain.gain.linearRampToValueAtTime(target, now + rampDuration);
    }
});
}

function startCrossfade(targetIsNight) {
    if (isCrossfading) return;
    isCrossfading = true;
    const duration = 2.0;
    const startTime = audioContext.currentTime;
    const startPosition = crossfadePosition;
    const endPosition = targetIsNight ? 1.0 : 0.0;

    const animate = () => {
        const now = audioContext.currentTime;
        const elapsed = now - startTime;
        if (elapsed >= duration) {
            crossfadePosition = endPosition;
            isCrossfading = false;
            updateAudioGains({ forceFade: true });
            return;
        }
        crossfadePosition = startPosition + (endPosition - startPosition) * (elapsed / duration);
        updateAudioGains({ forceFade: true });
        requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
}

    // We can also ensure the mouseInPad flag is set if you need it for other logic
    // This assumes you have a `let mouseInPad = false;` defined near the top.
    // If not, simply remove `mouseInPad = true;`.
    mouseInPad = true; 
}

function handleMouseLeave() {
    // NEW: Dim the mixpad border glow
    if (pad) {
        pad.classList.remove('pad-active-glow');
    }
    // Ensure the mouseInPad flag is cleared
    mouseInPad = false;
}
function initializeAudio() {
    if (!audioInitiated && audioReady) {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume().then(() => {
                audioInitiated = true;
                showMessage("Audio engaged! Start mixing by moving your cursor.", false);
            });
        } else if (audioContext && audioContext.state === 'running') {
            audioInitiated = true;
        }
    }
}

// --- Keyboard Event Listener (Unchanged) ---
document.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
        event.preventDefault(); 
        initializeAudio(); 
        toggleDayNight();
    } 
    else if (event.code === 'Enter' || event.code === 'NumpadEnter') { 
        event.preventDefault(); 
        // Call toggleAddOn without arguments. It will use the last mouse position.
        toggleAddOn(); 
    }
});
// 3. Cinematic Fade In
    const overlay = document.getElementById('fade-overlay');
    const container = document.querySelector('.container');
    if (overlay) {
        setTimeout(() => {
            overlay.style.opacity = '0';
            if (container) container.classList.add('container-visible');
            setTimeout(() => overlay.style.display = 'none', 3000);
        }, 500);
    }


// --- INITIALIZATION SEQUENCE ---
document.addEventListener('DOMContentLoaded', async () => {
    // 1. Element lookups
    pad = document.getElementById('audioPad');
    indicator = document.getElementById('mouseIndicator');
    messageBox = document.getElementById('messageBox'); // Kept for reference, but won't display.
    
    bgLayer1 = document.getElementById('bgLayer1');
    bgLayer2 = document.getElementById('bgLayer2');
    currentBgLayer = bgLayer1;
    nextBgLayer = bgLayer2;
    
    labelTL = document.getElementById('labelTL');
    labelTR = document.getElementById('labelTR');
    labelBL = document.getElementById('labelBL');
    labelBR = document.getElementById('labelBR');
    labels = [labelTL, labelTR, labelBL, labelBR]; 
    
    // NEW: Icon Element Lookups
    iconTL = document.getElementById('iconTL');
    iconTR = document.getElementById('iconTR'); // Fixed this element lookup in previous response
    iconBL = document.getElementById('iconBL');
    iconBR = document.getElementById('iconBR');
    
    // NEW: Populate the icon map (all elements are referenced correctly now)
    addOnIcons = {
        'TL': iconTL,
        'TR': iconTR,
        'BL': iconBL,
        'BR': iconBR
    };

    if (pad) {
        pad.addEventListener('mouseenter', handleMouseEnter);
        pad.addEventListener('mouseleave', handleMouseLeave);
        // NEW: Add click listener to the audioPad element (from previous response).
        pad.addEventListener('click', toggleAddOn); 
    }

    // 2. Load all audio files asynchronously
    const daySuccess = await loadInitialAudio();
    if (!daySuccess) return; 

    const nightSuccess = await loadNightAudio();
    if (!nightSuccess) return; 
    
    const addOnSuccess = await loadAddOnAudio(); 
    if (!addOnSuccess) return;

    const sfxSuccess = await loadSfxAudio();

});

document.addEventListener('mousemove', handleMouseMove);

// Initial click/tap listener to unlock AudioContext
document.addEventListener('mousedown', initializeAudio);
document.addEventListener('touchstart', initializeAudio);

// Touch-specific listeners
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd);
